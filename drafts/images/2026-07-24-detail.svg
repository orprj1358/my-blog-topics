<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="pagebg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="cardLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="cardRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="badgeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="badgeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1e3a8a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="600" fill="url(#pagebg)"/>

  <text x="400" y="46" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e3a8a">무엇이 정해졌고, 무엇이 남았을까</text>
  <text x="400" y="70" text-anchor="middle" font-size="13" fill="#3b5a9a">※ 아래 구성은 이해를 돕기 위한 예시이며, 실제 발표 항목·순서와 다를 수 있습니다</text>

  <!-- left column: 어제 대토론회에서 제시된 것 -->
  <rect x="56" y="104" width="310" height="420" rx="20" fill="url(#cardLeft)" filter="url(#softShadow)"/>
  <circle cx="100" cy="146" r="22" fill="url(#badgeLeft)"/>
  <text x="100" y="153" text-anchor="middle" font-size="17" font-weight="bold" fill="#5a3d00">어제</text>
  <text x="230" y="153" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">대토론회에서 제시된 것</text>

  <rect x="78" y="180" width="266" height="1" fill="#bfdbfe" opacity="0.5"/>

  <circle cx="94" cy="216" r="6" fill="#e0f2fe"/>
  <text x="112" y="221" font-size="13" fill="#e0f2fe">공급·금융·세제 세 갈래</text>
  <text x="112" y="241" font-size="13" fill="#e0f2fe">논의를 한자리에서 종합</text>

  <circle cx="94" cy="276" r="6" fill="#e0f2fe"/>
  <text x="112" y="281" font-size="13" fill="#e0f2fe">정책 방향과 원칙에 대한</text>
  <text x="112" y="301" font-size="13" fill="#e0f2fe">큰 그림 제시</text>

  <circle cx="94" cy="336" r="6" fill="#e0f2fe"/>
  <text x="112" y="341" font-size="13" fill="#e0f2fe">이후 발표될 대책들의</text>
  <text x="112" y="361" font-size="13" fill="#e0f2fe">전체적인 방향성 예고</text>

  <rect x="78" y="404" width="266" height="94" rx="12" fill="#ffffff" opacity="0.14"/>
  <text x="211" y="432" text-anchor="middle" font-size="12.5" fill="#e0f2fe">구체적인 수치나</text>
  <text x="211" y="452" text-anchor="middle" font-size="12.5" fill="#e0f2fe">확정된 시행안까지는</text>
  <text x="211" y="472" text-anchor="middle" font-size="12.5" fill="#e0f2fe">아직 나오지 않은 단계</text>

  <!-- right column: 앞으로 나올 것 -->
  <rect x="434" y="104" width="310" height="420" rx="20" fill="url(#cardRight)" filter="url(#softShadow)"/>
  <circle cx="478" cy="146" r="22" fill="url(#badgeRight)"/>
  <text x="478" y="153" text-anchor="middle" font-size="17" font-weight="bold" fill="#0c2340">앞으로</text>
  <text x="608" y="153" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">순차적으로 나올 것</text>

  <rect x="456" y="180" width="266" height="1" fill="#e0f2fe" opacity="0.6"/>

  <circle cx="472" cy="216" r="6" fill="#f0f9ff"/>
  <text x="490" y="221" font-size="13" fill="#f0f9ff">부동산 종합대책</text>
  <text x="490" y="241" font-size="13" fill="#f0f9ff">(공급·재건축 세부안)</text>

  <circle cx="472" cy="276" r="6" fill="#f0f9ff"/>
  <text x="490" y="281" font-size="13" fill="#f0f9ff">세제개편안</text>
  <text x="490" y="301" font-size="13" fill="#f0f9ff">(다주택자·1주택 기준)</text>

  <circle cx="472" cy="336" r="6" fill="#f0f9ff"/>
  <text x="490" y="341" font-size="13" fill="#f0f9ff">금융권 후속 지침</text>
  <text x="490" y="361" font-size="13" fill="#f0f9ff">(대출 관리 세부 기준)</text>

  <rect x="456" y="404" width="266" height="94" rx="12" fill="#ffffff" opacity="0.18"/>
  <text x="589" y="432" text-anchor="middle" font-size="12.5" fill="#f0f9ff">발표 시점과 조건은</text>
  <text x="589" y="452" text-anchor="middle" font-size="12.5" fill="#f0f9ff">그때그때 달라질 수 있어</text>
  <text x="589" y="472" text-anchor="middle" font-size="12.5" fill="#f0f9ff">일정 확인이 중요</text>

  <!-- center connector -->
  <g transform="translate(400,314)">
    <circle cx="0" cy="0" r="26" fill="#ffffff" filter="url(#softShadow)"/>
    <path d="M-9,-11 L11,0 L-9,11 Z" fill="#1e3a8a"/>
  </g>

  <text x="400" y="560" text-anchor="middle" font-size="12" fill="#3b5a9a">헤드라인보다 후속 발표 일정을 차분히 따라가는 편이 안전합니다</text>
</svg>
