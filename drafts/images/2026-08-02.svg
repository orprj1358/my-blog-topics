<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="55%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>

  <circle cx="1080" cy="120" r="240" fill="url(#glow)"/>
  <circle cx="100" cy="560" r="180" fill="url(#glow)"/>

  <!-- clock / countdown icon cluster (DSR deadline motif) -->
  <g transform="translate(150,180)">
    <circle cx="0" cy="0" r="92" fill="url(#cream)" opacity="0.96"/>
    <circle cx="0" cy="0" r="92" fill="none" stroke="#c2410c" stroke-width="4" opacity="0.5"/>
    <circle cx="0" cy="0" r="52" fill="none" stroke="#9a3412" stroke-width="5"/>
    <line x1="0" y1="0" x2="0" y2="-32" stroke="#9a3412" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="22" y2="10" stroke="#9a3412" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="#7c2d12"/>
  </g>

  <!-- queue of people (open-run / rush motif) -->
  <g transform="translate(255,330)" opacity="0.94">
    <circle cx="-24" cy="-8" r="10" fill="#fff7ed"/>
    <rect x="-33" y="4" width="18" height="24" rx="7" fill="#fff7ed"/>
    <circle cx="0" cy="-12" r="11" fill="#fff7ed"/>
    <rect x="-10" y="1" width="20" height="27" rx="7" fill="#fff7ed"/>
    <circle cx="26" cy="-8" r="10" fill="#ffedd5"/>
    <rect x="17" y="4" width="18" height="24" rx="7" fill="#ffedd5"/>
  </g>
  <text x="255" y="392" text-anchor="middle" font-size="16" fill="#ffedd5">9월 DSR 강화 앞둔 대출 창구</text>

  <!-- percent badge accent -->
  <g transform="translate(1000,440)" opacity="0.65">
    <circle cx="0" cy="0" r="34" fill="none" stroke="#ffedd5" stroke-width="4"/>
    <circle cx="-10" cy="-10" r="6" fill="#ffedd5"/>
    <circle cx="10" cy="10" r="6" fill="#ffedd5"/>
    <line x1="-13" y1="13" x2="13" y2="-13" stroke="#ffedd5" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- title text block -->
  <text x="420" y="190" font-size="33" font-weight="bold" fill="#fffbeb">9월 DSR 2단계 앞두고</text>
  <text x="420" y="242" font-size="33" font-weight="bold" fill="#fffbeb">대출 '오픈런' 왜?</text>
  <text x="420" y="286" font-size="18" fill="#ffedd5">서두르기 전에 확인할 것들</text>

  <!-- bottom tag -->
  <rect x="420" y="500" width="150" height="46" rx="23" fill="#fffbeb" opacity="0.94"/>
  <text x="495" y="529" text-anchor="middle" font-size="16" font-weight="bold" fill="#9a3412">대출</text>
</svg>
