<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2340"/>
      <stop offset="55%" stop-color="#164a7e"/>
      <stop offset="100%" stop-color="#2f7fc1"/>
    </linearGradient>
    <linearGradient id="cream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#bfe0ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>

  <circle cx="1080" cy="120" r="240" fill="url(#glow)"/>
  <circle cx="100" cy="560" r="180" fill="url(#glow)"/>

  <!-- globe / foreign-buyer motif -->
  <g transform="translate(150,180)">
    <circle cx="0" cy="0" r="92" fill="url(#cream)" opacity="0.96"/>
    <circle cx="0" cy="0" r="92" fill="none" stroke="#164a7e" stroke-width="4" opacity="0.5"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#0c2340" stroke-width="5"/>
    <ellipse cx="0" cy="0" rx="22" ry="50" fill="none" stroke="#164a7e" stroke-width="3.5"/>
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#164a7e" stroke-width="3.5"/>
    <line x1="-44" y1="-24" x2="44" y2="-24" stroke="#164a7e" stroke-width="3" opacity="0.7"/>
    <line x1="-44" y1="24" x2="44" y2="24" stroke="#164a7e" stroke-width="3" opacity="0.7"/>
  </g>

  <!-- permit stamp / approval-zone motif -->
  <g transform="translate(255,330)" opacity="0.94">
    <rect x="-36" y="-30" width="72" height="60" rx="10" fill="none" stroke="#eef6ff" stroke-width="4"/>
    <circle cx="0" cy="-2" r="18" fill="none" stroke="#bfe0ff" stroke-width="4"/>
    <path d="M-8,-2 l6,7 l12,-16" fill="none" stroke="#eef6ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="255" y="392" text-anchor="middle" font-size="16" fill="#eef6ff">토지거래허가구역 지정</text>

  <!-- calendar accent -->
  <g transform="translate(1000,440)" opacity="0.7">
    <rect x="-34" y="-30" width="68" height="60" rx="8" fill="none" stroke="#eef6ff" stroke-width="4"/>
    <line x1="-34" y1="-12" x2="34" y2="-12" stroke="#eef6ff" stroke-width="4"/>
    <text x="0" y="16" text-anchor="middle" font-size="20" font-weight="bold" fill="#eef6ff">26</text>
  </g>

  <!-- title text block -->
  <text x="420" y="180" font-size="32" font-weight="bold" fill="#eef6ff">외국인 주택 매수</text>
  <text x="420" y="232" font-size="32" font-weight="bold" fill="#eef6ff">8월 26일부터 달라진다</text>
  <text x="420" y="276" font-size="18" fill="#bfe0ff">토지거래허가구역·실거주 요건 신설</text>

  <!-- bottom tag -->
  <rect x="420" y="500" width="170" height="46" rx="23" fill="#eef6ff" opacity="0.94"/>
  <text x="505" y="529" text-anchor="middle" font-size="16" font-weight="bold" fill="#164a7e">부동산정책</text>
</svg>
