<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="pagebg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef4fb"/>
      <stop offset="100%" stop-color="#c7dcf3"/>
    </linearGradient>
    <linearGradient id="cardgradL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="cardgradR" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbe9f9"/>
    </linearGradient>
    <linearGradient id="badgegradEase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d7ab5"/>
      <stop offset="100%" stop-color="#123a63"/>
    </linearGradient>
    <linearGradient id="badgegradUp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7fb0e0"/>
      <stop offset="100%" stop-color="#2f6fa8"/>
    </linearGradient>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#123a63" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="600" fill="url(#pagebg)"/>

  <text x="400" y="52" text-anchor="middle" font-size="24" font-weight="bold" fill="#0b1c33">종부세 개편, 누가 어떻게 달라지나</text>
  <text x="400" y="80" text-anchor="middle" font-size="14" fill="#123a63">보유 형태에 따라 세 부담 방향이 갈립니다</text>

  <!-- Left card: 실거주 1주택 -->
  <rect x="70" y="120" width="280" height="330" rx="20" fill="url(#cardgradL)" filter="url(#cardShadow)"/>
  <circle cx="210" cy="176" r="30" fill="url(#badgegradEase)"/>
  <path d="M198,178 L207,188 L223,168" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="210" y="232" text-anchor="middle" font-size="17" font-weight="bold" fill="#0b1c33">실거주 1주택</text>

  <circle cx="140" cy="270" r="12" fill="#eef4fb" stroke="#3d7ab5" stroke-width="2"/>
  <text x="140" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#123a63">1</text>
  <text x="235" y="275" text-anchor="middle" font-size="12" fill="#123a63">세 부담 완화 기조 유지</text>

  <circle cx="140" cy="310" r="12" fill="#eef4fb" stroke="#3d7ab5" stroke-width="2"/>
  <text x="140" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#123a63">2</text>
  <text x="235" y="315" text-anchor="middle" font-size="12" fill="#123a63">거주 요건 충족 시 우대 적용</text>

  <circle cx="140" cy="350" r="12" fill="#eef4fb" stroke="#3d7ab5" stroke-width="2"/>
  <text x="140" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#123a63">3</text>
  <text x="235" y="355" text-anchor="middle" font-size="12" fill="#123a63">국회 심의 중 세부안 조정 가능</text>

  <rect x="100" y="390" width="220" height="34" rx="17" fill="#eef4fb" stroke="#3d7ab5" stroke-width="2"/>
  <text x="210" y="412" text-anchor="middle" font-size="12" fill="#0b1c33">당장 큰 변화는 제한적</text>

  <!-- Right card: 다주택·비거주 -->
  <rect x="450" y="120" width="280" height="330" rx="20" fill="url(#cardgradR)" filter="url(#cardShadow)"/>
  <circle cx="590" cy="176" r="30" fill="url(#badgegradUp)"/>
  <path d="M578,186 L590,166 L602,186" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="590" y="232" text-anchor="middle" font-size="17" font-weight="bold" fill="#0b1c33">다주택·비거주</text>

  <circle cx="520" cy="270" r="12" fill="#dbe9f9" stroke="#2f6fa8" stroke-width="2"/>
  <text x="520" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#123a63">1</text>
  <text x="620" y="275" text-anchor="middle" font-size="12" fill="#0b1c33">초고가·비거주 주택 과세 강화</text>

  <circle cx="520" cy="310" r="12" fill="#dbe9f9" stroke="#2f6fa8" stroke-width="2"/>
  <text x="520" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#123a63">2</text>
  <text x="620" y="315" text-anchor="middle" font-size="12" fill="#0b1c33">보유 주택 수·가액별 부담 상이</text>

  <circle cx="520" cy="350" r="12" fill="#dbe9f9" stroke="#2f6fa8" stroke-width="2"/>
  <text x="520" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#123a63">3</text>
  <text x="620" y="355" text-anchor="middle" font-size="12" fill="#0b1c33">자산 재편 움직임 나타날 수 있음</text>

  <rect x="480" y="390" width="220" height="34" rx="17" fill="#dbe9f9" stroke="#2f6fa8" stroke-width="2"/>
  <text x="590" y="412" text-anchor="middle" font-size="12" fill="#0b1c33">사전 시뮬레이션 필요</text>

  <!-- Center divider -->
  <g transform="translate(400,275)">
    <line x1="0" y1="-90" x2="0" y2="90" stroke="#2f6fa8" stroke-width="3" stroke-dasharray="3 7" opacity="0.5"/>
  </g>

  <!-- Footer note -->
  <rect x="120" y="470" width="560" height="100" rx="16" fill="#ffffff" opacity="0.85" filter="url(#cardShadow)"/>
  <text x="400" y="502" text-anchor="middle" font-size="15" font-weight="bold" fill="#123a63">최종 확정까지는 시차가 있습니다</text>
  <text x="400" y="528" text-anchor="middle" font-size="13" fill="#0b1c33">발표된 개편안은 국회 심의와 시행령 정비를 거쳐야 하므로</text>
  <text x="400" y="548" text-anchor="middle" font-size="13" fill="#0b1c33">확정 전까지는 세부 내용이 달라질 수 있다는 점을 염두에 두세요</text>
</svg>
