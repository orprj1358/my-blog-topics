<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1c33"/>
      <stop offset="55%" stop-color="#123a63"/>
      <stop offset="100%" stop-color="#2f6fa8"/>
    </linearGradient>
    <linearGradient id="cream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf3ff"/>
      <stop offset="100%" stop-color="#a9cdf0"/>
    </linearGradient>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eaf3ff"/>
      <stop offset="100%" stop-color="#7fb0e0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1070" cy="110" r="230" fill="url(#glow)"/>
  <circle cx="90" cy="560" r="190" fill="url(#glow)"/>

  <!-- house silhouette: real estate -->
  <g transform="translate(175,195)">
    <path d="M-58,10 L0,-50 L58,10 L58,74 L-58,74 Z" fill="url(#cream)" opacity="0.95"/>
    <rect x="-16" y="24" width="32" height="50" fill="#123a63" opacity="0.85" rx="3"/>
    <rect x="-40" y="34" width="18" height="18" fill="#123a63" opacity="0.55" rx="2"/>
    <rect x="22" y="34" width="18" height="18" fill="#123a63" opacity="0.55" rx="2"/>
  </g>
  <text x="175" y="325" text-anchor="middle" font-size="15" fill="#bcd9f7">종부세 개편</text>

  <!-- balance scale: tax fairness -->
  <g transform="translate(345,330)" opacity="0.95">
    <rect x="-3" y="-42" width="6" height="60" fill="#eaf3ff"/>
    <path d="M-40,-30 L40,-30" stroke="#eaf3ff" stroke-width="5" stroke-linecap="round"/>
    <path d="M-40,-30 L-52,-8 L-28,-8 Z" fill="none" stroke="#eaf3ff" stroke-width="4" stroke-linejoin="round"/>
    <path d="M40,-30 L52,-8 L28,-8 Z" fill="none" stroke="#eaf3ff" stroke-width="4" stroke-linejoin="round"/>
    <rect x="-24" y="18" width="48" height="8" rx="4" fill="#eaf3ff"/>
  </g>

  <!-- percent badge -->
  <g transform="translate(1010,440)">
    <circle cx="0" cy="0" r="42" fill="url(#cream)" opacity="0.97"/>
    <text x="0" y="12" text-anchor="middle" font-size="30" font-weight="bold" fill="#123a63">%</text>
  </g>

  <!-- title text block -->
  <text x="430" y="185" font-size="32" font-weight="bold" fill="#eaf3ff">2026 세제개편안</text>
  <text x="430" y="237" font-size="32" font-weight="bold" fill="#eaf3ff">종부세, 내 집엔?</text>
  <text x="430" y="281" font-size="18" fill="#bcd9f7">초고가·비거주 강화, 실거주는 우대</text>

  <!-- bottom tag -->
  <rect x="430" y="505" width="130" height="46" rx="23" fill="#eaf3ff" opacity="0.94"/>
  <text x="495" y="534" text-anchor="middle" font-size="16" font-weight="bold" fill="#123a63">부동산정책</text>
</svg>
