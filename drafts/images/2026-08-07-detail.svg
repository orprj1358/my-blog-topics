<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="pagebg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf1e2"/>
      <stop offset="100%" stop-color="#f3cfa0"/>
    </linearGradient>
    <linearGradient id="cardgradL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf1e2"/>
    </linearGradient>
    <linearGradient id="cardgradR" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8ddb8"/>
    </linearGradient>
    <linearGradient id="badgegradEase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0a463"/>
      <stop offset="100%" stop-color="#a85a1f"/>
    </linearGradient>
    <linearGradient id="badgegradUp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2a65a"/>
      <stop offset="100%" stop-color="#c9672a"/>
    </linearGradient>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7a3d13" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="600" fill="url(#pagebg)"/>

  <text x="400" y="52" text-anchor="middle" font-size="24" font-weight="bold" fill="#3a1e0a">3단계 시행 전후, 무엇이 달라지나</text>
  <text x="400" y="80" text-anchor="middle" font-size="14" fill="#7a3d13">가산금리 적용 방식이 한층 강화됩니다</text>

  <!-- Left card: 이전 단계 -->
  <rect x="70" y="120" width="280" height="330" rx="20" fill="url(#cardgradL)" filter="url(#cardShadow)"/>
  <circle cx="210" cy="176" r="30" fill="url(#badgegradEase)"/>
  <text x="210" y="185" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">1-2</text>
  <text x="210" y="232" text-anchor="middle" font-size="17" font-weight="bold" fill="#3a1e0a">이전 단계</text>

  <circle cx="140" cy="270" r="12" fill="#fdf1e2" stroke="#a85a1f" stroke-width="2"/>
  <text x="140" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a3d13">1</text>
  <text x="235" y="275" text-anchor="middle" font-size="12" fill="#7a3d13">가산금리 상대적으로 낮음</text>

  <circle cx="140" cy="310" r="12" fill="#fdf1e2" stroke="#a85a1f" stroke-width="2"/>
  <text x="140" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a3d13">2</text>
  <text x="235" y="315" text-anchor="middle" font-size="12" fill="#7a3d13">비교적 여유 있는 한도</text>

  <circle cx="140" cy="350" r="12" fill="#fdf1e2" stroke="#a85a1f" stroke-width="2"/>
  <text x="140" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a3d13">3</text>
  <text x="235" y="355" text-anchor="middle" font-size="12" fill="#7a3d13">현재 금리 위주로 심사</text>

  <rect x="100" y="390" width="220" height="34" rx="17" fill="#fdf1e2" stroke="#a85a1f" stroke-width="2"/>
  <text x="210" y="412" text-anchor="middle" font-size="12" fill="#3a1e0a">완만한 한도 축소</text>

  <!-- Right card: 3단계 -->
  <rect x="450" y="120" width="280" height="330" rx="20" fill="url(#cardgradR)" filter="url(#cardShadow)"/>
  <circle cx="590" cy="176" r="30" fill="url(#badgegradUp)"/>
  <text x="590" y="185" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">3</text>
  <text x="590" y="232" text-anchor="middle" font-size="17" font-weight="bold" fill="#3a1e0a">스트레스 DSR 3단계</text>

  <circle cx="520" cy="270" r="12" fill="#f8ddb8" stroke="#c9672a" stroke-width="2"/>
  <text x="520" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a3d13">1</text>
  <text x="620" y="275" text-anchor="middle" font-size="12" fill="#3a1e0a">가산금리 적용 폭 확대</text>

  <circle cx="520" cy="310" r="12" fill="#f8ddb8" stroke="#c9672a" stroke-width="2"/>
  <text x="520" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a3d13">2</text>
  <text x="620" y="315" text-anchor="middle" font-size="12" fill="#3a1e0a">실제 대출 가능액 감소</text>

  <circle cx="520" cy="350" r="12" fill="#f8ddb8" stroke="#c9672a" stroke-width="2"/>
  <text x="520" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a3d13">3</text>
  <text x="620" y="355" text-anchor="middle" font-size="12" fill="#3a1e0a">지역·상품별 체감 차이</text>

  <rect x="480" y="390" width="220" height="34" rx="17" fill="#f8ddb8" stroke="#c9672a" stroke-width="2"/>
  <text x="590" y="412" text-anchor="middle" font-size="12" fill="#3a1e0a">사전 한도 확인 필수</text>

  <!-- Center divider -->
  <g transform="translate(400,275)">
    <line x1="0" y1="-90" x2="0" y2="90" stroke="#c9672a" stroke-width="3" stroke-dasharray="3 7" opacity="0.5"/>
  </g>

  <!-- Footer note -->
  <rect x="120" y="470" width="560" height="100" rx="16" fill="#ffffff" opacity="0.85" filter="url(#cardShadow)"/>
  <text x="400" y="502" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a3d13">은행별 세부 기준은 다를 수 있습니다</text>
  <text x="400" y="528" text-anchor="middle" font-size="13" fill="#3a1e0a">대출을 앞두고 있다면 창구 방문 전 여러 금융기관의</text>
  <text x="400" y="548" text-anchor="middle" font-size="13" fill="#3a1e0a">한도·조건을 미리 비교해보는 것이 안전합니다</text>
</svg>
