<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="45%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fff7ed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="coinGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="980" cy="120" r="260" fill="url(#glow1)"/>
  <circle cx="140" cy="520" r="220" fill="url(#glow2)"/>

  <g filter="url(#shadow)">
    <circle cx="990" cy="420" r="120" fill="url(#coinGrad)"/>
    <circle cx="990" cy="420" r="120" fill="none" stroke="#fff7ed" stroke-opacity="0.4" stroke-width="4"/>
    <text x="990" y="440" font-family="Georgia, serif" font-size="92" font-weight="700" fill="#7c2d12" text-anchor="middle">%</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="1050" cy="200" r="60" fill="url(#coinGrad2)"/>
    <circle cx="1050" cy="200" r="60" fill="none" stroke="#fff7ed" stroke-opacity="0.4" stroke-width="3"/>
    <text x="1050" y="216" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#7c2d12" text-anchor="middle">₩</text>
  </g>

  <g filter="url(#shadow)" opacity="0.92">
    <rect x="60" y="360" width="150" height="24" rx="8" fill="url(#coinGrad)"/>
    <rect x="80" y="330" width="150" height="24" rx="8" fill="url(#coinGrad2)"/>
    <rect x="60" y="300" width="150" height="24" rx="8" fill="url(#coinGrad)"/>
  </g>

  <rect x="80" y="120" width="620" height="230" rx="26" fill="url(#cardGrad)"/>

  <text x="120" y="205" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="58" font-weight="800" fill="#fffbeb">가계대출, 다시</text>
  <text x="120" y="275" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="58" font-weight="800" fill="#fffbeb">역대 최고치</text>
  <text x="120" y="325" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="26" font-weight="500" fill="#fde68a">완화와 조임, 엇갈리는 대출 시장 신호</text>

  <g transform="translate(120,470)" opacity="0.95">
    <rect x="0" y="0" width="46" height="46" rx="12" fill="url(#coinGrad2)"/>
    <path d="M10 30 L18 18 L26 24 L36 10" stroke="#7c2d12" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="36" cy="10" r="3.5" fill="#7c2d12"/>
  </g>
  <text x="182" y="500" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" fill="#fff7ed">MY BLOG · 대출 이야기</text>
</svg>
