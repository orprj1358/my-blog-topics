<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c7d2fe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99f6e4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="chipGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="980" cy="140" r="260" fill="url(#glow1)"/>
  <circle cx="150" cy="520" r="220" fill="url(#glow2)"/>

  <g filter="url(#shadow)">
    <rect x="900" y="330" width="180" height="180" rx="30" fill="url(#chipGrad)"/>
    <rect x="930" y="360" width="120" height="120" rx="14" fill="#0f766e" opacity="0.55"/>
    <rect x="955" y="385" width="70" height="70" rx="8" fill="#99f6e4"/>
    <rect x="860" y="395" width="30" height="16" rx="6" fill="#5eead4"/>
    <rect x="860" y="425" width="30" height="16" rx="6" fill="#5eead4"/>
    <rect x="990" y="500" width="16" height="30" rx="6" fill="#5eead4"/>
    <rect x="1030" y="500" width="16" height="30" rx="6" fill="#5eead4"/>
    <rect x="990" y="310" width="16" height="30" rx="6" fill="#5eead4"/>
    <rect x="1030" y="310" width="16" height="30" rx="6" fill="#5eead4"/>
  </g>

  <g filter="url(#shadow)" opacity="0.95">
    <line x1="1010" y1="150" x2="1080" y2="120" stroke="#c7d2fe" stroke-width="3"/>
    <line x1="1010" y1="150" x2="1060" y2="210" stroke="#c7d2fe" stroke-width="3"/>
    <line x1="1080" y1="120" x2="1060" y2="210" stroke="#c7d2fe" stroke-width="3"/>
    <circle cx="1010" cy="150" r="16" fill="url(#chipGrad2)"/>
    <circle cx="1080" cy="120" r="12" fill="url(#chipGrad)"/>
    <circle cx="1060" cy="210" r="14" fill="url(#chipGrad2)"/>
  </g>

  <rect x="80" y="120" width="620" height="230" rx="26" fill="url(#cardGrad)"/>

  <text x="120" y="205" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="58" font-weight="800" fill="#f0fdfa">AI 데이터센터,</text>
  <text x="120" y="275" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="58" font-weight="800" fill="#f0fdfa">전기 먹는 하마</text>
  <text x="120" y="325" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="26" font-weight="500" fill="#99f6e4">생성형 AI 확산이 불러온 전력 딜레마</text>

  <g transform="translate(120,470)" opacity="0.95">
    <rect x="0" y="0" width="46" height="46" rx="12" fill="url(#chipGrad2)"/>
    <circle cx="14" cy="16" r="4" fill="#f0fdfa"/>
    <circle cx="32" cy="16" r="4" fill="#f0fdfa"/>
    <circle cx="23" cy="32" r="4" fill="#f0fdfa"/>
    <line x1="14" y1="16" x2="32" y2="16" stroke="#f0fdfa" stroke-width="2"/>
    <line x1="14" y1="16" x2="23" y2="32" stroke="#f0fdfa" stroke-width="2"/>
    <line x1="32" y1="16" x2="23" y2="32" stroke="#f0fdfa" stroke-width="2"/>
  </g>
  <text x="182" y="500" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" fill="#f0fdfa">MY BLOG · AI 이야기</text>
</svg>
