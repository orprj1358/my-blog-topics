<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1c33"/>
      <stop offset="55%" stop-color="#123a63"/>
      <stop offset="100%" stop-color="#2f6fa8"/>
    </linearGradient>
    <linearGradient id="cream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf3ff"/>
      <stop offset="100%" stop-color="#a9cdf0"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9f0d8"/>
      <stop offset="100%" stop-color="#6fc99a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1070" cy="110" r="230" fill="url(#glow)"/>
  <circle cx="90" cy="560" r="190" fill="url(#glow)"/>

  <!-- house silhouette -->
  <g transform="translate(175,205)" filter="url(#shadow)">
    <path d="M-58,10 L0,-50 L58,10 L58,74 L-58,74 Z" fill="url(#cream)" opacity="0.96"/>
    <rect x="-16" y="24" width="32" height="50" fill="#123a63" opacity="0.85" rx="3"/>
    <rect x="-40" y="34" width="18" height="18" fill="#123a63" opacity="0.55" rx="2"/>
    <rect x="22" y="34" width="18" height="18" fill="#123a63" opacity="0.55" rx="2"/>
  </g>
  <text x="175" y="335" text-anchor="middle" font-size="15" fill="#bcd9f7">신규 택지</text>

  <!-- leaf / greenbelt icon -->
  <g transform="translate(330,325)" filter="url(#shadow)" opacity="0.96">
    <circle cx="0" cy="0" r="46" fill="url(#leafGrad)"/>
    <path d="M-16,14 C-16,-14 16,-14 16,14 C4,20 -4,20 -16,14 Z" fill="#123a63" opacity="0.8"/>
    <path d="M0,14 L0,-10" stroke="#123a63" stroke-width="3" opacity="0.8" stroke-linecap="round"/>
  </g>
  <text x="330" y="392" text-anchor="middle" font-size="15" fill="#bcd9f7">그린벨트</text>

  <!-- percent-free info badge (magnifier for "review") -->
  <g transform="translate(1010,440)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="42" fill="url(#cream)" opacity="0.97"/>
    <circle cx="-6" cy="-6" r="14" fill="none" stroke="#123a63" stroke-width="5"/>
    <line x1="4" y1="4" x2="16" y2="16" stroke="#123a63" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- title text block -->
  <rect x="410" y="130" width="640" height="230" rx="26" fill="#ffffff" opacity="0.06"/>
  <text x="430" y="200" font-size="32" font-weight="bold" fill="#eaf3ff">수도권 그린벨트</text>
  <text x="430" y="252" font-size="32" font-weight="bold" fill="#eaf3ff">해제 카드, 이번엔 통할까</text>
  <text x="430" y="296" font-size="18" fill="#bcd9f7">공급 대책의 단골 카드, 그 명암을 짚어본다</text>

  <!-- bottom tag -->
  <rect x="430" y="505" width="130" height="46" rx="23" fill="#eaf3ff" opacity="0.94"/>
  <text x="495" y="534" text-anchor="middle" font-size="16" font-weight="bold" fill="#123a63">부동산정책</text>
</svg>
