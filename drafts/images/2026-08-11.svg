<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b1608"/>
      <stop offset="55%" stop-color="#7a3c10"/>
      <stop offset="100%" stop-color="#d97e2e"/>
    </linearGradient>
    <linearGradient id="cream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e2"/>
      <stop offset="100%" stop-color="#f6c98b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdca8"/>
      <stop offset="100%" stop-color="#f0954a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1070" cy="110" r="230" fill="url(#glow)"/>
  <circle cx="90" cy="560" r="190" fill="url(#glow)"/>

  <!-- credit card with a dim "shadow" duplicate behind it, to evoke 그림자 대출 -->
  <g transform="translate(190,240)">
    <rect x="-70" y="-38" width="140" height="90" rx="14" fill="#0b0603" opacity="0.35" transform="translate(14,16)"/>
    <g filter="url(#shadow)">
      <rect x="-70" y="-38" width="140" height="90" rx="14" fill="url(#cardGrad)"/>
      <rect x="-70" y="-14" width="140" height="16" fill="#7a3c10" opacity="0.55"/>
      <rect x="-52" y="18" width="46" height="10" rx="5" fill="#7a3c10" opacity="0.55"/>
    </g>
  </g>
  <text x="190" y="345" text-anchor="middle" font-size="15" fill="#ffe3bd">카드론</text>

  <!-- percent coin badge -->
  <g transform="translate(340,330)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="46" fill="url(#cream)"/>
    <text x="0" y="10" text-anchor="middle" font-size="30" font-weight="800" fill="#a2530f">%</text>
  </g>
  <text x="340" y="397" text-anchor="middle" font-size="15" fill="#ffe3bd">리볼빙</text>

  <!-- warning/shadow figure badge -->
  <g transform="translate(1010,440)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="42" fill="url(#cream)" opacity="0.97"/>
    <path d="M0,-18 L16,14 L-16,14 Z" fill="none" stroke="#a2530f" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="0" cy="10" r="1.6" fill="#a2530f"/>
    <line x1="0" y1="-4" x2="0" y2="5" stroke="#a2530f" stroke-width="3.4" stroke-linecap="round"/>
  </g>

  <!-- title text block -->
  <rect x="410" y="120" width="640" height="250" rx="26" fill="#ffffff" opacity="0.06"/>
  <text x="430" y="192" font-size="30" font-weight="bold" fill="#fff3e2">카드론·리볼빙,</text>
  <text x="430" y="240" font-size="30" font-weight="bold" fill="#fff3e2">'그림자 대출' 다시 늘어난다</text>
  <text x="430" y="284" font-size="18" fill="#ffe3bd">은행 문턱 높아지자 커지는 대출의 이면</text>

  <!-- bottom tag -->
  <rect x="430" y="505" width="80" height="46" rx="23" fill="#fff3e2" opacity="0.94"/>
  <text x="470" y="534" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a3c10">대출</text>
</svg>
