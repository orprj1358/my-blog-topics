<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1230"/>
      <stop offset="55%" stop-color="#1c3a6b"/>
      <stop offset="100%" stop-color="#1f8a8a"/>
    </linearGradient>
    <linearGradient id="cream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eafcfa"/>
      <stop offset="100%" stop-color="#9fe3d8"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7fd6d0"/>
      <stop offset="100%" stop-color="#3a6fb0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1070" cy="110" r="230" fill="url(#glow)"/>
  <circle cx="90" cy="560" r="190" fill="url(#glow)"/>

  <!-- network of nodes evoking data/content flowing into AI -->
  <g stroke="#bfeee7" stroke-width="1.6" opacity="0.55">
    <line x1="150" y1="470" x2="230" y2="410"/>
    <line x1="230" y1="410" x2="210" y2="330"/>
    <line x1="230" y1="410" x2="300" y2="450"/>
    <line x1="210" y1="330" x2="150" y2="470"/>
  </g>
  <g fill="#eafcfa">
    <circle cx="150" cy="470" r="6"/>
    <circle cx="230" cy="410" r="6"/>
    <circle cx="210" cy="330" r="6"/>
    <circle cx="300" cy="450" r="6"/>
  </g>

  <!-- chip icon -->
  <g transform="translate(200,240)" filter="url(#shadow)">
    <rect x="-56" y="-56" width="112" height="112" rx="18" fill="url(#chipGrad)"/>
    <rect x="-30" y="-30" width="60" height="60" rx="8" fill="#0d1230" opacity="0.75"/>
    <g stroke="#eafcfa" stroke-width="4" stroke-linecap="round">
      <line x1="-56" y1="-24" x2="-70" y2="-24"/>
      <line x1="-56" y1="0" x2="-70" y2="0"/>
      <line x1="-56" y1="24" x2="-70" y2="24"/>
      <line x1="56" y1="-24" x2="70" y2="-24"/>
      <line x1="56" y1="0" x2="70" y2="0"/>
      <line x1="56" y1="24" x2="70" y2="24"/>
      <line x1="-24" y1="-56" x2="-24" y2="-70"/>
      <line x1="24" y1="-56" x2="24" y2="-70"/>
      <line x1="-24" y1="56" x2="-24" y2="70"/>
      <line x1="24" y1="56" x2="24" y2="70"/>
    </g>
  </g>
  <text x="200" y="345" text-anchor="middle" font-size="15" fill="#dff5f1">AI 모델</text>

  <!-- copyright badge -->
  <g transform="translate(340,380)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="46" fill="url(#cream)"/>
    <text x="0" y="11" text-anchor="middle" font-size="30" font-weight="800" fill="#1c3a6b">&#169;</text>
  </g>
  <text x="340" y="447" text-anchor="middle" font-size="15" fill="#dff5f1">저작권</text>

  <!-- document/content stack badge -->
  <g transform="translate(1010,470)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="42" fill="url(#cream)" opacity="0.97"/>
    <rect x="-14" y="-18" width="28" height="34" rx="3" fill="none" stroke="#1c3a6b" stroke-width="3"/>
    <line x1="-8" y1="-8" x2="8" y2="-8" stroke="#1c3a6b" stroke-width="2.4"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#1c3a6b" stroke-width="2.4"/>
    <line x1="-8" y1="8" x2="4" y2="8" stroke="#1c3a6b" stroke-width="2.4"/>
  </g>

  <!-- title text block -->
  <rect x="410" y="110" width="650" height="260" rx="26" fill="#ffffff" opacity="0.06"/>
  <text x="430" y="182" font-size="28" font-weight="bold" fill="#eafcfa">생성형 AI 저작권 분쟁,</text>
  <text x="430" y="230" font-size="28" font-weight="bold" fill="#eafcfa">콘텐츠 업계는 어떻게</text>
  <text x="430" y="278" font-size="28" font-weight="bold" fill="#eafcfa">대응하나</text>
  <text x="430" y="316" font-size="17" fill="#bfeee7">학습데이터를 둘러싼 창작자와 AI기업의 줄다리기</text>

  <!-- bottom tag -->
  <rect x="430" y="505" width="110" height="46" rx="23" fill="#eafcfa" opacity="0.94"/>
  <text x="485" y="534" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c3a6b">AI 소식</text>
</svg>
