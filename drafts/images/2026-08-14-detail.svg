<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2f0ff"/>
      <stop offset="100%" stop-color="#cdeee8"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="badgeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b7aef7"/>
      <stop offset="100%" stop-color="#6a5acd"/>
    </linearGradient>
    <linearGradient id="badgeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7fe0d4"/>
      <stop offset="100%" stop-color="#1a9c90"/>
    </linearGradient>
    <linearGradient id="headerLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b7ce8"/>
      <stop offset="100%" stop-color="#6a5acd"/>
    </linearGradient>
    <linearGradient id="headerRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2fc2b3"/>
      <stop offset="100%" stop-color="#1a9c90"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.2"/>
    </filter>
    <marker id="arrowL" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4a3fa0"/>
    </marker>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f7a70"/>
    </marker>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="42" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="800" fill="#2b2c6b" text-anchor="middle">기존 결제 vs AI 에이전트 결제</text>
  <text x="400" y="66" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" fill="#3d3d8a" text-anchor="middle">무엇이, 어떻게 달라지나 (예시 흐름)</text>

  <!-- column headers -->
  <g filter="url(#cardShadow)">
    <rect x="46" y="90" width="320" height="44" rx="14" fill="url(#headerLeft)"/>
  </g>
  <text x="206" y="118" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">기존 결제 — 사람이 직접</text>

  <g filter="url(#cardShadow)">
    <rect x="434" y="90" width="320" height="44" rx="14" fill="url(#headerRight)"/>
  </g>
  <text x="594" y="118" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">AI 에이전트 결제</text>

  <!-- Left column cards -->
  <g filter="url(#cardShadow)">
    <rect x="46" y="158" width="320" height="88" rx="16" fill="url(#card1)"/>
  </g>
  <circle cx="96" cy="202" r="24" fill="url(#badgeLeft)"/>
  <text x="96" y="209" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="134" y="192" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#2b2c6b">상품을 직접 검색</text>
  <text x="134" y="214" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12.5" fill="#4a4a8a">여러 쇼핑몰을 오가며 가격·조건 비교</text>

  <path d="M206 246 L206 268" stroke="#4a3fa0" stroke-width="3" fill="none" marker-end="url(#arrowL)"/>

  <g filter="url(#cardShadow)">
    <rect x="46" y="272" width="320" height="88" rx="16" fill="url(#card1)"/>
  </g>
  <circle cx="96" cy="316" r="24" fill="url(#badgeLeft)"/>
  <text x="96" y="323" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="134" y="306" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#2b2c6b">직접 비교 후 선택</text>
  <text x="134" y="328" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12.5" fill="#4a4a8a">후기·가격을 하나씩 확인하며 최종 결정</text>

  <path d="M206 360 L206 382" stroke="#4a3fa0" stroke-width="3" fill="none" marker-end="url(#arrowL)"/>

  <g filter="url(#cardShadow)">
    <rect x="46" y="386" width="320" height="88" rx="16" fill="url(#card1)"/>
  </g>
  <circle cx="96" cy="430" r="24" fill="url(#badgeLeft)"/>
  <text x="96" y="437" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="134" y="420" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#2b2c6b">카드정보 직접 입력</text>
  <text x="134" y="442" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12.5" fill="#4a4a8a">매 결제마다 본인이 승인·서명까지 수행</text>

  <!-- Right column cards -->
  <g filter="url(#cardShadow)">
    <rect x="434" y="158" width="320" height="88" rx="16" fill="url(#card1)"/>
  </g>
  <circle cx="484" cy="202" r="24" fill="url(#badgeRight)"/>
  <text x="484" y="209" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="522" y="192" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#173a3a">예산·조건만 전달</text>
  <text x="522" y="214" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12.5" fill="#1f6b62">"이 조건에 맞는 걸 찾아서 사줘"라고 요청</text>

  <path d="M594 246 L594 268" stroke="#0f7a70" stroke-width="3" fill="none" marker-end="url(#arrowR)"/>

  <g filter="url(#cardShadow)">
    <rect x="434" y="272" width="320" height="88" rx="16" fill="url(#card1)"/>
  </g>
  <circle cx="484" cy="316" r="24" fill="url(#badgeRight)"/>
  <text x="484" y="323" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="522" y="306" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#173a3a">AI가 비교·선택 대행</text>
  <text x="522" y="328" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12.5" fill="#1f6b62">여러 쇼핑몰을 자동으로 비교해 후보 압축</text>

  <path d="M594 360 L594 382" stroke="#0f7a70" stroke-width="3" fill="none" marker-end="url(#arrowR)"/>

  <g filter="url(#cardShadow)">
    <rect x="434" y="386" width="320" height="88" rx="16" fill="url(#card1)"/>
  </g>
  <circle cx="484" cy="430" r="24" fill="url(#badgeRight)"/>
  <text x="484" y="437" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="522" y="420" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#173a3a">위임된 정보로 자동 결제</text>
  <text x="522" y="442" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12.5" fill="#1f6b62">고액 결제 시 최종 승인 단계 필요 (예시)</text>

  <!-- watch-out banner -->
  <g filter="url(#cardShadow)">
    <rect x="46" y="490" width="708" height="70" rx="16" fill="url(#headerLeft)" opacity="0.95"/>
  </g>
  <circle cx="96" cy="525" r="20" fill="#f2f0ff"/>
  <text x="96" y="532" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#6a5acd" text-anchor="middle">!</text>
  <text x="130" y="519" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#ffffff">결제 한도·승인 절차를 반드시 확인</text>
  <text x="130" y="541" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12.5" fill="#e8e4ff">오작동·해킹 시 책임 소재가 아직 명확하지 않음</text>

  <text x="400" y="586" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12.5" fill="#3d3d8a" text-anchor="middle">※ 단계는 이해를 돕기 위한 예시 흐름이며 실제 서비스와 다를 수 있음</text>
</svg>
