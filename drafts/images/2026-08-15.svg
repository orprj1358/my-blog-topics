<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141537"/>
      <stop offset="55%" stop-color="#33327a"/>
      <stop offset="100%" stop-color="#0e8f8a"/>
    </linearGradient>
    <linearGradient id="cream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f0ff"/>
      <stop offset="100%" stop-color="#a7e3da"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b8cf2"/>
      <stop offset="100%" stop-color="#3ab7ad"/>
    </linearGradient>
    <linearGradient id="scaleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b4fd6"/>
      <stop offset="100%" stop-color="#1fa89c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="110" r="230" fill="url(#glow)"/>
  <circle cx="90" cy="560" r="190" fill="url(#glow)"/>

  <!-- network of nodes evoking AI -->
  <g stroke="#c9e9f2" stroke-width="1.6" opacity="0.5">
    <line x1="150" y1="480" x2="228" y2="422"/>
    <line x1="228" y1="422" x2="206" y2="340"/>
    <line x1="228" y1="422" x2="298" y2="462"/>
    <line x1="206" y1="340" x2="150" y2="480"/>
  </g>
  <g fill="#f2f0ff">
    <circle cx="150" cy="480" r="6"/>
    <circle cx="228" cy="422" r="6"/>
    <circle cx="206" cy="340" r="6"/>
    <circle cx="298" cy="462" r="6"/>
  </g>

  <!-- AI chip icon -->
  <g transform="translate(200,240)" filter="url(#shadow)">
    <rect x="-54" y="-54" width="108" height="108" rx="18" fill="url(#chipGrad)"/>
    <rect x="-28" y="-28" width="56" height="56" rx="8" fill="#141537" opacity="0.75"/>
    <g stroke="#f2f0ff" stroke-width="4" stroke-linecap="round">
      <line x1="-54" y1="-22" x2="-68" y2="-22"/>
      <line x1="-54" y1="0" x2="-68" y2="0"/>
      <line x1="-54" y1="22" x2="-68" y2="22"/>
      <line x1="54" y1="-22" x2="68" y2="-22"/>
      <line x1="54" y1="0" x2="68" y2="0"/>
      <line x1="54" y1="22" x2="68" y2="22"/>
      <line x1="-22" y1="-54" x2="-22" y2="-68"/>
      <line x1="22" y1="-54" x2="22" y2="-68"/>
      <line x1="-22" y1="54" x2="-22" y2="68"/>
      <line x1="22" y1="54" x2="22" y2="68"/>
    </g>
  </g>
  <text x="200" y="340" text-anchor="middle" font-size="15" fill="#e6f6f2">AI 시스템</text>

  <!-- scale of justice icon (law) -->
  <g transform="translate(340,395)" filter="url(#shadow)">
    <rect x="-44" y="-46" width="88" height="92" rx="14" fill="url(#scaleGrad)"/>
    <line x1="0" y1="-28" x2="0" y2="18" stroke="#f2f0ff" stroke-width="3"/>
    <line x1="-24" y1="-14" x2="24" y2="-14" stroke="#f2f0ff" stroke-width="3"/>
    <path d="M-24,-14 Q-32,4 -24,10 Q-16,4 -24,-14 Z" fill="none" stroke="#f2f0ff" stroke-width="2.5"/>
    <path d="M24,-14 Q16,4 24,10 Q32,4 24,-14 Z" fill="none" stroke="#f2f0ff" stroke-width="2.5"/>
    <rect x="-16" y="18" width="32" height="6" rx="3" fill="#f2f0ff"/>
  </g>
  <text x="340" y="463" text-anchor="middle" font-size="15" fill="#e6f6f2">AI 기본법</text>

  <!-- checklist badge -->
  <g transform="translate(1010,470)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="42" fill="url(#cream)" opacity="0.97"/>
    <path d="M-16,-2 L-6,10 L18,-16" fill="none" stroke="#2b2c6b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1010" y="527" text-anchor="middle" font-size="15" fill="#e6f6f2">준비 체크</text>

  <!-- title text block -->
  <rect x="410" y="100" width="650" height="280" rx="26" fill="#ffffff" opacity="0.06"/>
  <text x="430" y="172" font-size="27" font-weight="bold" fill="#f2f0ff">AI 기본법 시행,</text>
  <text x="430" y="220" font-size="27" font-weight="bold" fill="#f2f0ff">기업은 지금</text>
  <text x="430" y="268" font-size="27" font-weight="bold" fill="#f2f0ff">무엇을 준비해야 할까</text>
  <text x="430" y="306" font-size="17" fill="#c9e9f2">고영향 AI, 생성형 AI 표시 의무까지 미리 점검</text>

  <!-- bottom tag -->
  <rect x="430" y="505" width="110" height="46" rx="23" fill="#f2f0ff" opacity="0.94"/>
  <text x="485" y="534" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2c6b">AI 소식</text>
</svg>
