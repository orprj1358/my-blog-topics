<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eaf1fc"/>
      <stop offset="100%" stop-color="#cfe0f7"/>
    </linearGradient>
    <linearGradient id="cardBgLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f6fd"/>
    </linearGradient>
    <linearGradient id="cardBgRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eaf3ff"/>
    </linearGradient>
    <linearGradient id="badgeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8fa9cf"/>
      <stop offset="100%" stop-color="#3f5478"/>
    </linearGradient>
    <linearGradient id="badgeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7fb2ec"/>
      <stop offset="100%" stop-color="#2e5fa3"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f5478"/>
      <stop offset="100%" stop-color="#2e5fa3"/>
    </linearGradient>
    <linearGradient id="noteBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f5478"/>
      <stop offset="100%" stop-color="#2e5fa3"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="620" fill="url(#pageBg)"/>

  <text x="400" y="42" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="23" font-weight="800" fill="#1b3a70" text-anchor="middle">재초환, 무엇이 달라지나</text>
  <text x="400" y="66" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13.5" fill="#3f5478" text-anchor="middle">현재 기준과 논의되는 완화 방향 비교 (구체 수치는 예시)</text>

  <!-- left column: 현재 기준 -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="96" width="300" height="420" rx="18" fill="url(#cardBgLeft)"/>
  </g>
  <circle cx="100" cy="136" r="22" fill="url(#badgeLeft)"/>
  <text x="100" y="143" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">現</text>
  <text x="134" y="142" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#243a5e">현재 기준</text>

  <line x1="90" y1="168" x2="330" y2="168" stroke="#dbe6f5" stroke-width="1.5"/>

  <circle cx="100" cy="204" r="14" fill="#e4ecfa"/>
  <text x="100" y="209" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" fill="#3f5478" text-anchor="middle">1</text>
  <text x="126" y="200" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#243a5e">낮은 면제 기준</text>
  <text x="126" y="220" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11.5" fill="#5a6b8a">소액 개발이익도 부과 대상(예시)</text>

  <circle cx="100" cy="270" r="14" fill="#e4ecfa"/>
  <text x="100" y="275" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" fill="#3f5478" text-anchor="middle">2</text>
  <text x="126" y="266" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#243a5e">촘촘한 부과율 구간</text>
  <text x="126" y="286" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11.5" fill="#5a6b8a">이익 구간별 세율이 빠르게 상승(예시)</text>

  <circle cx="100" cy="336" r="14" fill="#e4ecfa"/>
  <text x="100" y="341" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" fill="#3f5478" text-anchor="middle">3</text>
  <text x="126" y="332" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#243a5e">제한적인 1주택 감면</text>
  <text x="126" y="352" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11.5" fill="#5a6b8a">장기 보유자 배려 폭이 좁음(예시)</text>

  <circle cx="100" cy="402" r="14" fill="#e4ecfa"/>
  <text x="100" y="407" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" fill="#3f5478" text-anchor="middle">4</text>
  <text x="126" y="398" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#243a5e">위축되는 정비사업</text>
  <text x="126" y="418" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11.5" fill="#5a6b8a">사업성 저하로 추진 지연 우려</text>

  <!-- arrow -->
  <path d="M368 306 L432 306" stroke="url(#arrowGrad)" stroke-width="4" fill="none"/>
  <path d="M420 294 L436 306 L420 318" fill="none" stroke="url(#arrowGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="400" y="290" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12" font-weight="700" fill="#2e5fa3">논의 중</text>

  <!-- right column: 완화 방향 -->
  <g filter="url(#cardShadow)">
    <rect x="440" y="96" width="300" height="420" rx="18" fill="url(#cardBgRight)"/>
  </g>
  <circle cx="480" cy="136" r="22" fill="url(#badgeRight)"/>
  <text x="480" y="143" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">案</text>
  <text x="514" y="142" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1b3a70">완화 논의 방향</text>

  <line x1="470" y1="168" x2="710" y2="168" stroke="#cfe0f7" stroke-width="1.5"/>

  <circle cx="480" cy="204" r="14" fill="#dceafe"/>
  <text x="480" y="209" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" fill="#1b3a70" text-anchor="middle">1</text>
  <text x="506" y="200" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#1b3a70">면제 기준 상향</text>
  <text x="506" y="220" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11.5" fill="#3f5478">소규모 이익 단지 부담 완화(예시)</text>

  <circle cx="480" cy="270" r="14" fill="#dceafe"/>
  <text x="480" y="275" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" fill="#1b3a70" text-anchor="middle">2</text>
  <text x="506" y="266" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#1b3a70">부과율 구간 조정</text>
  <text x="506" y="286" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11.5" fill="#3f5478">중간 이익 구간 세율 완만화(예시)</text>

  <circle cx="480" cy="336" r="14" fill="#dceafe"/>
  <text x="480" y="341" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" fill="#1b3a70" text-anchor="middle">3</text>
  <text x="506" y="332" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#1b3a70">1주택 감면 확대</text>
  <text x="506" y="352" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11.5" fill="#3f5478">장기 보유 조합원 감면 폭 확대(예시)</text>

  <circle cx="480" cy="402" r="14" fill="#dceafe"/>
  <text x="480" y="407" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" fill="#1b3a70" text-anchor="middle">4</text>
  <text x="506" y="398" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#1b3a70">정비사업 정상화 기대</text>
  <text x="506" y="418" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11.5" fill="#3f5478">법 개정 통과가 관건</text>

  <!-- note banner -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="546" width="680" height="56" rx="16" fill="url(#noteBg)" opacity="0.95"/>
  </g>
  <circle cx="100" cy="574" r="17" fill="#eef4ff"/>
  <text x="100" y="580" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#2e5fa3" text-anchor="middle">!</text>
  <text x="128" y="569" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">항목별 수치는 이해를 돕기 위한 예시입니다</text>
  <text x="128" y="587" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11.5" fill="#dceafe">실제 기준·시행 여부는 법령 확정 후 반드시 확인하세요</text>
</svg>
