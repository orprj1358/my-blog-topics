<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b3a"/>
      <stop offset="55%" stop-color="#1b3a70"/>
      <stop offset="100%" stop-color="#2f6fb0"/>
    </linearGradient>
    <linearGradient id="cream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef4ff"/>
      <stop offset="100%" stop-color="#bcd8f5"/>
    </linearGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7fb2ec"/>
      <stop offset="100%" stop-color="#2e5fa3"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7c8f0"/>
      <stop offset="100%" stop-color="#3f76bb"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="110" r="230" fill="url(#glow)"/>
  <circle cx="90" cy="560" r="190" fill="url(#glow)"/>

  <!-- skyline hint -->
  <g fill="#ffffff" opacity="0.06">
    <rect x="40" y="500" width="60" height="110"/>
    <rect x="110" y="460" width="60" height="150"/>
    <rect x="180" y="520" width="60" height="90"/>
  </g>

  <!-- house icon -->
  <g transform="translate(200,250)" filter="url(#shadow)">
    <rect x="-56" y="-10" width="112" height="76" rx="10" fill="url(#houseGrad)"/>
    <path d="M-66,-6 L0,-64 L66,-6 Z" fill="url(#houseGrad)"/>
    <rect x="-16" y="24" width="32" height="42" rx="4" fill="#0d1b3a" opacity="0.7"/>
    <rect x="-40" y="6" width="18" height="16" rx="3" fill="#eef4ff" opacity="0.85"/>
    <rect x="22" y="6" width="18" height="16" rx="3" fill="#eef4ff" opacity="0.85"/>
  </g>
  <text x="200" y="350" text-anchor="middle" font-size="15" fill="#dcebfc">재건축 단지</text>

  <!-- coin / levy badge icon -->
  <g transform="translate(345,405)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="48" fill="url(#coinGrad)"/>
    <text x="0" y="12" text-anchor="middle" font-size="34" font-weight="bold" fill="#0d1b3a">%</text>
  </g>
  <text x="345" y="475" text-anchor="middle" font-size="15" fill="#dcebfc">부담금 완화</text>

  <!-- checklist badge -->
  <g transform="translate(1010,470)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="42" fill="url(#cream)" opacity="0.97"/>
    <path d="M-16,-2 L-6,10 L18,-16" fill="none" stroke="#1b3a70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1010" y="527" text-anchor="middle" font-size="15" fill="#dcebfc">체크포인트</text>

  <!-- title text block -->
  <rect x="410" y="90" width="660" height="300" rx="26" fill="#ffffff" opacity="0.06"/>
  <text x="430" y="162" font-size="26" font-weight="bold" fill="#eef4ff">재건축 초과이익환수제</text>
  <text x="430" y="210" font-size="26" font-weight="bold" fill="#eef4ff">완화, 내 부담은</text>
  <text x="430" y="258" font-size="26" font-weight="bold" fill="#eef4ff">얼마나 줄어들까</text>
  <text x="430" y="296" font-size="17" fill="#bcd8f5">면제 기준·부과율 완화 논의 정리</text>

  <!-- bottom tag -->
  <rect x="430" y="515" width="130" height="46" rx="23" fill="#eef4ff" opacity="0.94"/>
  <text x="495" y="544" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b3a70">부동산정책</text>
</svg>
