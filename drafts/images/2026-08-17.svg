<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a1e0d"/>
      <stop offset="55%" stop-color="#8a3f14"/>
      <stop offset="100%" stop-color="#e08a2e"/>
    </linearGradient>
    <linearGradient id="cream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e6"/>
      <stop offset="100%" stop-color="#ffd9ad"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcf8f"/>
      <stop offset="100%" stop-color="#d97a24"/>
    </linearGradient>
    <linearGradient id="arrowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb066"/>
      <stop offset="100%" stop-color="#c65e13"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="110" r="230" fill="url(#glow)"/>
  <circle cx="90" cy="560" r="190" fill="url(#glow)"/>

  <!-- coin stack icon -->
  <g transform="translate(200,260)" filter="url(#shadow)">
    <ellipse cx="0" cy="60" rx="60" ry="18" fill="url(#coinGrad)"/>
    <ellipse cx="0" cy="30" rx="60" ry="18" fill="url(#coinGrad)"/>
    <ellipse cx="0" cy="0" rx="60" ry="18" fill="url(#coinGrad)"/>
    <text x="0" y="6" text-anchor="middle" font-size="20" font-weight="bold" fill="#3a1e0d">₩</text>
  </g>
  <text x="200" y="365" text-anchor="middle" font-size="15" fill="#ffe6c2">기존 대출</text>

  <!-- swap arrows icon -->
  <g transform="translate(345,410)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="48" fill="url(#arrowGrad2)"/>
    <path d="M-22,-10 A22,22 0 0 1 18,-20" fill="none" stroke="#fff3e6" stroke-width="5" stroke-linecap="round"/>
    <path d="M8,-28 L20,-19 L6,-12" fill="none" stroke="#fff3e6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22,10 A22,22 0 0 1 -18,20" fill="none" stroke="#fff3e6" stroke-width="5" stroke-linecap="round"/>
    <path d="M-8,28 L-20,19 L-6,12" fill="none" stroke="#fff3e6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="345" y="480" text-anchor="middle" font-size="15" fill="#ffe6c2">대환 갈아타기</text>

  <!-- checklist badge -->
  <g transform="translate(1010,470)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="42" fill="url(#cream)" opacity="0.97"/>
    <path d="M-16,-2 L-6,10 L18,-16" fill="none" stroke="#8a3f14" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1010" y="527" text-anchor="middle" font-size="15" fill="#ffe6c2">체크포인트</text>

  <!-- title text block -->
  <rect x="410" y="90" width="660" height="300" rx="26" fill="#ffffff" opacity="0.07"/>
  <text x="430" y="152" font-size="25" font-weight="bold" fill="#fff3e6">가계대출 관리 강화</text>
  <text x="430" y="198" font-size="25" font-weight="bold" fill="#fff3e6">국면, 대환대출로</text>
  <text x="430" y="244" font-size="25" font-weight="bold" fill="#fff3e6">갈아타기 지금</text>
  <text x="430" y="290" font-size="25" font-weight="bold" fill="#fff3e6">유리할까</text>
  <text x="430" y="326" font-size="17" fill="#ffd9ad">대환대출 조건과 체크리스트 정리</text>

  <!-- bottom tag -->
  <rect x="430" y="515" width="90" height="46" rx="23" fill="#fff3e6" opacity="0.94"/>
  <text x="475" y="544" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a3f14">대출</text>
</svg>
