<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#d1f5ee"/>
    </linearGradient>
    <linearGradient id="cardBgLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2fd"/>
    </linearGradient>
    <linearGradient id="cardBgRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eafaf6"/>
    </linearGradient>
    <linearGradient id="badgeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="badgeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="noteBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="620" fill="url(#pageBg)"/>

  <text x="400" y="42" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="23" font-weight="800" fill="#312e81" text-anchor="middle">일반 서버와 AI(GPU) 서버, 무엇이 다를까</text>
  <text x="400" y="66" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13.5" fill="#164e63" text-anchor="middle">전력 소비 구조로 본 차이 (예시로 이해를 돕기 위한 개념도)</text>

  <!-- left column: 일반 서버 -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="96" width="300" height="420" rx="18" fill="url(#cardBgLeft)"/>
  </g>
  <circle cx="100" cy="136" r="22" fill="url(#badgeLeft)"/>
  <text x="100" y="143" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">일반</text>
  <text x="134" y="142" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#312e81">일반 IT 서버</text>

  <line x1="90" y1="168" x2="330" y2="168" stroke="#dcdcf7" stroke-width="1.5"/>

  <circle cx="100" cy="204" r="14" fill="#e6e6fb"/>
  <text x="100" y="209" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" fill="#4338ca" text-anchor="middle">1</text>
  <text x="126" y="200" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#312e81">단순 연산 위주</text>
  <text x="126" y="220" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11.5" fill="#5b5b8a">웹·DB 처리 등 상대적으로 가벼운 작업</text>

  <circle cx="100" cy="270" r="14" fill="#e6e6fb"/>
  <text x="100" y="275" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" fill="#4338ca" text-anchor="middle">2</text>
  <text x="126" y="266" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#312e81">전력 소모 상대적으로 적음</text>
  <text x="126" y="286" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11.5" fill="#5b5b8a">CPU 중심, 발열도 비교적 낮은 편</text>

  <circle cx="100" cy="336" r="14" fill="#e6e6fb"/>
  <text x="100" y="341" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" fill="#4338ca" text-anchor="middle">3</text>
  <text x="126" y="332" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#312e81">가동률 변동 있음</text>
  <text x="126" y="352" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11.5" fill="#5b5b8a">시간대·트래픽에 따라 부하가 오르내림</text>

  <circle cx="100" cy="402" r="14" fill="#e6e6fb"/>
  <text x="100" y="407" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" fill="#4338ca" text-anchor="middle">4</text>
  <text x="126" y="398" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#312e81">냉각 부담 비교적 완만</text>
  <text x="126" y="418" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11.5" fill="#5b5b8a">기존 공조 설비로 대응 가능한 수준</text>

  <!-- arrow -->
  <path d="M368 306 L432 306" stroke="url(#arrowGrad)" stroke-width="4" fill="none"/>
  <path d="M420 294 L436 306 L420 318" fill="none" stroke="url(#arrowGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="400" y="290" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12" font-weight="700" fill="#0f766e">AI 서버는</text>

  <!-- right column: AI(GPU) 서버 -->
  <g filter="url(#cardShadow)">
    <rect x="440" y="96" width="300" height="420" rx="18" fill="url(#cardBgRight)"/>
  </g>
  <circle cx="480" cy="136" r="22" fill="url(#badgeRight)"/>
  <text x="480" y="143" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">AI</text>
  <text x="514" y="142" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#134e4a">AI(GPU) 서버</text>

  <line x1="470" y1="168" x2="710" y2="168" stroke="#c9f1e8" stroke-width="1.5"/>

  <circle cx="480" cy="204" r="14" fill="#d3f7ef"/>
  <text x="480" y="209" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" fill="#0f766e" text-anchor="middle">1</text>
  <text x="506" y="200" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#134e4a">대규모 병렬 연산</text>
  <text x="506" y="220" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11.5" fill="#2f6f66">모델 학습·응답 생성에 막대한 계산 필요</text>

  <circle cx="480" cy="270" r="14" fill="#d3f7ef"/>
  <text x="480" y="275" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" fill="#0f766e" text-anchor="middle">2</text>
  <text x="506" y="266" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#134e4a">전력 소모 크게 증가</text>
  <text x="506" y="286" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11.5" fill="#2f6f66">GPU 다수 탑재로 소비전력이 크게 늘어남</text>

  <circle cx="480" cy="336" r="14" fill="#d3f7ef"/>
  <text x="480" y="341" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" fill="#0f766e" text-anchor="middle">3</text>
  <text x="506" y="332" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#134e4a">거의 상시 고가동</text>
  <text x="506" y="352" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11.5" fill="#2f6f66">24시간 학습·서비스로 부하가 꾸준히 높음</text>

  <circle cx="480" cy="402" r="14" fill="#d3f7ef"/>
  <text x="480" y="407" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" fill="#0f766e" text-anchor="middle">4</text>
  <text x="506" y="398" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#134e4a">별도 냉각 인프라 필요</text>
  <text x="506" y="418" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11.5" fill="#2f6f66">발열이 많아 전용 냉각 설비가 추가로 필요</text>

  <!-- note banner -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="546" width="680" height="56" rx="16" fill="url(#noteBg)" opacity="0.95"/>
  </g>
  <circle cx="100" cy="574" r="17" fill="#eef2ff"/>
  <text x="100" y="580" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#4338ca" text-anchor="middle">!</text>
  <text x="128" y="569" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">실제 전력 소비량은 시설·규모별로 크게 다릅니다</text>
  <text x="128" y="587" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11.5" fill="#e0e7ff">구체적인 수치는 각 사업자·기관의 공식 발표를 확인하세요</text>
</svg>
