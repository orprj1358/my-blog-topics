<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#164e63"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="cream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#bfe9e2"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="110" r="230" fill="url(#glow)"/>
  <circle cx="90" cy="560" r="190" fill="url(#glow)"/>

  <!-- faint circuit lines -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" fill="none">
    <path d="M40,80 L40,140 L120,140"/>
    <path d="M60,600 L60,560 L160,560"/>
    <path d="M1150,560 L1090,560 L1090,600"/>
  </g>

  <!-- chip icon -->
  <g transform="translate(200,250)" filter="url(#shadow)">
    <rect x="-52" y="-52" width="104" height="104" rx="18" fill="url(#chipGrad)"/>
    <rect x="-24" y="-24" width="48" height="48" rx="8" fill="#1e1b4b" opacity="0.55"/>
    <g stroke="#eef2ff" stroke-width="4" stroke-linecap="round" opacity="0.9">
      <line x1="-52" y1="-16" x2="-70" y2="-16"/>
      <line x1="-52" y1="16" x2="-70" y2="16"/>
      <line x1="52" y1="-16" x2="70" y2="-16"/>
      <line x1="52" y1="16" x2="70" y2="16"/>
      <line x1="-16" y1="-52" x2="-16" y2="-70"/>
      <line x1="16" y1="-52" x2="16" y2="-70"/>
      <line x1="-16" y1="52" x2="-16" y2="70"/>
      <line x1="16" y1="52" x2="16" y2="70"/>
    </g>
  </g>
  <text x="200" y="350" text-anchor="middle" font-size="15" fill="#dceee9">AI 서버</text>

  <!-- server node icon -->
  <g transform="translate(345,405)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="48" fill="url(#nodeGrad)"/>
    <rect x="-22" y="-24" width="44" height="12" rx="3" fill="#0f2f2b" opacity="0.75"/>
    <rect x="-22" y="-6" width="44" height="12" rx="3" fill="#0f2f2b" opacity="0.75"/>
    <rect x="-22" y="12" width="44" height="12" rx="3" fill="#0f2f2b" opacity="0.75"/>
  </g>
  <text x="345" y="475" text-anchor="middle" font-size="15" fill="#dceee9">데이터센터</text>

  <!-- power bolt badge -->
  <g transform="translate(1010,470)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="42" fill="url(#cream)" opacity="0.97"/>
    <path d="M4,-20 L-14,6 L-2,6 L-4,22 L16,-6 L2,-6 Z" fill="#164e63"/>
  </g>
  <text x="1010" y="527" text-anchor="middle" font-size="15" fill="#dceee9">전력 수요</text>

  <!-- title text block -->
  <rect x="410" y="90" width="660" height="300" rx="26" fill="#ffffff" opacity="0.06"/>
  <text x="430" y="150" font-size="25" font-weight="bold" fill="#eef2ff">AI 데이터센터</text>
  <text x="430" y="196" font-size="25" font-weight="bold" fill="#eef2ff">전력 수요 급증,</text>
  <text x="430" y="242" font-size="25" font-weight="bold" fill="#eef2ff">우리 생활엔 어떤 영향</text>
  <text x="430" y="280" font-size="17" fill="#bfe9e2">GPU 서버가 전기를 많이 쓰는 이유</text>

  <!-- bottom tag -->
  <rect x="430" y="515" width="160" height="46" rx="23" fill="#eef2ff" opacity="0.94"/>
  <text x="510" y="544" text-anchor="middle" font-size="16" font-weight="bold" fill="#164e63">AI 관련 소식</text>
</svg>
