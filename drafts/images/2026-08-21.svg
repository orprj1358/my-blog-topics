<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#341a08"/>
      <stop offset="55%" stop-color="#8a4612"/>
      <stop offset="100%" stop-color="#e08a2e"/>
    </linearGradient>
    <linearGradient id="cream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6ea"/>
      <stop offset="100%" stop-color="#ffd8a3"/>
    </linearGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc776"/>
      <stop offset="100%" stop-color="#c9640f"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdca0"/>
      <stop offset="100%" stop-color="#d9791c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="110" r="230" fill="url(#glow)"/>
  <circle cx="90" cy="560" r="190" fill="url(#glow)"/>

  <!-- soft skyline hint -->
  <g fill="#ffffff" opacity="0.06">
    <rect x="40" y="500" width="60" height="110"/>
    <rect x="110" y="460" width="60" height="150"/>
    <rect x="180" y="520" width="60" height="90"/>
  </g>

  <!-- house icon -->
  <g transform="translate(200,250)" filter="url(#shadow)">
    <rect x="-56" y="-10" width="112" height="76" rx="10" fill="url(#houseGrad)"/>
    <path d="M-66,-6 L0,-64 L66,-6 Z" fill="url(#houseGrad)"/>
    <rect x="-16" y="24" width="32" height="42" rx="4" fill="#341a08" opacity="0.7"/>
    <rect x="-40" y="6" width="18" height="16" rx="3" fill="#fff6ea" opacity="0.85"/>
    <rect x="22" y="6" width="18" height="16" rx="3" fill="#fff6ea" opacity="0.85"/>
  </g>
  <text x="200" y="350" text-anchor="middle" font-size="15" fill="#ffe6c2">첫 내 집</text>

  <!-- coin / percent badge -->
  <g transform="translate(345,405)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="48" fill="url(#coinGrad)"/>
    <text x="0" y="10" text-anchor="middle" font-size="34" font-weight="bold" fill="#5a2e08">%</text>
  </g>
  <text x="345" y="475" text-anchor="middle" font-size="15" fill="#ffe6c2">우대금리</text>

  <!-- checklist badge -->
  <g transform="translate(1010,470)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="42" fill="url(#cream)" opacity="0.97"/>
    <path d="M-14,0 L-4,10 L16,-14" fill="none" stroke="#8a4612" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1010" y="527" text-anchor="middle" font-size="15" fill="#ffe6c2">요건 확인</text>

  <!-- title text block -->
  <rect x="410" y="90" width="660" height="300" rx="26" fill="#ffffff" opacity="0.06"/>
  <text x="430" y="150" font-size="25" font-weight="bold" fill="#fff6ea">생애최초</text>
  <text x="430" y="196" font-size="25" font-weight="bold" fill="#fff6ea">주택구입자금 대출,</text>
  <text x="430" y="242" font-size="25" font-weight="bold" fill="#fff6ea">조건과 한도 알아보기</text>
  <text x="430" y="280" font-size="17" fill="#ffd8a3">첫 내 집 마련, 자격부터 확인</text>

  <!-- bottom tag -->
  <rect x="430" y="515" width="90" height="46" rx="23" fill="#fff6ea" opacity="0.94"/>
  <text x="475" y="544" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a4612">대출</text>
</svg>
