<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="55%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="cream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="110" r="230" fill="url(#glow)"/>
  <circle cx="90" cy="560" r="190" fill="url(#glow)"/>

  <!-- faint dashed calendar-ish lines -->
  <g stroke="#ffffff" stroke-opacity="0.09" stroke-width="2" fill="none">
    <path d="M40,80 L40,140 L120,140"/>
    <path d="M60,600 L60,560 L160,560"/>
    <path d="M1150,560 L1090,560 L1090,600"/>
  </g>

  <!-- house icon -->
  <g transform="translate(200,250)" filter="url(#shadow)">
    <path d="M-54,6 L0,-46 L54,6 L54,54 L-54,54 Z" fill="url(#houseGrad)"/>
    <rect x="-16" y="10" width="32" height="44" rx="4" fill="#7c2d12"/>
    <rect x="-38" y="-4" width="18" height="18" rx="3" fill="#fff7ed" opacity="0.85"/>
    <rect x="20" y="-4" width="18" height="18" rx="3" fill="#fff7ed" opacity="0.85"/>
  </g>
  <text x="200" y="350" text-anchor="middle" font-size="15" fill="#fef3e2">전세 갱신</text>

  <!-- percent coin badge -->
  <g transform="translate(345,405)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="46" fill="url(#coinGrad)"/>
    <text x="0" y="12" text-anchor="middle" font-size="34" font-weight="bold" fill="#7c2d12">%</text>
  </g>
  <text x="345" y="475" text-anchor="middle" font-size="15" fill="#fef3e2">대출 한도</text>

  <!-- calendar / clock badge -->
  <g transform="translate(1010,470)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="42" fill="url(#cream)" opacity="0.97"/>
    <circle cx="0" cy="2" r="20" fill="none" stroke="#9a3412" stroke-width="4.5"/>
    <line x1="0" y1="2" x2="0" y2="-10" stroke="#9a3412" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="0" y1="2" x2="10" y2="8" stroke="#9a3412" stroke-width="4.5" stroke-linecap="round"/>
  </g>
  <text x="1010" y="527" text-anchor="middle" font-size="15" fill="#fef3e2">미리 확인</text>

  <!-- title text block -->
  <rect x="410" y="70" width="670" height="330" rx="26" fill="#ffffff" opacity="0.06"/>
  <text x="430" y="130" font-size="25" font-weight="bold" fill="#fff7ed">전세대출 갱신 시점,</text>
  <text x="430" y="176" font-size="25" font-weight="bold" fill="#fff7ed">규제 강화로 한도</text>
  <text x="430" y="222" font-size="25" font-weight="bold" fill="#fff7ed">줄어들 수 있다는데</text>
  <text x="430" y="262" font-size="17" fill="#fde68a">갱신 앞둔 세입자가 챙겨야 할 것들</text>

  <!-- bottom tag -->
  <rect x="430" y="515" width="100" height="46" rx="23" fill="#fff7ed" opacity="0.94"/>
  <text x="480" y="544" text-anchor="middle" font-size="16" font-weight="bold" fill="#9a3412">대출</text>
</svg>
