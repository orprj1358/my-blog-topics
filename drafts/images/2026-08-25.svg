<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2942"/>
      <stop offset="55%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="110" r="230" fill="url(#glow)"/>
  <circle cx="90" cy="560" r="190" fill="url(#glow)"/>

  <!-- faint dashed blueprint-ish lines -->
  <g stroke="#ffffff" stroke-opacity="0.09" stroke-width="2" fill="none">
    <path d="M40,80 L40,140 L120,140"/>
    <path d="M60,600 L60,560 L160,560"/>
    <path d="M1150,560 L1090,560 L1090,600"/>
  </g>

  <!-- apartment building icon -->
  <g transform="translate(200,250)" filter="url(#shadow)">
    <rect x="-46" y="-70" width="92" height="124" rx="8" fill="url(#buildingGrad)"/>
    <rect x="-30" y="-52" width="16" height="16" rx="3" fill="#eff6ff" opacity="0.85"/>
    <rect x="-6" y="-52" width="16" height="16" rx="3" fill="#eff6ff" opacity="0.85"/>
    <rect x="18" y="-52" width="16" height="16" rx="3" fill="#eff6ff" opacity="0.85"/>
    <rect x="-30" y="-26" width="16" height="16" rx="3" fill="#eff6ff" opacity="0.85"/>
    <rect x="-6" y="-26" width="16" height="16" rx="3" fill="#eff6ff" opacity="0.85"/>
    <rect x="18" y="-26" width="16" height="16" rx="3" fill="#eff6ff" opacity="0.85"/>
    <rect x="-30" y="0" width="16" height="16" rx="3" fill="#eff6ff" opacity="0.85"/>
    <rect x="-6" y="0" width="16" height="16" rx="3" fill="#eff6ff" opacity="0.85"/>
    <rect x="18" y="0" width="16" height="16" rx="3" fill="#eff6ff" opacity="0.85"/>
    <rect x="-14" y="26" width="28" height="28" rx="4" fill="#0f2942"/>
  </g>
  <text x="200" y="330" text-anchor="middle" font-size="15" fill="#e0f2fe">재건축 사업</text>

  <!-- percent coin badge -->
  <g transform="translate(345,405)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="46" fill="url(#coinGrad)"/>
    <text x="0" y="12" text-anchor="middle" font-size="34" font-weight="bold" fill="#0c2f4d">%</text>
  </g>
  <text x="345" y="475" text-anchor="middle" font-size="15" fill="#e0f2fe">부담금 기준</text>

  <!-- document / check badge -->
  <g transform="translate(1010,470)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="42" fill="url(#cream)" opacity="0.97"/>
    <rect x="-13" y="-16" width="26" height="32" rx="3" fill="none" stroke="#1e40af" stroke-width="3.5"/>
    <path d="M-7,-2 L-2,4 L9,-9" fill="none" stroke="#1e40af" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1010" y="527" text-anchor="middle" font-size="15" fill="#e0f2fe">법 개정 여부</text>

  <!-- title text block -->
  <rect x="410" y="70" width="670" height="330" rx="26" fill="#ffffff" opacity="0.06"/>
  <text x="430" y="130" font-size="25" font-weight="bold" fill="#eff6ff">재건축초과이익환수제</text>
  <text x="430" y="176" font-size="25" font-weight="bold" fill="#eff6ff">완화 논의, 실제 부담은</text>
  <text x="430" y="222" font-size="25" font-weight="bold" fill="#eff6ff">얼마나 줄어들까</text>
  <text x="430" y="262" font-size="17" fill="#bfdbfe">조합원이 미리 챙겨볼 체크포인트</text>

  <!-- bottom tag -->
  <rect x="430" y="515" width="130" height="46" rx="23" fill="#eff6ff" opacity="0.94"/>
  <text x="495" y="544" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">부동산정책</text>
</svg>
