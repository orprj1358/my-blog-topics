<svg width="800" height="620" viewBox="0 0 800 620" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="leftCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="rightCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="badgeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="badgeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.18"/>
    </filter>
    <filter id="badgeShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="620" fill="url(#pageBg)"/>

  <!-- headers -->
  <text x="200" y="56" text-anchor="middle" font-size="22" font-weight="bold" fill="#3730a3">챗봇</text>
  <text x="600" y="56" text-anchor="middle" font-size="22" font-weight="bold" fill="#0e7490">AI 에이전트</text>
  <line x1="400" y1="30" x2="400" y2="580" stroke="#c7d2fe" stroke-width="2" stroke-dasharray="6,8"/>

  <!-- LEFT: chatbot single-step card -->
  <g filter="url(#cardShadow)">
    <rect x="70" y="90" width="260" height="120" rx="20" fill="url(#leftCard)"/>
  </g>
  <circle cx="105" cy="122" r="18" fill="url(#badgeLeft)" filter="url(#badgeShadow)"/>
  <text x="105" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">1</text>
  <text x="135" y="128" font-size="16" font-weight="bold" fill="#312e81">질문</text>
  <text x="105" y="185" text-anchor="middle" font-size="13" fill="#4338ca">"오늘 날씨 어때?"</text>

  <g stroke="#818cf8" stroke-width="3" fill="none" marker-end="url(#arrowLeft)">
    <path d="M200,210 L200,250"/>
  </g>
  <defs>
    <marker id="arrowLeft" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#818cf8"/>
    </marker>
  </defs>

  <g filter="url(#cardShadow)">
    <rect x="70" y="260" width="260" height="120" rx="20" fill="url(#leftCard)"/>
  </g>
  <circle cx="105" cy="292" r="18" fill="url(#badgeLeft)" filter="url(#badgeShadow)"/>
  <text x="105" y="298" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">2</text>
  <text x="135" y="298" font-size="16" font-weight="bold" fill="#312e81">답변</text>
  <text x="105" y="355" text-anchor="middle" font-size="13" fill="#4338ca">한 번에 결과 출력</text>

  <g filter="url(#cardShadow)">
    <rect x="90" y="440" width="220" height="70" rx="18" fill="#e0e7ff" opacity="0.8"/>
  </g>
  <text x="200" y="482" text-anchor="middle" font-size="14" fill="#3730a3">여기서 대화 종료</text>

  <!-- RIGHT: agent multi-step flow -->
  <g filter="url(#cardShadow)">
    <rect x="470" y="70" width="260" height="80" rx="18" fill="url(#rightCard)"/>
  </g>
  <circle cx="505" cy="94" r="16" fill="url(#badgeRight)" filter="url(#badgeShadow)"/>
  <text x="505" y="99" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">1</text>
  <text x="530" y="99" font-size="15" font-weight="bold" fill="#0f766e">목표 설정</text>
  <text x="505" y="128" text-anchor="middle" font-size="12" fill="#0e7490">"여행 일정 짜줘"</text>

  <path d="M600,150 L600,172" stroke="#2dd4bf" stroke-width="3" marker-end="url(#arrowRight)"/>

  <g filter="url(#cardShadow)">
    <rect x="470" y="180" width="260" height="80" rx="18" fill="url(#rightCard)"/>
  </g>
  <circle cx="505" cy="204" r="16" fill="url(#badgeRight)" filter="url(#badgeShadow)"/>
  <text x="505" y="209" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">2</text>
  <text x="530" y="209" font-size="15" font-weight="bold" fill="#0f766e">계획 수립</text>
  <text x="505" y="238" text-anchor="middle" font-size="12" fill="#0e7490">하위 작업 분해</text>

  <path d="M600,260 L600,282" stroke="#2dd4bf" stroke-width="3" marker-end="url(#arrowRight)"/>

  <g filter="url(#cardShadow)">
    <rect x="470" y="290" width="260" height="80" rx="18" fill="url(#rightCard)"/>
  </g>
  <circle cx="505" cy="314" r="16" fill="url(#badgeRight)" filter="url(#badgeShadow)"/>
  <text x="505" y="319" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">3</text>
  <text x="530" y="319" font-size="15" font-weight="bold" fill="#0f766e">도구 실행</text>
  <text x="505" y="348" text-anchor="middle" font-size="12" fill="#0e7490">검색·계산·작성</text>

  <path d="M600,370 L600,392" stroke="#2dd4bf" stroke-width="3" marker-end="url(#arrowRight)"/>

  <g filter="url(#cardShadow)">
    <rect x="470" y="400" width="260" height="80" rx="18" fill="url(#rightCard)"/>
  </g>
  <circle cx="505" cy="424" r="16" fill="url(#badgeRight)" filter="url(#badgeShadow)"/>
  <text x="505" y="429" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">4</text>
  <text x="530" y="429" font-size="15" font-weight="bold" fill="#0f766e">결과 확인</text>
  <text x="505" y="458" text-anchor="middle" font-size="12" fill="#0e7490">중간 점검 후 다음 단계</text>

  <path d="M600,480 L600,502" stroke="#2dd4bf" stroke-width="3" marker-end="url(#arrowRight)"/>

  <defs>
    <marker id="arrowRight" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2dd4bf"/>
    </marker>
  </defs>

  <g filter="url(#cardShadow)">
    <rect x="490" y="510" width="220" height="70" rx="18" fill="#ccfbf1" opacity="0.9"/>
  </g>
  <text x="600" y="552" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f766e">목표 완료까지 자동 반복</text>
</svg>
