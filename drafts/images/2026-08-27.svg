<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="55%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="cream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="storeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="110" r="230" fill="url(#glow)"/>
  <circle cx="90" cy="560" r="190" fill="url(#glow)"/>

  <!-- faint dashed lines -->
  <g stroke="#ffffff" stroke-opacity="0.09" stroke-width="2" fill="none">
    <path d="M40,80 L40,140 L120,140"/>
    <path d="M60,600 L60,560 L160,560"/>
    <path d="M1150,560 L1090,560 L1090,600"/>
  </g>

  <!-- small storefront icon -->
  <g transform="translate(200,250)" filter="url(#shadow)">
    <rect x="-50" y="-10" width="100" height="82" rx="6" fill="url(#storeGrad)"/>
    <path d="M-58,-10 L-46,-46 L46,-46 L58,-10 Z" fill="#fed7aa"/>
    <rect x="-58" y="-14" width="116" height="10" rx="5" fill="#7c2d12"/>
    <rect x="-14" y="30" width="28" height="42" rx="3" fill="#fff7ed"/>
    <rect x="-38" y="10" width="18" height="18" rx="3" fill="#fff7ed" opacity="0.9"/>
    <rect x="20" y="10" width="18" height="18" rx="3" fill="#fff7ed" opacity="0.9"/>
  </g>
  <text x="200" y="330" text-anchor="middle" font-size="15" fill="#fff7ed">소상공인 점포</text>

  <!-- clock / extension badge -->
  <g transform="translate(345,405)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="46" fill="url(#coinGrad)"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#7c2d12" stroke-width="3.5"/>
    <path d="M0,-16 L0,0 L13,8" fill="none" stroke="#7c2d12" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="345" y="475" text-anchor="middle" font-size="15" fill="#fff7ed">만기연장</text>

  <!-- percent coin badge -->
  <g transform="translate(1010,470)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="42" fill="url(#cream)" opacity="0.97"/>
    <text x="0" y="12" text-anchor="middle" font-size="30" font-weight="bold" fill="#9a3412">%</text>
  </g>
  <text x="1010" y="527" text-anchor="middle" font-size="15" fill="#fff7ed">이자유예</text>

  <!-- title text block -->
  <rect x="410" y="70" width="670" height="330" rx="26" fill="#ffffff" opacity="0.08"/>
  <text x="430" y="130" font-size="25" font-weight="bold" fill="#fff7ed">소상공인 대출</text>
  <text x="430" y="176" font-size="25" font-weight="bold" fill="#fff7ed">만기연장·이자유예,</text>
  <text x="430" y="222" font-size="25" font-weight="bold" fill="#fff7ed">연착륙은 언제쯤 마무리될까</text>
  <text x="430" y="262" font-size="17" fill="#fed7aa">지금 이용 중이라면 미리 확인할 것들</text>

  <!-- bottom tag -->
  <rect x="430" y="515" width="90" height="46" rx="23" fill="#fff7ed" opacity="0.94"/>
  <text x="475" y="544" text-anchor="middle" font-size="16" font-weight="bold" fill="#7c2d12">대출</text>
</svg>
