<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2942"/>
      <stop offset="55%" stop-color="#1e4d78"/>
      <stop offset="100%" stop-color="#3b82c4"/>
    </linearGradient>
    <linearGradient id="cream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef5fb"/>
      <stop offset="100%" stop-color="#bfdcf2"/>
    </linearGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a9d0ee"/>
      <stop offset="100%" stop-color="#1e4d78"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfdcf2"/>
      <stop offset="100%" stop-color="#3b82c4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="110" r="230" fill="url(#glow)"/>
  <circle cx="90" cy="560" r="190" fill="url(#glow)"/>

  <!-- faint blueprint-ish grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" fill="none">
    <path d="M40,80 L40,140 L120,140"/>
    <path d="M60,600 L60,560 L160,560"/>
    <path d="M1150,560 L1090,560 L1090,600"/>
  </g>

  <!-- house / building icon -->
  <g transform="translate(200,250)" filter="url(#shadow)">
    <path d="M-54,6 L0,-46 L54,6 L54,54 L-54,54 Z" fill="url(#houseGrad)"/>
    <rect x="-16" y="10" width="32" height="44" rx="4" fill="#0f2942"/>
    <rect x="-38" y="-4" width="18" height="18" rx="3" fill="#eef5fb" opacity="0.85"/>
    <rect x="20" y="-4" width="18" height="18" rx="3" fill="#eef5fb" opacity="0.85"/>
  </g>
  <text x="200" y="350" text-anchor="middle" font-size="15" fill="#eaf3fb">노후 아파트</text>

  <!-- checkmark badge (safety diagnosis) -->
  <g transform="translate(345,405)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="46" fill="url(#badgeGrad)"/>
    <path d="M-18,2 L-4,18 L22,-16" fill="none" stroke="#0f2942" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="345" y="475" text-anchor="middle" font-size="15" fill="#eaf3fb">안전진단</text>

  <!-- clock badge -->
  <g transform="translate(1010,470)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="42" fill="url(#cream)" opacity="0.97"/>
    <circle cx="0" cy="2" r="20" fill="none" stroke="#1e4d78" stroke-width="4.5"/>
    <line x1="0" y1="2" x2="0" y2="-10" stroke="#1e4d78" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="0" y1="2" x2="10" y2="8" stroke="#1e4d78" stroke-width="4.5" stroke-linecap="round"/>
  </g>
  <text x="1010" y="527" text-anchor="middle" font-size="15" fill="#eaf3fb">속도 변화</text>

  <!-- title text block -->
  <rect x="410" y="70" width="670" height="330" rx="26" fill="#ffffff" opacity="0.06"/>
  <text x="430" y="120" font-size="24" font-weight="bold" fill="#eef5fb">재건축 안전진단</text>
  <text x="430" y="166" font-size="24" font-weight="bold" fill="#eef5fb">규제 완화, 노후 아파트</text>
  <text x="430" y="212" font-size="24" font-weight="bold" fill="#eef5fb">재건축 속도 빨라질까</text>
  <text x="430" y="252" font-size="17" fill="#bfdcf2">완화 논의의 배경과 체크포인트</text>

  <!-- bottom tag -->
  <rect x="430" y="515" width="120" height="46" rx="23" fill="#eef5fb" opacity="0.94"/>
  <text x="490" y="544" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e4d78">부동산정책</text>
</svg>
