<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2942"/>
      <stop offset="55%" stop-color="#1e4d78"/>
      <stop offset="100%" stop-color="#3b82c4"/>
    </linearGradient>
    <linearGradient id="cream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef5fb"/>
      <stop offset="100%" stop-color="#bfdcf2"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a9d0ee"/>
      <stop offset="100%" stop-color="#1e4d78"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfdcf2"/>
      <stop offset="100%" stop-color="#3b82c4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="110" r="230" fill="url(#glow)"/>
  <circle cx="90" cy="560" r="190" fill="url(#glow)"/>

  <!-- faint blueprint-ish grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" fill="none">
    <path d="M40,80 L40,140 L120,140"/>
    <path d="M60,600 L60,560 L160,560"/>
    <path d="M1150,560 L1090,560 L1090,600"/>
  </g>

  <!-- apartment building icon -->
  <g transform="translate(200,250)" filter="url(#shadow)">
    <rect x="-42" y="-70" width="84" height="124" rx="8" fill="url(#buildingGrad)"/>
    <rect x="-26" y="-52" width="16" height="16" rx="3" fill="#eef5fb" opacity="0.85"/>
    <rect x="2" y="-52" width="16" height="16" rx="3" fill="#eef5fb" opacity="0.85"/>
    <rect x="-26" y="-24" width="16" height="16" rx="3" fill="#eef5fb" opacity="0.85"/>
    <rect x="2" y="-24" width="16" height="16" rx="3" fill="#eef5fb" opacity="0.85"/>
    <rect x="-26" y="4" width="16" height="16" rx="3" fill="#eef5fb" opacity="0.85"/>
    <rect x="2" y="4" width="16" height="16" rx="3" fill="#eef5fb" opacity="0.85"/>
    <rect x="-14" y="32" width="28" height="22" rx="3" fill="#0f2942"/>
  </g>
  <text x="200" y="350" text-anchor="middle" font-size="15" fill="#eaf3fb">아파트 분양</text>

  <!-- ticket / lottery badge -->
  <g transform="translate(345,405)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="46" fill="url(#badgeGrad)"/>
    <path d="M-20,-8 L20,-8 L20,10 Q12,10 12,18 Q12,26 20,26 L-20,26 Q-20,18 -12,18 Q-20,18 -20,10 Z" fill="none" stroke="#0f2942" stroke-width="4" stroke-linejoin="round"/>
    <line x1="4" y1="-8" x2="4" y2="26" stroke="#0f2942" stroke-width="3" stroke-dasharray="3,3"/>
  </g>
  <text x="345" y="475" text-anchor="middle" font-size="15" fill="#eaf3fb">무순위 청약</text>

  <!-- shield / requirement badge -->
  <g transform="translate(1010,470)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="42" fill="url(#cream)" opacity="0.97"/>
    <path d="M0,-16 L14,-9 L14,6 Q14,18 0,24 Q-14,18 -14,6 L-14,-9 Z" fill="none" stroke="#1e4d78" stroke-width="4"/>
  </g>
  <text x="1010" y="527" text-anchor="middle" font-size="15" fill="#eaf3fb">요건 강화</text>

  <!-- title text block -->
  <rect x="410" y="70" width="670" height="330" rx="26" fill="#ffffff" opacity="0.06"/>
  <text x="430" y="120" font-size="24" font-weight="bold" fill="#eef5fb">무순위 청약 '줍줍'</text>
  <text x="430" y="166" font-size="24" font-weight="bold" fill="#eef5fb">요건 강화 논의,</text>
  <text x="430" y="212" font-size="24" font-weight="bold" fill="#eef5fb">청약제도 이렇게 바뀐다</text>
  <text x="430" y="252" font-size="17" fill="#bfdcf2">개편 논의의 배경과 체크포인트</text>

  <!-- bottom tag -->
  <rect x="430" y="515" width="120" height="46" rx="23" fill="#eef5fb" opacity="0.94"/>
  <text x="490" y="544" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e4d78">부동산정책</text>
</svg>
