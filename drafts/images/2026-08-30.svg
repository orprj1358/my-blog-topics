<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="980" cy="120" r="260" fill="url(#glow1)"/>
  <circle cx="160" cy="520" r="260" fill="url(#glow2)"/>

  <!-- decorative network motif, right side -->
  <g opacity="0.9">
    <rect x="870" y="330" width="160" height="160" rx="28" fill="url(#chipGrad)" opacity="0.18"/>
    <rect x="900" y="360" width="100" height="100" rx="16" fill="url(#chipGrad)" opacity="0.9"/>
    <g stroke="#e0f2fe" stroke-width="2.5" opacity="0.85">
      <line x1="950" y1="360" x2="950" y2="330"/>
      <line x1="950" y1="460" x2="950" y2="490"/>
      <line x1="900" y1="410" x2="870" y2="410"/>
      <line x1="1000" y1="410" x2="1030" y2="410"/>
      <line x1="915" y1="375" x2="890" y2="350"/>
      <line x1="985" y1="445" x2="1010" y2="470"/>
      <line x1="985" y1="375" x2="1010" y2="350"/>
      <line x1="915" y1="445" x2="890" y2="470"/>
    </g>
    <circle cx="950" cy="330" r="7" fill="#5eead4"/>
    <circle cx="950" cy="490" r="7" fill="#5eead4"/>
    <circle cx="870" cy="410" r="7" fill="#818cf8"/>
    <circle cx="1030" cy="410" r="7" fill="#818cf8"/>
    <circle cx="890" cy="350" r="6" fill="#a7f3d0"/>
    <circle cx="1010" cy="470" r="6" fill="#a7f3d0"/>
    <circle cx="1010" cy="350" r="6" fill="#c7d2fe"/>
    <circle cx="890" cy="470" r="6" fill="#c7d2fe"/>
  </g>

  <!-- small scattered icons -->
  <g opacity="0.5">
    <rect x="130" y="150" width="46" height="46" rx="12" fill="none" stroke="#a7f3d0" stroke-width="2.5"/>
    <circle cx="153" cy="173" r="9" fill="#a7f3d0"/>
    <rect x="200" y="440" width="40" height="40" rx="10" fill="none" stroke="#c7d2fe" stroke-width="2.5"/>
  </g>

  <!-- text card -->
  <rect x="90" y="205" width="700" height="220" rx="28" fill="url(#cardGrad)"/>
  <text x="130" y="290" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="54" font-weight="700" fill="#f8fafc">AI 기본법 시행,</text>
  <text x="130" y="360" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="54" font-weight="700" fill="#5eead4">지금 챙겨야 할 것들</text>

  <rect x="130" y="130" width="150" height="42" rx="21" fill="url(#chipGrad)" opacity="0.9"/>
  <text x="205" y="157" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#0f172a">AI 관련 소식</text>
</svg>
