<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="barLimit1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="barLimit2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="barLimit3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7c2d12" flood-opacity="0.2"/>
    </filter>
    <filter id="badgeShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7c2d12" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="50" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="26" font-weight="700" fill="#7c2d12">스트레스 DSR 단계별 변화 (예시)</text>
  <text x="400" y="76" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#9a3412" opacity="0.85">가산금리가 커질수록 대출한도는 상대적으로 줄어듭니다</text>

  <!-- stage header cards -->
  <rect x="60" y="110" width="200" height="52" rx="24" fill="url(#card1)" filter="url(#cardShadow)"/>
  <circle cx="100" cy="136" r="20" fill="url(#badgeGrad)" filter="url(#badgeShadow)"/>
  <text x="100" y="143" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#fff7ed">1</text>
  <text x="180" y="142" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#7c2d12">1단계</text>

  <rect x="300" y="110" width="200" height="52" rx="24" fill="url(#card2)" filter="url(#cardShadow)"/>
  <circle cx="340" cy="136" r="20" fill="url(#badgeGrad)" filter="url(#badgeShadow)"/>
  <text x="340" y="143" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#fff7ed">2</text>
  <text x="420" y="142" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#7c2d12">2단계</text>

  <rect x="540" y="110" width="200" height="52" rx="24" fill="url(#card3)" filter="url(#cardShadow)"/>
  <circle cx="580" cy="136" r="20" fill="url(#badgeGrad)" filter="url(#badgeShadow)"/>
  <text x="580" y="143" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#fff7ed">3</text>
  <text x="660" y="142" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#fff7ed">3단계 (현재)</text>

  <!-- info cards under headers -->
  <rect x="60" y="182" width="200" height="86" rx="18" fill="#fffbeb" filter="url(#cardShadow)"/>
  <text x="160" y="212" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#7c2d12">가산금리 낮음</text>
  <text x="160" y="238" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#9a3412">한도 여유 있는 편</text>

  <rect x="300" y="182" width="200" height="86" rx="18" fill="#fffbeb" filter="url(#cardShadow)"/>
  <text x="400" y="212" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#7c2d12">가산금리 중간</text>
  <text x="400" y="238" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#9a3412">한도 다소 축소</text>

  <rect x="540" y="182" width="200" height="86" rx="18" fill="#fffbeb" filter="url(#cardShadow)"/>
  <text x="640" y="212" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#7c2d12">가산금리 높음</text>
  <text x="640" y="238" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#9a3412">한도 뚜렷하게 축소</text>

  <!-- bar chart: relative loan limit example -->
  <rect x="60" y="300" width="680" height="230" rx="20" fill="#ffffff" opacity="0.55" filter="url(#cardShadow)"/>
  <text x="400" y="332" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#7c2d12">단계별 대출한도 상대 비교 (예시)</text>

  <rect x="130" y="380" width="120" height="110" rx="14" fill="url(#barLimit1)"/>
  <rect x="340" y="410" width="120" height="80" rx="14" fill="url(#barLimit2)"/>
  <rect x="550" y="440" width="120" height="50" rx="14" fill="url(#barLimit3)"/>

  <text x="190" y="505" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#7c2d12">1단계</text>
  <text x="400" y="505" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#7c2d12">2단계</text>
  <text x="610" y="505" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#7c2d12">3단계</text>

  <rect x="60" y="548" width="680" height="40" rx="14" fill="#7c2d12" opacity="0.06"/>
  <text x="400" y="573" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#7c2d12">※ 그래프는 이해를 돕기 위한 예시이며, 실제 가산금리·한도 수치와 다를 수 있음</text>
</svg>
