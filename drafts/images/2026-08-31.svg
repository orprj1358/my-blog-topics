<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="980" cy="130" r="270" fill="url(#glow1)"/>
  <circle cx="150" cy="510" r="260" fill="url(#glow2)"/>

  <!-- decorative percent/coin motif, right side -->
  <g opacity="0.95">
    <circle cx="960" cy="420" r="110" fill="url(#coinGrad)" opacity="0.16"/>
    <circle cx="960" cy="420" r="78" fill="url(#coinGrad)"/>
    <text x="960" y="440" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="58" font-weight="700" fill="#7c2d12">%</text>
  </g>
  <g opacity="0.85">
    <circle cx="1060" cy="300" r="34" fill="url(#coinGrad)"/>
    <text x="1060" y="311" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#7c2d12">₩</text>
    <circle cx="1090" cy="500" r="24" fill="url(#coinGrad)" opacity="0.85"/>
  </g>

  <!-- small scattered icons -->
  <g opacity="0.5">
    <rect x="130" y="150" width="46" height="46" rx="12" fill="none" stroke="#fde68a" stroke-width="2.5"/>
    <circle cx="153" cy="173" r="9" fill="#fde68a"/>
    <rect x="200" y="440" width="40" height="40" rx="10" fill="none" stroke="#fed7aa" stroke-width="2.5"/>
  </g>

  <!-- text card -->
  <rect x="90" y="195" width="740" height="240" rx="28" fill="url(#cardGrad)"/>
  <text x="130" y="270" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="50" font-weight="700" fill="#fff7ed">스트레스 DSR 3단계,</text>
  <text x="130" y="335" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="50" font-weight="700" fill="#fde68a">내 대출한도는?</text>
  <text x="130" y="390" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" fill="#fff7ed" opacity="0.85">가산금리 확대가 바꾸는 실수요자 셈법</text>

  <rect x="130" y="130" width="110" height="42" rx="21" fill="url(#chipGrad)" opacity="0.9"/>
  <text x="185" y="157" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#7c2d12">대출</text>
</svg>
