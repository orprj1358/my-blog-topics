<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2340"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bfdbfe" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bfdbfe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="980" cy="130" r="270" fill="url(#glow1)"/>
  <circle cx="150" cy="510" r="260" fill="url(#glow2)"/>

  <!-- decorative house + green space motif, right side -->
  <g opacity="0.95">
    <circle cx="970" cy="410" r="130" fill="url(#houseGrad)" opacity="0.14"/>
    <polygon points="970,300 1055,375 885,375" fill="url(#houseGrad)"/>
    <rect x="905" y="375" width="130" height="110" rx="10" fill="url(#houseGrad)" opacity="0.92"/>
    <rect x="950" y="415" width="40" height="70" rx="6" fill="#1d4ed8"/>
    <rect x="915" y="395" width="26" height="26" rx="5" fill="#1d4ed8" opacity="0.7"/>
    <rect x="999" y="395" width="26" height="26" rx="5" fill="#1d4ed8" opacity="0.7"/>
  </g>
  <g opacity="0.8">
    <circle cx="1100" cy="300" r="28" fill="url(#houseGrad)"/>
    <path d="M 1100 288 v 24 M 1088 300 h 24" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="1110" cy="500" r="18" fill="url(#houseGrad)" opacity="0.85"/>
  </g>

  <!-- small scattered icons -->
  <g opacity="0.45">
    <rect x="130" y="150" width="46" height="46" rx="12" fill="none" stroke="#bfdbfe" stroke-width="2.5"/>
    <circle cx="153" cy="173" r="9" fill="#bfdbfe"/>
    <rect x="200" y="440" width="40" height="40" rx="10" fill="none" stroke="#dbeafe" stroke-width="2.5"/>
  </g>

  <!-- text card -->
  <rect x="90" y="175" width="760" height="260" rx="28" fill="url(#cardGrad)"/>
  <text x="130" y="250" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="46" font-weight="700" fill="#eff6ff">그린벨트 해제로</text>
  <text x="130" y="315" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="46" font-weight="700" fill="#bfdbfe">신규 택지 공급 확대</text>
  <text x="130" y="375" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" fill="#eff6ff" opacity="0.85">가까워진 내 집 마련의 기회일까</text>

  <rect x="130" y="120" width="140" height="42" rx="21" fill="url(#chipGrad)" opacity="0.9"/>
  <text x="200" y="147" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#0c2340">부동산정책</text>
</svg>
