<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="step1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="step2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="step3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="step4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="step5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1e1b4b" flood-opacity="0.2"/>
    </filter>
    <filter id="badgeShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e1b4b" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="46" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="25" font-weight="700" fill="#1e1b4b">AI 서비스 확산이 전력망 부담이 되기까지</text>
  <text x="400" y="70" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13.5" fill="#4338ca" opacity="0.85">이용 증가부터 인프라 대응까지 흐름 (예시)</text>

  <!-- connecting line -->
  <line x1="120" y1="112" x2="120" y2="500" stroke="#a5b4fc" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/>

  <!-- Step 1 -->
  <rect x="60" y="94" width="660" height="72" rx="18" fill="url(#step1)" filter="url(#cardShadow)"/>
  <circle cx="120" cy="130" r="24" fill="#ffffff" filter="url(#badgeShadow)"/>
  <text x="120" y="138" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#312e81">1</text>
  <text x="164" y="122" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#ffffff">AI 서비스 이용 증가</text>
  <text x="164" y="146" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#e0e7ff">챗봇·이미지 생성 서비스 이용자 급증</text>

  <!-- Step 2 -->
  <rect x="60" y="176" width="660" height="72" rx="18" fill="url(#step2)" filter="url(#cardShadow)"/>
  <circle cx="120" cy="212" r="24" fill="#ffffff" filter="url(#badgeShadow)"/>
  <text x="120" y="220" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#4338ca">2</text>
  <text x="164" y="204" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#ffffff">GPU 연산 부하 급증</text>
  <text x="164" y="228" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#e0e7ff">질문 하나에도 대규모 병렬 연산 필요</text>

  <!-- Step 3 -->
  <rect x="60" y="258" width="660" height="72" rx="18" fill="url(#step3)" filter="url(#cardShadow)"/>
  <circle cx="120" cy="294" r="24" fill="#ffffff" filter="url(#badgeShadow)"/>
  <text x="120" y="302" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#4f46e5">3</text>
  <text x="164" y="286" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#ffffff">데이터센터 전력 수요 급증</text>
  <text x="164" y="310" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#eef2ff">24시간 가동과 냉각 설비까지 함께 가동</text>

  <!-- Step 4 -->
  <rect x="60" y="340" width="660" height="72" rx="18" fill="url(#step4)" filter="url(#cardShadow)"/>
  <circle cx="120" cy="376" r="24" fill="#ffffff" filter="url(#badgeShadow)"/>
  <text x="120" y="384" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#0f766e">4</text>
  <text x="164" y="368" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#ffffff">전력망 부담 확대</text>
  <text x="164" y="392" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#f0fdfa">송배전망 용량 확충 필요성 대두</text>

  <!-- Step 5 -->
  <rect x="60" y="422" width="660" height="72" rx="18" fill="url(#step5)" filter="url(#cardShadow)"/>
  <circle cx="120" cy="458" r="24" fill="#ffffff" filter="url(#badgeShadow)"/>
  <text x="120" y="466" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#0d9488">5</text>
  <text x="164" y="450" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#052e2b">요금·인프라 대응 논의</text>
  <text x="164" y="474" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#f0fdfa">전용 요금제, 입지 분산 등 검토 (예시)</text>

  <rect x="60" y="516" width="680" height="62" rx="16" fill="#1e1b4b" opacity="0.07"/>
  <text x="400" y="542" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#1e1b4b">기술 발전 속도만큼 에너지 대응도 중요</text>
  <text x="400" y="562" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" fill="#4338ca">실제 수치·정책은 지역·시기에 따라 달라짐 (예시)</text>
</svg>
