<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="990" cy="150" r="270" fill="url(#glow1)"/>
  <circle cx="140" cy="500" r="260" fill="url(#glow2)"/>

  <!-- decorative coin / percent badge motif, right side -->
  <g opacity="0.95">
    <circle cx="985" cy="400" r="95" fill="url(#coinGrad)"/>
    <circle cx="985" cy="400" r="95" fill="none" stroke="#7c2d12" stroke-width="4" opacity="0.25"/>
    <text x="985" y="418" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="60" font-weight="800" fill="#7c2d12">%</text>
  </g>
  <g opacity="0.85">
    <circle cx="1095" cy="230" r="46" fill="url(#coinGrad)"/>
    <text x="1095" y="246" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="30" font-weight="800" fill="#7c2d12">₩</text>
  </g>
  <g opacity="0.7">
    <circle cx="880" cy="500" r="30" fill="url(#coinGrad)" opacity="0.85"/>
    <text x="880" y="510" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="800" fill="#7c2d12">₩</text>
  </g>
  <g opacity="0.65">
    <circle cx="150" cy="170" r="7" fill="#fde68a"/>
    <circle cx="180" cy="195" r="5" fill="#fef3c7"/>
    <circle cx="125" cy="205" r="4" fill="#fb923c"/>
    <line x1="150" y1="170" x2="180" y2="195" stroke="#fde68a" stroke-width="2"/>
    <line x1="150" y1="170" x2="125" y2="205" stroke="#fde68a" stroke-width="2"/>
  </g>

  <!-- small scattered icon -->
  <g opacity="0.4">
    <rect x="130" y="440" width="42" height="42" rx="11" fill="none" stroke="#fde68a" stroke-width="2.5"/>
    <circle cx="151" cy="461" r="8" fill="#fde68a"/>
  </g>

  <!-- text card -->
  <rect x="90" y="165" width="760" height="280" rx="28" fill="url(#cardGrad)"/>
  <text x="130" y="245" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="46" font-weight="700" fill="#fffbeb">스트레스 DSR</text>
  <text x="130" y="310" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="46" font-weight="700" fill="#fde68a">3단계 확대 적용</text>
  <text x="130" y="370" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" fill="#fffbeb" opacity="0.9">내 대출 한도는 얼마나 줄어들까</text>

  <rect x="130" y="110" width="110" height="42" rx="21" fill="url(#tagGrad)" opacity="0.95"/>
  <text x="185" y="137" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#7c2d12">대출</text>
</svg>
