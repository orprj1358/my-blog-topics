<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="colHeaderLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="colHeaderRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="rowLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="rowRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#312e81" flood-opacity="0.18"/>
    </filter>
    <filter id="badgeShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#312e81" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="46" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="25" font-weight="700" fill="#312e81">챗봇형 쇼핑 도우미 vs 에이전틱 커머스</text>
  <text x="400" y="70" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13.5" fill="#0d9488" opacity="0.85">기존 방식과 새로운 방식 비교 (예시)</text>

  <!-- Column headers -->
  <rect x="50" y="94" width="330" height="56" rx="16" fill="url(#colHeaderLeft)" filter="url(#cardShadow)"/>
  <text x="215" y="130" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#ffffff">챗봇형 쇼핑 도우미</text>

  <rect x="420" y="94" width="330" height="56" rx="16" fill="url(#colHeaderRight)" filter="url(#cardShadow)"/>
  <text x="585" y="130" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#ffffff">에이전틱 커머스</text>

  <!-- Row 1: 역할 -->
  <circle cx="70" cy="188" r="18" fill="url(#colHeaderLeft)" filter="url(#badgeShadow)"/>
  <text x="70" y="194" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">1</text>
  <rect x="50" y="168" width="330" height="72" rx="16" fill="url(#rowLeft)" filter="url(#cardShadow)"/>
  <text x="100" y="196" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#312e81">역할: 상품 추천에 머무름</text>
  <text x="100" y="220" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12.5" fill="#4338ca">최종 주문·결제는 사람이 직접 진행</text>

  <circle cx="440" cy="188" r="18" fill="url(#colHeaderRight)" filter="url(#badgeShadow)"/>
  <text x="440" y="194" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">1</text>
  <rect x="420" y="168" width="330" height="72" rx="16" fill="url(#rowRight)" filter="url(#cardShadow)"/>
  <text x="470" y="196" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#134e4a">역할: 주문·결제까지 수행</text>
  <text x="470" y="220" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12.5" fill="#0f766e">검색부터 결제까지 전 과정 자동 처리</text>

  <!-- Row 2: 처리 방식 -->
  <circle cx="70" cy="278" r="18" fill="url(#colHeaderLeft)" filter="url(#badgeShadow)"/>
  <text x="70" y="284" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">2</text>
  <rect x="50" y="258" width="330" height="72" rx="16" fill="url(#rowLeft)" filter="url(#cardShadow)"/>
  <text x="100" y="286" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#312e81">처리 방식: 단계마다 사람 확인</text>
  <text x="100" y="310" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12.5" fill="#4338ca">추천 확인 후 사람이 직접 클릭·결제</text>

  <circle cx="440" cy="278" r="18" fill="url(#colHeaderRight)" filter="url(#badgeShadow)"/>
  <text x="440" y="284" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">2</text>
  <rect x="420" y="258" width="330" height="72" rx="16" fill="url(#rowRight)" filter="url(#cardShadow)"/>
  <text x="470" y="286" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#134e4a">처리 방식: AI가 위임받아 자동 처리</text>
  <text x="470" y="310" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12.5" fill="#0f766e">설정된 조건 안에서 사람 개입 없이 진행 (예시)</text>

  <!-- Row 3: 필요한 안전장치 -->
  <circle cx="70" cy="368" r="18" fill="url(#colHeaderLeft)" filter="url(#badgeShadow)"/>
  <text x="70" y="374" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">3</text>
  <rect x="50" y="348" width="330" height="72" rx="16" fill="url(#rowLeft)" filter="url(#cardShadow)"/>
  <text x="100" y="376" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#312e81">안전장치: 단순 로그인 인증</text>
  <text x="100" y="400" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12.5" fill="#4338ca">결제 시점마다 본인이 직접 승인</text>

  <circle cx="440" cy="368" r="18" fill="url(#colHeaderRight)" filter="url(#badgeShadow)"/>
  <text x="440" y="374" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">3</text>
  <rect x="420" y="348" width="330" height="72" rx="16" fill="url(#rowRight)" filter="url(#cardShadow)"/>
  <text x="470" y="376" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#134e4a">안전장치: 결제 권한 위임·한도 인증</text>
  <text x="470" y="400" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12.5" fill="#0f766e">위임 범위·한도 설정과 이상거래 확인 필요 (예시)</text>

  <!-- arrow connecting columns -->
  <path d="M 385 260 L 415 260" stroke="#0d9488" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowHead)"/>
  <defs>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect x="50" y="440" width="700" height="70" rx="16" fill="#312e81" opacity="0.08"/>
  <text x="400" y="468" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#312e81">서비스 이용 전, AI 에이전트에게 위임할 권한과 한도를 스스로 정해두는 것이 중요</text>
  <text x="400" y="490" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" fill="#0f766e">실제 표준·서비스 형태는 카드사·플랫폼별로 달라짐 (예시)</text>
</svg>
