<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99f6e4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="cardIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99f6e4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1000" cy="140" r="270" fill="url(#glow1)"/>
  <circle cx="130" cy="510" r="260" fill="url(#glow2)"/>

  <!-- decorative network / chip motif, right side -->
  <g opacity="0.95">
    <rect x="905" y="330" width="150" height="150" rx="26" fill="url(#chipGrad)"/>
    <circle cx="980" cy="405" r="26" fill="#134e4a" opacity="0.85"/>
    <line x1="930" y1="360" x2="905" y2="330" stroke="#99f6e4" stroke-width="4"/>
    <line x1="1030" y1="360" x2="1055" y2="330" stroke="#99f6e4" stroke-width="4"/>
    <line x1="930" y1="450" x2="905" y2="480" stroke="#99f6e4" stroke-width="4"/>
    <line x1="1030" y1="450" x2="1055" y2="480" stroke="#99f6e4" stroke-width="4"/>
    <circle cx="905" cy="330" r="7" fill="#5eead4"/>
    <circle cx="1055" cy="330" r="7" fill="#5eead4"/>
    <circle cx="905" cy="480" r="7" fill="#5eead4"/>
    <circle cx="1055" cy="480" r="7" fill="#5eead4"/>
  </g>

  <!-- payment card icon -->
  <g opacity="0.9">
    <rect x="1000" y="150" width="110" height="72" rx="12" fill="url(#cardIconGrad)"/>
    <rect x="1000" y="172" width="110" height="16" fill="#312e81" opacity="0.6"/>
    <circle cx="1020" cy="205" r="6" fill="#312e81" opacity="0.6"/>
    <circle cx="1040" cy="205" r="6" fill="#312e81" opacity="0.4"/>
  </g>

  <!-- small scattered nodes -->
  <g opacity="0.6">
    <circle cx="150" cy="160" r="6" fill="#5eead4"/>
    <circle cx="185" cy="185" r="4.5" fill="#a5b4fc"/>
    <circle cx="120" cy="195" r="4" fill="#5eead4"/>
    <line x1="150" y1="160" x2="185" y2="185" stroke="#5eead4" stroke-width="2"/>
    <line x1="150" y1="160" x2="120" y2="195" stroke="#5eead4" stroke-width="2"/>
  </g>
  <g opacity="0.35">
    <rect x="130" y="435" width="42" height="42" rx="11" fill="none" stroke="#a5b4fc" stroke-width="2.5"/>
    <circle cx="151" cy="456" r="8" fill="#a5b4fc"/>
  </g>

  <!-- text card -->
  <rect x="90" y="155" width="780" height="300" rx="28" fill="url(#cardGrad)"/>
  <text x="130" y="235" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="44" font-weight="700" fill="#f0fdfa">AI가 대신 결제까지</text>
  <text x="130" y="300" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="44" font-weight="700" fill="#5eead4">'에이전틱 커머스' 확산</text>
  <text x="130" y="360" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="21" fill="#e0e7ff" opacity="0.9">챗봇을 넘어 주문·결제까지 대신하는 AI</text>

  <rect x="130" y="100" width="90" height="42" rx="21" fill="url(#tagGrad)" opacity="0.95"/>
  <text x="175" y="127" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#134e4a">AI</text>
</svg>
