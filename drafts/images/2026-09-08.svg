<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99f6e4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99f6e4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1000" cy="150" r="270" fill="url(#glow1)"/>
  <circle cx="130" cy="510" r="260" fill="url(#glow2)"/>

  <!-- shield + check icon representing regulation / compliance -->
  <g opacity="0.95">
    <path d="M980 150 L1060 175 L1060 235 C1060 280 1025 310 980 325 C935 310 900 280 900 235 L900 175 Z" fill="url(#shieldGrad)"/>
    <path d="M945 235 L970 260 L1015 205" stroke="#134e4a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- small chip / network motif -->
  <g opacity="0.85">
    <rect x="945" y="360" width="72" height="72" rx="16" fill="url(#chipGrad)"/>
    <circle cx="981" cy="396" r="14" fill="#312e81" opacity="0.75"/>
    <line x1="945" y1="380" x2="920" y2="365" stroke="#a5b4fc" stroke-width="3"/>
    <line x1="945" y1="415" x2="920" y2="430" stroke="#a5b4fc" stroke-width="3"/>
    <line x1="1017" y1="380" x2="1042" y2="365" stroke="#a5b4fc" stroke-width="3"/>
    <line x1="1017" y1="415" x2="1042" y2="430" stroke="#a5b4fc" stroke-width="3"/>
    <circle cx="920" cy="365" r="5" fill="#5eead4"/>
    <circle cx="920" cy="430" r="5" fill="#5eead4"/>
    <circle cx="1042" cy="365" r="5" fill="#5eead4"/>
    <circle cx="1042" cy="430" r="5" fill="#5eead4"/>
  </g>

  <!-- small scattered nodes -->
  <g opacity="0.6">
    <circle cx="150" cy="160" r="6" fill="#5eead4"/>
    <circle cx="185" cy="185" r="4.5" fill="#a5b4fc"/>
    <circle cx="120" cy="195" r="4" fill="#5eead4"/>
    <line x1="150" y1="160" x2="185" y2="185" stroke="#5eead4" stroke-width="2"/>
    <line x1="150" y1="160" x2="120" y2="195" stroke="#5eead4" stroke-width="2"/>
  </g>
  <g opacity="0.35">
    <rect x="130" y="435" width="42" height="42" rx="11" fill="none" stroke="#a5b4fc" stroke-width="2.5"/>
    <circle cx="151" cy="456" r="8" fill="#a5b4fc"/>
  </g>

  <!-- text card -->
  <rect x="90" y="155" width="780" height="300" rx="28" fill="url(#cardGrad)"/>
  <text x="130" y="235" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="44" font-weight="700" fill="#f0fdfa">AI 기본법 시행</text>
  <text x="130" y="300" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="40" font-weight="700" fill="#5eead4">'고영향 AI', 지금부터 준비</text>
  <text x="130" y="360" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="21" fill="#e0e7ff" opacity="0.9">사업자가 챙겨야 할 의무와 체크리스트</text>

  <rect x="130" y="100" width="90" height="42" rx="21" fill="url(#tagGrad)" opacity="0.95"/>
  <text x="175" y="127" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#134e4a">AI</text>
</svg>
