<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="leftHeadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="rightHeadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="leftRowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="rightRowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff0e0"/>
    </linearGradient>
    <linearGradient id="leftBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="rightBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7c2d12" flood-opacity="0.18"/>
    </filter>
    <filter id="badgeShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7c2d12" flood-opacity="0.2"/>
    </filter>
    <marker id="arrowHead2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect width="800" height="640" fill="url(#pageBg)"/>

  <text x="400" y="46" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#7c2d12">대출 규제, 무엇이 달라지나</text>
  <text x="400" y="70" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13.5" fill="#c2410c" opacity="0.85">기존 방식 대비 강화되는 흐름 (예시)</text>

  <!-- Left column header -->
  <rect x="56" y="96" width="300" height="56" rx="16" fill="url(#leftHeadGrad)" filter="url(#cardShadow)"/>
  <text x="206" y="131" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" font-weight="700" fill="#1e293b">기존 대출 조건</text>

  <!-- Right column header -->
  <rect x="444" y="96" width="300" height="56" rx="16" fill="url(#rightHeadGrad)" filter="url(#cardShadow)"/>
  <text x="594" y="131" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" font-weight="700" fill="#fff7ed">강화되는 흐름</text>

  <!-- connecting arrow -->
  <path d="M 362 124 L 438 124" stroke="#c2410c" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowHead2)"/>

  <!-- Row 1 -->
  <rect x="56" y="172" width="300" height="112" rx="16" fill="url(#leftRowGrad)" filter="url(#cardShadow)"/>
  <circle cx="96" cy="200" r="22" fill="url(#leftBadgeGrad)" filter="url(#badgeShadow)"/>
  <text x="96" y="207" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#ffffff">1</text>
  <text x="128" y="196" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#334155">DSR 계산 방식</text>
  <text x="76" y="224" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12.5" fill="#475569">현재 금리 기준으로 상환 능력 평가</text>
  <text x="76" y="246" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12.5" fill="#475569">대출 가능 금액 산정이 상대적으로</text>
  <text x="76" y="266" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12.5" fill="#475569">여유로운 편</text>

  <rect x="444" y="172" width="300" height="112" rx="16" fill="url(#rightRowGrad)" filter="url(#cardShadow)"/>
  <circle cx="484" cy="200" r="22" fill="url(#rightBadgeGrad)" filter="url(#badgeShadow)"/>
  <text x="484" y="207" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#ffffff">1</text>
  <text x="516" y="196" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#7c2d12">스트레스 금리 반영</text>
  <text x="464" y="224" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12.5" fill="#9a3412">미래 금리 상승 가능성을 가산해</text>
  <text x="464" y="246" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12.5" fill="#9a3412">상환 능력을 더 보수적으로 평가,</text>
  <text x="464" y="266" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12.5" fill="#9a3412">한도가 줄어드는 경향</text>

  <!-- Row 2 -->
  <rect x="56" y="300" width="300" height="112" rx="16" fill="url(#leftRowGrad)" filter="url(#cardShadow)"/>
  <circle cx="96" cy="328" r="22" fill="url(#leftBadgeGrad)" filter="url(#badgeShadow)"/>
  <text x="96" y="335" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#ffffff">2</text>
  <text x="128" y="324" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#334155">은행 자본 적립 기준</text>
  <text x="76" y="352" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12.5" fill="#475569">주담대 위험가중치가 상대적으로</text>
  <text x="76" y="374" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12.5" fill="#475569">낮게 적용되던 구조</text>

  <rect x="444" y="300" width="300" height="112" rx="16" fill="url(#rightRowGrad)" filter="url(#cardShadow)"/>
  <circle cx="484" cy="328" r="22" fill="url(#rightBadgeGrad)" filter="url(#badgeShadow)"/>
  <text x="484" y="335" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#ffffff">2</text>
  <text x="516" y="324" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#7c2d12">위험가중치 상향</text>
  <text x="464" y="352" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12.5" fill="#9a3412">은행이 쌓아야 할 자본 비율이 늘어</text>
  <text x="464" y="374" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12.5" fill="#9a3412">전반적인 대출 여력이 축소</text>

  <!-- Row 3 -->
  <rect x="56" y="428" width="300" height="112" rx="16" fill="url(#leftRowGrad)" filter="url(#cardShadow)"/>
  <circle cx="96" cy="456" r="22" fill="url(#leftBadgeGrad)" filter="url(#badgeShadow)"/>
  <text x="96" y="463" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#ffffff">3</text>
  <text x="128" y="452" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#334155">실수요자 준비 방식</text>
  <text x="76" y="480" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12.5" fill="#475569">과거 기준으로 자금 계획을 세워도</text>
  <text x="76" y="502" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12.5" fill="#475569">큰 무리가 없었던 편</text>

  <rect x="444" y="428" width="300" height="112" rx="16" fill="url(#rightRowGrad)" filter="url(#cardShadow)"/>
  <circle cx="484" cy="456" r="22" fill="url(#rightBadgeGrad)" filter="url(#badgeShadow)"/>
  <text x="484" y="463" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#ffffff">3</text>
  <text x="516" y="452" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#7c2d12">보수적 재계산 필요</text>
  <text x="464" y="480" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12.5" fill="#9a3412">최신 공고 확인, 여유 자금 확보 등</text>
  <text x="464" y="502" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12.5" fill="#9a3412">자금 계획 재점검이 중요</text>

  <rect x="56" y="566" width="688" height="50" rx="16" fill="#7c2d12" opacity="0.08"/>
  <text x="400" y="596" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13.5" fill="#7c2d12" opacity="0.9">구체적 수치·기준은 정책 발표에 따라 달라질 수 있음 (예시)</text>
</svg>
