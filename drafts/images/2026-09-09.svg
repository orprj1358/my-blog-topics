<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1000" cy="150" r="270" fill="url(#glow1)"/>
  <circle cx="130" cy="510" r="260" fill="url(#glow2)"/>

  <!-- coin with percent badge representing loan/interest -->
  <g opacity="0.95">
    <circle cx="985" cy="230" r="78" fill="url(#coinGrad)"/>
    <circle cx="985" cy="230" r="60" fill="none" stroke="#b45309" stroke-width="4" opacity="0.6"/>
    <text x="985" y="248" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="52" font-weight="700" fill="#7c2d12">%</text>
  </g>

  <!-- simple house silhouette -->
  <g opacity="0.9">
    <path d="M945 405 L985 372 L1025 405 L1025 452 L945 452 Z" fill="url(#houseGrad)"/>
    <rect x="972" y="418" width="26" height="34" rx="3" fill="#7c2d12" opacity="0.55"/>
  </g>

  <!-- small scattered nodes -->
  <g opacity="0.6">
    <circle cx="150" cy="160" r="6" fill="#fde68a"/>
    <circle cx="185" cy="185" r="4.5" fill="#fb923c"/>
    <circle cx="120" cy="195" r="4" fill="#fde68a"/>
    <line x1="150" y1="160" x2="185" y2="185" stroke="#fde68a" stroke-width="2"/>
    <line x1="150" y1="160" x2="120" y2="195" stroke="#fde68a" stroke-width="2"/>
  </g>
  <g opacity="0.35">
    <rect x="130" y="435" width="42" height="42" rx="11" fill="none" stroke="#fb923c" stroke-width="2.5"/>
    <circle cx="151" cy="456" r="8" fill="#fb923c"/>
  </g>

  <!-- text card -->
  <rect x="90" y="155" width="800" height="300" rx="28" fill="url(#cardGrad)"/>
  <text x="130" y="235" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="44" font-weight="700" fill="#fffbeb">달라지는 대출 규제</text>
  <text x="130" y="300" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="38" font-weight="700" fill="#fde68a">내 집 마련 계획, 다시 점검할 때</text>
  <text x="130" y="360" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="21" fill="#ffedd5" opacity="0.9">DSR·LTV 강화 흐름 속 실수요자 체크포인트</text>

  <rect x="130" y="100" width="90" height="42" rx="21" fill="url(#tagGrad)" opacity="0.95"/>
  <text x="175" y="127" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#7c2d12">대출</text>
</svg>
