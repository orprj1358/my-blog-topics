<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1e3e"/>
      <stop offset="50%" stop-color="#1e3a6e"/>
      <stop offset="100%" stop-color="#3b6bb0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bfe0ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#bfe0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7db8f0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7db8f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7d3ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfe0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde9c8"/>
      <stop offset="100%" stop-color="#f0b95e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1010" cy="150" r="270" fill="url(#glow1)"/>
  <circle cx="130" cy="510" r="260" fill="url(#glow2)"/>

  <!-- house silhouette -->
  <g opacity="0.95">
    <polygon points="985,225 900,290 1070,290" fill="url(#houseGrad)"/>
    <rect x="915" y="290" width="140" height="150" rx="8" fill="url(#houseGrad)" opacity="0.92"/>
    <rect x="965" y="345" width="40" height="95" rx="4" fill="#1e3a6e" opacity="0.55"/>
    <rect x="932" y="315" width="22" height="22" rx="3" fill="#1e3a6e" opacity="0.5"/>
    <rect x="1000" y="315" width="22" height="22" rx="3" fill="#1e3a6e" opacity="0.5"/>
  </g>

  <!-- checklist badge, representing policy checklist -->
  <g opacity="0.95">
    <rect x="965" y="470" width="80" height="100" rx="14" fill="url(#badgeGrad)"/>
    <rect x="980" y="454" width="50" height="24" rx="6" fill="#a7d3ff"/>
    <path d="M 980 500 l 10 10 l 20 -22" stroke="#0c1e3e" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 980 530 l 10 10 l 20 -22" stroke="#0c1e3e" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- autumn leaf accents -->
  <g opacity="0.6">
    <path d="M 140 150 Q 160 130 180 150 Q 160 175 140 150 Z" fill="url(#leafGrad)"/>
    <path d="M 190 180 Q 205 165 220 180 Q 205 200 190 180 Z" fill="url(#leafGrad)" opacity="0.8"/>
  </g>
  <g opacity="0.3">
    <rect x="130" y="435" width="42" height="42" rx="11" fill="none" stroke="#7db8f0" stroke-width="2.5"/>
    <circle cx="151" cy="456" r="8" fill="#7db8f0"/>
  </g>

  <!-- text card -->
  <rect x="90" y="150" width="800" height="300" rx="28" fill="url(#cardGrad)"/>
  <text x="130" y="230" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="44" font-weight="700" fill="#f0f7ff">가을 이사철 앞두고</text>
  <text x="130" y="295" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="38" font-weight="700" fill="#bfe0ff">부동산 정책 체크리스트</text>
  <text x="130" y="355" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="21" fill="#e0edff" opacity="0.9">계약 전에 꼭 짚어봐야 할 것들</text>

  <rect x="130" y="95" width="120" height="42" rx="21" fill="url(#tagGrad)" opacity="0.95"/>
  <text x="190" y="122" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#0c1e3e">부동산정책</text>
</svg>
