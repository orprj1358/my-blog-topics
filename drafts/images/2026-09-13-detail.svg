<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="pagebg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="colA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="colB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99f6e4"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="badgeA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="badgeB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1e1b4b" flood-opacity="0.18"/>
    </filter>
    <filter id="badgeShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e1b4b" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pagebg)"/>

  <text x="400" y="52" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="28" font-weight="700" fill="#312e81">챗봇 vs AI 에이전트, 무엇이 다를까</text>

  <!-- Column headers -->
  <rect x="60" y="86" width="310" height="46" rx="23" fill="url(#colA)" filter="url(#cardShadow)"/>
  <text x="215" y="115" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#312e81">챗봇</text>

  <rect x="430" y="86" width="310" height="46" rx="23" fill="url(#colB)" filter="url(#cardShadow)"/>
  <text x="585" y="115" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#134e4a">AI 에이전트</text>

  <!-- Chatbot column steps -->
  <g font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
    <rect x="60" y="156" width="310" height="76" rx="18" fill="#ffffff" filter="url(#cardShadow)"/>
    <circle cx="98" cy="194" r="18" fill="url(#badgeA)" filter="url(#badgeShadow)"/>
    <text x="98" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text>
    <text x="128" y="188" font-size="16" font-weight="700" fill="#312e81">질문 입력</text>
    <text x="128" y="212" font-size="13" fill="#4c4a75">사용자가 궁금한 점을 직접 물어봄</text>

    <rect x="60" y="248" width="310" height="76" rx="18" fill="#ffffff" filter="url(#cardShadow)"/>
    <circle cx="98" cy="286" r="18" fill="url(#badgeA)" filter="url(#badgeShadow)"/>
    <text x="98" y="292" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text>
    <text x="128" y="280" font-size="16" font-weight="700" fill="#312e81">답변 생성</text>
    <text x="128" y="304" font-size="13" fill="#4c4a75">텍스트 형태로 답변을 만들어 제시</text>

    <rect x="60" y="340" width="310" height="76" rx="18" fill="#ffffff" filter="url(#cardShadow)"/>
    <circle cx="98" cy="378" r="18" fill="url(#badgeA)" filter="url(#badgeShadow)"/>
    <text x="98" y="384" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3</text>
    <text x="128" y="372" font-size="16" font-weight="700" fill="#312e81">사람이 실행</text>
    <text x="128" y="396" font-size="13" fill="#4c4a75">답변을 참고해 이후 작업은 사람이 처리</text>
  </g>

  <!-- Agent column steps -->
  <g font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
    <rect x="430" y="156" width="310" height="76" rx="18" fill="#ffffff" filter="url(#cardShadow)"/>
    <circle cx="468" cy="194" r="18" fill="url(#badgeB)" filter="url(#badgeShadow)"/>
    <text x="468" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text>
    <text x="498" y="188" font-size="16" font-weight="700" fill="#134e4a">목표 전달</text>
    <text x="498" y="212" font-size="13" fill="#0f4c47">원하는 결과만 큰 틀에서 지시</text>

    <rect x="430" y="248" width="310" height="76" rx="18" fill="#ffffff" filter="url(#cardShadow)"/>
    <circle cx="468" cy="286" r="18" fill="url(#badgeB)" filter="url(#badgeShadow)"/>
    <text x="468" y="292" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text>
    <text x="498" y="280" font-size="16" font-weight="700" fill="#134e4a">계획·실행</text>
    <text x="498" y="304" font-size="13" fill="#0f4c47">필요한 정보 탐색과 도구 연결까지 스스로 처리</text>

    <rect x="430" y="340" width="310" height="76" rx="18" fill="#ffffff" filter="url(#cardShadow)"/>
    <circle cx="468" cy="378" r="18" fill="url(#badgeB)" filter="url(#badgeShadow)"/>
    <text x="468" y="384" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3</text>
    <text x="498" y="372" font-size="16" font-weight="700" fill="#134e4a">결과물 전달</text>
    <text x="498" y="396" font-size="13" fill="#0f4c47">완료된 작업 결과까지 정리해 제공</text>
  </g>

  <!-- bottom note card -->
  <rect x="60" y="446" width="680" height="108" rx="20" fill="#ffffff" filter="url(#cardShadow)"/>
  <circle cx="100" cy="500" r="20" fill="url(#badgeA)" filter="url(#badgeShadow)"/>
  <text x="100" y="507" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" font-weight="700" fill="#ffffff">!</text>
  <text x="134" y="486" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#312e81">핵심 차이는 '실행력'</text>
  <text x="134" y="510" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#4c4a75">에이전트는 정보 탐색부터 실제 작업 처리까지 이어서 수행할 수 있어</text>
  <text x="134" y="530" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#4c4a75">권한 설정과 결과 검토 기준을 함께 마련하는 것이 중요합니다.</text>
</svg>
