<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" width="800" height="680">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e2"/>
      <stop offset="100%" stop-color="#ffe4c2"/>
    </linearGradient>
    <linearGradient id="cardGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff6ea"/>
    </linearGradient>
    <linearGradient id="cardGradR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#ffe9cc"/>
    </linearGradient>
    <linearGradient id="badgeGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a9c9ff"/>
      <stop offset="100%" stop-color="#3b6fc9"/>
    </linearGradient>
    <linearGradient id="badgeGradR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb98a"/>
      <stop offset="100%" stop-color="#d9601a"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7a3c10" flood-opacity="0.2"/>
    </filter>
    <filter id="badgeShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7a3c10" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="800" height="680" fill="url(#pageBg)"/>

  <text x="400" y="46" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#7a3c10">1금융권 vs 2금융권, 대출 풍선효과 흐름</text>
  <text x="400" y="70" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13.5" fill="#b45f18" opacity="0.9">규제 강화에 따른 대출 수요 이동 (예시)</text>

  <!-- column headers -->
  <rect x="70" y="96" width="300" height="46" rx="14" fill="url(#badgeGradL)" filter="url(#cardShadow)"/>
  <text x="220" y="125" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#ffffff">1금융권 (은행)</text>

  <rect x="430" y="96" width="300" height="46" rx="14" fill="url(#badgeGradR)" filter="url(#cardShadow)"/>
  <text x="580" y="125" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#ffffff">2금융권 (저축은행 등)</text>

  <!-- shift arrow -->
  <g opacity="0.85">
    <path d="M372 119 L428 119" stroke="#c9701f" stroke-width="3" stroke-dasharray="4 4" fill="none" marker-end="url(#arrowhead)"/>
  </g>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#c9701f"/>
    </marker>
  </defs>

  <!-- Row 1: 금리 -->
  <circle cx="45" cy="188" r="20" fill="url(#badgeGradL)" filter="url(#badgeShadow)"/>
  <text x="45" y="194" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">1</text>
  <rect x="70" y="164" width="300" height="72" rx="16" fill="url(#cardGradL)" filter="url(#cardShadow)"/>
  <text x="90" y="192" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#2a4d8a">금리 수준</text>
  <text x="90" y="215" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#5a5a5a">상대적으로 낮고 안정적</text>

  <rect x="430" y="164" width="300" height="72" rx="16" fill="url(#cardGradR)" filter="url(#cardShadow)"/>
  <text x="450" y="192" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#a1450f">금리 수준</text>
  <text x="450" y="215" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#5a5a5a">은행 대비 높게 형성</text>

  <!-- Row 2: 심사 -->
  <circle cx="45" cy="280" r="20" fill="url(#badgeGradL)" filter="url(#badgeShadow)"/>
  <text x="45" y="286" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">2</text>
  <rect x="70" y="256" width="300" height="72" rx="16" fill="url(#cardGradL)" filter="url(#cardShadow)"/>
  <text x="90" y="284" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#2a4d8a">심사 기준</text>
  <text x="90" y="307" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#5a5a5a">규제 강화로 보수적 산정</text>

  <rect x="430" y="256" width="300" height="72" rx="16" fill="url(#cardGradR)" filter="url(#cardShadow)"/>
  <text x="450" y="284" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#a1450f">심사 기준</text>
  <text x="450" y="307" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#5a5a5a">상대적으로 유연한 편</text>

  <!-- Row 3: 최근 흐름 -->
  <circle cx="45" cy="372" r="20" fill="url(#badgeGradL)" filter="url(#badgeShadow)"/>
  <text x="45" y="378" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">3</text>
  <rect x="70" y="348" width="300" height="72" rx="16" fill="url(#cardGradL)" filter="url(#cardShadow)"/>
  <text x="90" y="376" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#2a4d8a">최근 흐름</text>
  <text x="90" y="399" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#5a5a5a">한도·문턱 계속 높아지는 중</text>

  <rect x="430" y="348" width="300" height="72" rx="16" fill="url(#cardGradR)" filter="url(#cardShadow)"/>
  <text x="450" y="376" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#a1450f">최근 흐름</text>
  <text x="450" y="399" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#5a5a5a">수요 유입에 규제도 강화 검토</text>

  <!-- Row 4: 실수요자 체크 -->
  <circle cx="45" cy="464" r="20" fill="url(#badgeGradR)" filter="url(#badgeShadow)"/>
  <text x="45" y="470" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">✓</text>
  <rect x="70" y="440" width="660" height="96" rx="16" fill="url(#cardGradR)" filter="url(#cardShadow)"/>
  <text x="94" y="470" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#a1450f">실수요자가 챙길 점</text>
  <text x="94" y="494" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#5a5a5a">표면 금리 외 중도상환수수료·연체 조건까지 비교하고,</text>
  <text x="94" y="514" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#5a5a5a">정책금융·대환대출 등 다른 선택지를 먼저 확인하기</text>

  <rect x="70" y="564" width="660" height="34" rx="12" fill="#7a3c10" opacity="0.08"/>
  <text x="400" y="586" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12.5" fill="#7a3c10" opacity="0.9">구체적 금리·한도는 금융사·시점에 따라 다를 수 있음 (예시)</text>

  <text x="400" y="636" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" fill="#b45f18" opacity="0.8">실제 조건은 반드시 해당 금융사 공식 채널에서 확인하세요</text>
</svg>
