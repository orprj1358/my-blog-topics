<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a1c0a"/>
      <stop offset="50%" stop-color="#7a3c10"/>
      <stop offset="100%" stop-color="#c9701f"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe3b0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffe3b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8a5c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff8a5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe8bf"/>
      <stop offset="100%" stop-color="#f5a53c"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd699"/>
      <stop offset="100%" stop-color="#e8891f"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe3b0"/>
      <stop offset="100%" stop-color="#f5a53c"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="630" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="630" fill="url(#bg)"/>
    <circle cx="1010" cy="150" r="270" fill="url(#glow1)"/>
    <circle cx="150" cy="520" r="260" fill="url(#glow2)"/>

    <!-- shield with checkmark: protection motif -->
    <g opacity="0.95">
      <path d="M1000 200 L1070 220 L1070 290 Q1070 350 1000 380 Q930 350 930 290 L930 220 Z" fill="url(#shieldGrad)"/>
      <path d="M972 292 L992 312 L1030 262" stroke="#7a3c10" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- phone with alert badge -->
    <g opacity="0.92">
      <rect x="1080" y="380" width="72" height="128" rx="18" fill="url(#phoneGrad)"/>
      <rect x="1092" y="398" width="48" height="86" rx="4" fill="#5a2c0a" opacity="0.25"/>
      <circle cx="1116" cy="494" r="5" fill="#5a2c0a" opacity="0.5"/>
      <circle cx="1140" cy="386" r="17" fill="#c9701f"/>
      <text x="1140" y="393" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#fff4e2">!</text>
    </g>

    <!-- small deco squares -->
    <g opacity="0.32">
      <rect x="130" y="150" width="42" height="42" rx="11" fill="none" stroke="#ffb35c" stroke-width="2.5"/>
      <circle cx="151" cy="171" r="8" fill="#ffb35c"/>
    </g>

    <!-- text card -->
    <rect x="90" y="150" width="820" height="320" rx="28" fill="url(#cardGrad)"/>
    <text x="130" y="235" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="42" font-weight="700" fill="#fff4e2">대출빙자형 보이스피싱 급증</text>
    <text x="130" y="300" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="38" font-weight="700" fill="#ffd699">이렇게 확인하면 안전합니다</text>
    <text x="130" y="360" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="21" fill="#ffe8cf" opacity="0.9">금융당국 대응 동향과 실수요자 예방 체크포인트</text>

    <rect x="130" y="95" width="80" height="42" rx="21" fill="url(#tagGrad)" opacity="0.95"/>
    <text x="170" y="122" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#5a2c0a">대출</text>
  </g>
</svg>
