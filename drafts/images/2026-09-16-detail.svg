<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eafff9"/>
      <stop offset="100%" stop-color="#e6f2ff"/>
    </linearGradient>
    <linearGradient id="leftHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="rightHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="rowCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3f8fc"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="barLow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="barHigh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0f6e6a"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f3a4a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="46" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="26" font-weight="700" fill="#0f3a4a">기존 데이터센터 vs AI 데이터센터</text>
  <text x="400" y="74" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#3b6b78">전력을 쓰는 방식이 근본적으로 달라졌다 (그림 속 수치는 예시)</text>

  <!-- column headers -->
  <rect x="60" y="100" width="310" height="64" rx="18" fill="url(#leftHeader)" filter="url(#cardShadow)"/>
  <circle cx="102" cy="132" r="20" fill="#ffffff" opacity="0.85"/>
  <text x="102" y="139" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#475569">🖥</text>
  <text x="230" y="139" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#ffffff">기존 데이터센터</text>

  <rect x="430" y="100" width="310" height="64" rx="18" fill="url(#rightHeader)" filter="url(#cardShadow)"/>
  <circle cx="472" cy="132" r="20" fill="#ffffff" opacity="0.85"/>
  <text x="472" y="139" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#0f6e6a">⚡</text>
  <text x="600" y="139" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#0a1a2e">AI 데이터센터</text>

  <!-- row 1: 랙당 전력밀도 -->
  <circle cx="30" cy="212" r="15" fill="url(#badgeGrad)"/>
  <text x="30" y="217" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="55" y="217" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#0f3a4a">랙당 전력밀도</text>

  <rect x="60" y="230" width="310" height="50" rx="14" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <rect x="80" y="248" width="90" height="14" rx="7" fill="url(#barLow)"/>
  <text x="185" y="260" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#475569">낮음·저장 위주</text>

  <rect x="430" y="230" width="310" height="50" rx="14" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <rect x="450" y="248" width="220" height="14" rx="7" fill="url(#barHigh)"/>
  <text x="555" y="260" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#0f6e6a">높음·GPU 밀집</text>

  <!-- row 2: 가동 방식 -->
  <circle cx="30" cy="322" r="15" fill="url(#badgeGrad)"/>
  <text x="30" y="327" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text x="55" y="327" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#0f3a4a">가동 방식</text>

  <rect x="60" y="340" width="310" height="50" rx="14" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="90" y="370" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#475569">간헐적 조회·트래픽 대응</text>

  <rect x="430" y="340" width="310" height="50" rx="14" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="460" y="370" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#0f6e6a">GPU 랙 상시 고부하 가동</text>

  <!-- row 3: 냉각 부담 -->
  <circle cx="30" cy="432" r="15" fill="url(#badgeGrad)"/>
  <text x="30" y="437" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <text x="55" y="437" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#0f3a4a">냉각 부담</text>

  <rect x="60" y="450" width="310" height="50" rx="14" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="90" y="480" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#475569">공조 중심, 비교적 낮음</text>

  <rect x="430" y="450" width="310" height="50" rx="14" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="460" y="480" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#0f6e6a">액침냉각 등 추가 설비 필요</text>

  <!-- row 4: 지역 전력망 영향 -->
  <circle cx="30" cy="542" r="15" fill="url(#badgeGrad)"/>
  <text x="30" y="547" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">4</text>
  <text x="55" y="547" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#0f3a4a">전력망 영향</text>

  <rect x="60" y="560" width="310" height="30" rx="14" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="90" y="580" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#475569">기존 배전 용량 내 대응 가능</text>

  <rect x="430" y="560" width="310" height="30" rx="14" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="460" y="580" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#0f6e6a">변전소·송전선 증설 논의 필요</text>
</svg>
