<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef7fb"/>
      <stop offset="100%" stop-color="#e8f6f2"/>
    </linearGradient>
    <linearGradient id="leftHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="rightHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="rowCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef9f7"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#0f6e6a"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#123b4f" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="46" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="26" font-weight="700" fill="#123b4f">챗봇 vs AI 에이전트</text>
  <text x="400" y="74" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#3a7a72">한 번의 대화냐, 스스로 이어가는 여러 단계냐 (예시 구성)</text>

  <!-- column headers -->
  <rect x="60" y="100" width="310" height="64" rx="18" fill="url(#leftHeader)" filter="url(#cardShadow)"/>
  <circle cx="102" cy="132" r="20" fill="#ffffff" opacity="0.85"/>
  <text x="102" y="139" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#475569">○</text>
  <text x="230" y="139" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#ffffff">챗봇</text>

  <rect x="430" y="100" width="310" height="64" rx="18" fill="url(#rightHeader)" filter="url(#cardShadow)"/>
  <circle cx="472" cy="132" r="20" fill="#ffffff" opacity="0.85"/>
  <text x="472" y="139" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#0a1a2e">●</text>
  <text x="600" y="139" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#0a1a2e">AI 에이전트</text>

  <!-- row 1: 처리 방식 -->
  <circle cx="30" cy="212" r="15" fill="url(#badgeGrad)"/>
  <text x="30" y="217" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="55" y="217" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#123b4f">처리 방식</text>

  <rect x="60" y="230" width="310" height="50" rx="14" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="215" y="260" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#475569">질문 하나에 답 하나</text>

  <rect x="430" y="230" width="310" height="50" rx="14" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="585" y="260" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#0f6e6a">목표를 받아 여러 단계 자동 수행</text>

  <!-- row 2: 작업 범위 -->
  <circle cx="30" cy="322" r="15" fill="url(#badgeGrad)"/>
  <text x="30" y="327" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text x="55" y="327" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#123b4f">작업 범위</text>

  <rect x="60" y="340" width="310" height="50" rx="14" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="215" y="370" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#475569">대화 안에서 정보 제공</text>

  <rect x="430" y="340" width="310" height="50" rx="14" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="585" y="370" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#0f6e6a">탐색·정리·실행까지 이어감</text>

  <!-- row 3: 사람의 역할 -->
  <circle cx="30" cy="432" r="15" fill="url(#badgeGrad)"/>
  <text x="30" y="437" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <text x="55" y="437" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#123b4f">사람의 역할</text>

  <rect x="60" y="450" width="310" height="50" rx="14" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="215" y="480" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#475569">매 단계 직접 지시</text>

  <rect x="430" y="450" width="310" height="50" rx="14" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="585" y="480" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#0f6e6a">목표 설정과 최종 확인에 집중</text>

  <!-- row 4: 활용 예시 -->
  <circle cx="30" cy="542" r="15" fill="url(#badgeGrad)"/>
  <text x="30" y="547" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">4</text>
  <text x="55" y="547" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#123b4f">활용 예시</text>

  <rect x="60" y="560" width="310" height="30" rx="14" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="215" y="580" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#475569">궁금한 점 바로 묻고 답 얻기</text>

  <rect x="430" y="560" width="310" height="30" rx="14" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="585" y="580" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#0f6e6a">이메일 정리 등 반복 업무 위임</text>
</svg>
