<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a2e"/>
      <stop offset="50%" stop-color="#123b4f"/>
      <stop offset="100%" stop-color="#0f6e6a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="630" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="630" fill="url(#bg)"/>
    <circle cx="1010" cy="150" r="270" fill="url(#glow1)"/>
    <circle cx="150" cy="520" r="260" fill="url(#glow2)"/>

    <!-- agent flow: chip hub connected to step nodes -->
    <g opacity="0.95">
      <rect x="985" y="230" width="100" height="100" rx="18" fill="url(#chipGrad)"/>
      <rect x="1007" y="252" width="56" height="56" rx="8" fill="#0a1a2e" opacity="0.35"/>
    </g>
    <g opacity="0.9" stroke="#a7f3d0" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M1035 230 C 1035 195, 995 190, 970 170"/>
      <path d="M985 280 C 940 280, 935 300, 905 315"/>
      <path d="M1035 330 C 1035 370, 1000 380, 975 400"/>
    </g>
    <circle cx="960" cy="160" r="20" fill="url(#nodeGrad)"/>
    <circle cx="892" cy="320" r="20" fill="url(#nodeGrad)"/>
    <circle cx="962" cy="410" r="20" fill="url(#nodeGrad)"/>

    <!-- small deco squares -->
    <g opacity="0.32">
      <rect x="130" y="150" width="42" height="42" rx="11" fill="none" stroke="#5eead4" stroke-width="2.5"/>
      <circle cx="151" cy="171" r="8" fill="#5eead4"/>
    </g>

    <!-- text card -->
    <rect x="90" y="150" width="830" height="330" rx="28" fill="url(#cardGrad)"/>
    <text x="130" y="235" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="42" font-weight="700" fill="#e6fffa">챗봇에서 에이전트로</text>
    <text x="130" y="295" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="36" font-weight="700" fill="#a5b4fc">AI 사용법이 달라지고 있다</text>
    <text x="130" y="350" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="21" fill="#cffafe" opacity="0.9">대화형 AI를 넘어, 스스로 일하는 AI로</text>

    <rect x="130" y="95" width="96" height="42" rx="21" fill="url(#tagGrad)" opacity="0.95"/>
    <text x="178" y="122" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#0a1a2e">AI 소식</text>
  </g>
</svg>
