<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fef3e2"/>
    </linearGradient>
    <linearGradient id="leftHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="rightHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="rowCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef6ec"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7c3f0a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="46" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="26" font-weight="700" fill="#7c3f0a">변동금리 vs 고정금리</text>
  <text x="400" y="74" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#b45309">스트레스 DSR 적용 시 한도 차이 (예시 구성)</text>

  <!-- column headers -->
  <rect x="60" y="100" width="310" height="64" rx="18" fill="url(#leftHeader)" filter="url(#cardShadow)"/>
  <circle cx="102" cy="132" r="20" fill="#ffffff" opacity="0.85"/>
  <text x="102" y="139" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#475569">○</text>
  <text x="230" y="139" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#ffffff">변동금리</text>

  <rect x="430" y="100" width="310" height="64" rx="18" fill="url(#rightHeader)" filter="url(#cardShadow)"/>
  <circle cx="472" cy="132" r="20" fill="#ffffff" opacity="0.85"/>
  <text x="472" y="139" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#7c3f0a">●</text>
  <text x="600" y="139" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#fff7ed">고정금리</text>

  <!-- row 1: 금리 변동 위험 -->
  <circle cx="30" cy="212" r="15" fill="url(#badgeGrad)"/>
  <text x="30" y="217" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="55" y="217" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#7c3f0a">금리 변동 위험</text>

  <rect x="60" y="230" width="310" height="50" rx="14" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="215" y="260" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#475569">상대적으로 큰 편</text>

  <rect x="430" y="230" width="310" height="50" rx="14" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="585" y="260" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#9a3412">상대적으로 작은 편</text>

  <!-- row 2: 적용되는 스트레스 금리 -->
  <circle cx="30" cy="322" r="15" fill="url(#badgeGrad)"/>
  <text x="30" y="327" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text x="55" y="327" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#7c3f0a">적용 스트레스 금리</text>

  <rect x="60" y="340" width="310" height="50" rx="14" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="215" y="370" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#475569">높게 가산되는 편</text>

  <rect x="430" y="340" width="310" height="50" rx="14" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="585" y="370" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#9a3412">낮게 가산되는 편</text>

  <!-- row 3: 대출 한도 영향 -->
  <circle cx="30" cy="432" r="15" fill="url(#badgeGrad)"/>
  <text x="30" y="437" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <text x="55" y="437" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#7c3f0a">대출 한도 영향</text>

  <rect x="60" y="450" width="310" height="50" rx="14" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="215" y="480" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#475569">한도 축소 폭이 큰 편</text>

  <rect x="430" y="450" width="310" height="50" rx="14" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="585" y="480" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#9a3412">한도 축소 폭이 작은 편</text>

  <!-- row 4: 체크포인트 -->
  <circle cx="30" cy="542" r="15" fill="url(#badgeGrad)"/>
  <text x="30" y="547" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">4</text>
  <text x="55" y="547" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#7c3f0a">체크포인트</text>

  <rect x="60" y="560" width="310" height="30" rx="14" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="215" y="580" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#475569">향후 금리 상승 대비 필요</text>

  <rect x="430" y="560" width="310" height="30" rx="14" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="585" y="580" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#9a3412">초기 적용 금리는 높을 수 있음</text>
</svg>
