<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="leftHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="rightHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="rowCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1e2a6e" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="46" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="26" font-weight="700" fill="#1e2a6e">AI 경쟁, 무게중심이 옮겨가고 있다</text>
  <text x="400" y="74" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">모델 성능 경쟁에서 전력·인프라 경쟁으로 (개념 예시)</text>

  <!-- column headers -->
  <rect x="60" y="100" width="310" height="64" rx="18" fill="url(#leftHeader)" filter="url(#cardShadow)"/>
  <circle cx="102" cy="132" r="20" fill="#ffffff" opacity="0.85"/>
  <text x="102" y="139" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#475569">이전</text>
  <text x="230" y="139" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#ffffff">모델 성능 경쟁</text>

  <rect x="430" y="100" width="310" height="64" rx="18" fill="url(#rightHeader)" filter="url(#cardShadow)"/>
  <circle cx="472" cy="132" r="20" fill="#ffffff" opacity="0.85"/>
  <text x="472" y="139" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#0f766e">지금</text>
  <text x="600" y="139" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#ecfeff">전력·인프라 경쟁</text>

  <!-- row 1 -->
  <circle cx="30" cy="212" r="15" fill="url(#badgeGrad)"/>
  <text x="30" y="217" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="55" y="217" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#1e2a6e">핵심 관심사</text>

  <rect x="60" y="230" width="310" height="70" rx="16" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="80" y="272" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">어떤 모델이 더 똑똑한가</text>

  <rect x="430" y="230" width="310" height="70" rx="16" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="450" y="272" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">전력을 얼마나 안정적으로 확보하나</text>

  <!-- row 2 -->
  <circle cx="30" cy="332" r="15" fill="url(#badgeGrad)"/>
  <text x="30" y="337" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text x="55" y="337" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#1e2a6e">투자 우선순위</text>

  <rect x="60" y="350" width="310" height="70" rx="16" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="80" y="386" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">GPU·연구 인력 확보</text>
  <text x="80" y="406" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">중심 투자</text>

  <rect x="430" y="350" width="310" height="70" rx="16" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="450" y="386" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">전력망·데이터센터 부지</text>
  <text x="450" y="406" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">확보 경쟁 병행</text>

  <!-- row 3 -->
  <circle cx="30" cy="452" r="15" fill="url(#badgeGrad)"/>
  <text x="30" y="457" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <text x="55" y="457" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#1e2a6e">체감되는 이슈</text>

  <rect x="60" y="470" width="310" height="70" rx="16" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="80" y="506" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">서비스 품질·응답 속도</text>

  <rect x="430" y="470" width="310" height="70" rx="16" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="450" y="500" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">전기요금 부담, 지역 간 인프라</text>
  <text x="450" y="520" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">형평성 논의</text>

  <text x="400" y="580" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#64748b">※ 위 항목은 흐름을 설명하기 위한 개념적 예시입니다</text>
</svg>
