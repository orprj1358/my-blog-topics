<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1330"/>
      <stop offset="50%" stop-color="#1e2a6e"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="chipGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="630" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="630" fill="url(#bg)"/>
    <circle cx="1010" cy="150" r="270" fill="url(#glow1)"/>
    <circle cx="150" cy="520" r="260" fill="url(#glow2)"/>

    <!-- network / chip motif, upper right -->
    <g opacity="0.95">
      <rect x="930" y="300" width="140" height="140" rx="24" fill="url(#chipGrad)"/>
      <rect x="962" y="332" width="76" height="76" rx="12" fill="#0b1330" opacity="0.55"/>
      <rect x="978" y="348" width="44" height="44" rx="8" fill="url(#chipGrad2)"/>
      <!-- chip pins -->
      <rect x="900" y="352" width="24" height="10" rx="4" fill="url(#chipGrad)"/>
      <rect x="900" y="378" width="24" height="10" rx="4" fill="url(#chipGrad)"/>
      <rect x="1076" y="352" width="24" height="10" rx="4" fill="url(#chipGrad)"/>
      <rect x="1076" y="378" width="24" height="10" rx="4" fill="url(#chipGrad)"/>
      <rect x="994" y="270" width="10" height="24" rx="4" fill="url(#chipGrad)"/>
      <rect x="1026" y="270" width="10" height="24" rx="4" fill="url(#chipGrad)"/>
      <rect x="994" y="446" width="10" height="24" rx="4" fill="url(#chipGrad)"/>
      <rect x="1026" y="446" width="10" height="24" rx="4" fill="url(#chipGrad)"/>
    </g>

    <!-- network nodes connecting to chip -->
    <g opacity="0.85">
      <line x1="900" y1="357" x2="800" y2="300" stroke="#5eead4" stroke-width="3"/>
      <line x1="900" y1="383" x2="800" y2="470" stroke="#5eead4" stroke-width="3"/>
      <line x1="1100" y1="357" x2="1150" y2="230" stroke="#5eead4" stroke-width="3" opacity="0.5"/>
      <circle cx="800" cy="300" r="12" fill="url(#chipGrad2)"/>
      <circle cx="800" cy="470" r="12" fill="url(#chipGrad2)"/>
    </g>

    <!-- simple power/bolt icon, lower right accent -->
    <g opacity="0.9">
      <path d="M 1060 470 L 1030 520 L 1052 520 L 1038 560 L 1080 508 L 1058 508 Z" fill="url(#tagGrad)"/>
    </g>

    <!-- eyebrow tag -->
    <rect x="80" y="120" width="230" height="46" rx="23" fill="url(#tagGrad)"/>
    <text x="195" y="150" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#0b1330">AI 관련 소식</text>

    <!-- title -->
    <text x="80" y="260" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="52" font-weight="800" fill="#ffffff">AI 경쟁의 다음 무대,</text>
    <text x="80" y="330" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="52" font-weight="800" fill="#ffffff">전력과 인프라</text>

    <!-- subtitle card -->
    <rect x="80" y="380" width="560" height="70" rx="18" fill="url(#cardGrad)"/>
    <text x="106" y="424" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="21" fill="#e0f2fe">AI 데이터센터 전력 수요, 왜 커지고 있나</text>
  </g>
</svg>
