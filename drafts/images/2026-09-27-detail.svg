<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="leftHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="rightHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1e5f8c"/>
    </linearGradient>
    <linearGradient id="rowCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#123a5e" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="46" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="26" font-weight="700" fill="#123a5e">안전진단 기준, 무엇이 달라지나</text>
  <text x="400" y="74" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">이전 기준과 완화 논의 기준 비교 (개념 예시)</text>

  <!-- column headers -->
  <rect x="60" y="100" width="310" height="64" rx="18" fill="url(#leftHeader)" filter="url(#cardShadow)"/>
  <circle cx="102" cy="132" r="20" fill="#ffffff" opacity="0.85"/>
  <text x="102" y="139" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#475569">이전</text>
  <text x="230" y="139" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#ffffff">구조안전성 중심</text>

  <rect x="430" y="100" width="310" height="64" rx="18" fill="url(#rightHeader)" filter="url(#cardShadow)"/>
  <circle cx="472" cy="132" r="20" fill="#ffffff" opacity="0.85"/>
  <text x="472" y="139" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#1e5f8c">완화 논의</text>
  <text x="610" y="139" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#eaf3ff">생활환경 비중 확대</text>

  <!-- row 1 -->
  <circle cx="30" cy="212" r="15" fill="url(#badgeGrad)"/>
  <text x="30" y="217" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#7a5a06">1</text>
  <text x="55" y="217" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#123a5e">핵심 평가 항목</text>

  <rect x="60" y="230" width="310" height="70" rx="16" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="80" y="262" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">구조안전성 비중이</text>
  <text x="80" y="284" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">가장 크게 반영</text>

  <rect x="430" y="230" width="310" height="70" rx="16" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="450" y="262" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">주거환경·설비 노후도</text>
  <text x="450" y="284" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">비중 확대 검토</text>

  <!-- row 2 -->
  <circle cx="30" cy="332" r="15" fill="url(#badgeGrad)"/>
  <text x="30" y="337" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#7a5a06">2</text>
  <text x="55" y="337" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#123a5e">통과 난이도</text>

  <rect x="60" y="350" width="310" height="70" rx="16" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="80" y="382" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">외관상 멀쩡하면</text>
  <text x="80" y="404" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">재건축 문턱 넘기 어려움</text>

  <rect x="430" y="350" width="310" height="70" rx="16" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="450" y="382" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">생활 불편 큰 단지는</text>
  <text x="450" y="404" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">상대적으로 수월하게 통과</text>

  <!-- row 3 -->
  <circle cx="30" cy="452" r="15" fill="url(#badgeGrad)"/>
  <text x="30" y="457" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#7a5a06">3</text>
  <text x="55" y="457" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#123a5e">이후 절차</text>

  <rect x="60" y="470" width="310" height="70" rx="16" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="80" y="502" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">조합 설립부터</text>
  <text x="80" y="524" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">관리처분까지 동일</text>

  <rect x="430" y="470" width="310" height="70" rx="16" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="450" y="502" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">절차는 동일, 투기 수요</text>
  <text x="450" y="524" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">방지 장치는 별도 논의</text>

  <text x="400" y="580" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#64748b">※ 위 항목은 흐름을 설명하기 위한 개념적 예시입니다</text>
</svg>
