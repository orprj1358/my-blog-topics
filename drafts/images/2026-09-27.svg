<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#123a5e"/>
      <stop offset="100%" stop-color="#1e5f8c"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="630" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="630" fill="url(#bg)"/>
    <circle cx="1010" cy="150" r="270" fill="url(#glow1)"/>
    <circle cx="150" cy="520" r="260" fill="url(#glow2)"/>

    <!-- apartment building silhouette, upper right -->
    <g opacity="0.95">
      <rect x="990" y="210" width="150" height="230" rx="10" fill="url(#houseGrad)"/>
      <rect x="1010" y="234" width="26" height="26" rx="4" fill="#0a1628" opacity="0.4"/>
      <rect x="1052" y="234" width="26" height="26" rx="4" fill="#0a1628" opacity="0.4"/>
      <rect x="1094" y="234" width="26" height="26" rx="4" fill="#0a1628" opacity="0.4"/>
      <rect x="1010" y="278" width="26" height="26" rx="4" fill="#0a1628" opacity="0.4"/>
      <rect x="1052" y="278" width="26" height="26" rx="4" fill="#0a1628" opacity="0.4"/>
      <rect x="1094" y="278" width="26" height="26" rx="4" fill="#0a1628" opacity="0.4"/>
      <rect x="1010" y="322" width="26" height="26" rx="4" fill="#0a1628" opacity="0.4"/>
      <rect x="1052" y="322" width="26" height="26" rx="4" fill="#0a1628" opacity="0.4"/>
      <rect x="1094" y="322" width="26" height="26" rx="4" fill="#0a1628" opacity="0.4"/>
      <rect x="1010" y="366" width="26" height="26" rx="4" fill="#0a1628" opacity="0.4"/>
      <rect x="1052" y="366" width="26" height="26" rx="4" fill="#0a1628" opacity="0.4"/>
      <rect x="1094" y="366" width="26" height="26" rx="4" fill="#0a1628" opacity="0.4"/>
    </g>
    <g opacity="0.72">
      <rect x="915" y="290" width="70" height="150" rx="8" fill="url(#houseGrad)"/>
      <rect x="930" y="308" width="18" height="18" rx="3" fill="#0a1628" opacity="0.4"/>
      <rect x="958" y="308" width="18" height="18" rx="3" fill="#0a1628" opacity="0.4"/>
      <rect x="930" y="338" width="18" height="18" rx="3" fill="#0a1628" opacity="0.4"/>
      <rect x="958" y="338" width="18" height="18" rx="3" fill="#0a1628" opacity="0.4"/>
      <rect x="930" y="368" width="18" height="18" rx="3" fill="#0a1628" opacity="0.4"/>
      <rect x="958" y="368" width="18" height="18" rx="3" fill="#0a1628" opacity="0.4"/>
    </g>

    <!-- inspection badge: magnifying glass with check, over the building -->
    <g opacity="0.98">
      <circle cx="1085" cy="470" r="46" fill="url(#roofGrad)"/>
      <circle cx="1075" cy="460" r="16" fill="none" stroke="#7a5a06" stroke-width="5"/>
      <line x1="1086" y1="471" x2="1102" y2="487" stroke="#7a5a06" stroke-width="6" stroke-linecap="round"/>
      <path d="M1068 460 L1073 466 L1083 452" fill="none" stroke="#7a5a06" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- small deco squares -->
    <g opacity="0.32">
      <rect x="130" y="150" width="42" height="42" rx="11" fill="none" stroke="#a5b4fc" stroke-width="2.5"/>
      <circle cx="151" cy="171" r="8" fill="#a5b4fc"/>
    </g>

    <!-- text card -->
    <rect x="90" y="150" width="820" height="330" rx="28" fill="url(#cardGrad)"/>
    <text x="130" y="235" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="40" font-weight="700" fill="#eaf3ff">재건축 안전진단</text>
    <text x="130" y="295" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="36" font-weight="700" fill="#93c5fd">규제 완화 논의</text>
    <text x="130" y="350" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="21" fill="#dbeafe" opacity="0.9">노후 아파트 재건축, 속도 빨라질까</text>

    <rect x="130" y="95" width="132" height="42" rx="21" fill="url(#tagGrad)" opacity="0.95"/>
    <text x="196" y="122" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#0a1628">부동산정책</text>
  </g>
</svg>
