<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="leftHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="rightHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="rowCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99f6e4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#312e81" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="46" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="26" font-weight="700" fill="#312e81">쇼핑의 흐름, 무엇이 달라지나</text>
  <text x="400" y="74" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#57534e">기존 온라인쇼핑과 에이전틱 커머스 비교 (개념 예시)</text>

  <!-- column headers -->
  <rect x="60" y="100" width="310" height="64" rx="18" fill="url(#leftHeader)" filter="url(#cardShadow)"/>
  <circle cx="102" cy="132" r="20" fill="#ffffff" opacity="0.85"/>
  <text x="102" y="139" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#475569">기존</text>
  <text x="230" y="139" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#ffffff">내가 직접 쇼핑</text>

  <rect x="430" y="100" width="310" height="64" rx="18" fill="url(#rightHeader)" filter="url(#cardShadow)"/>
  <circle cx="472" cy="132" r="20" fill="#ffffff" opacity="0.85"/>
  <text x="472" y="139" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#0f766e">신규</text>
  <text x="610" y="139" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#f0fdfa">AI 에이전트 위임</text>

  <!-- row 1 -->
  <circle cx="30" cy="212" r="15" fill="url(#badgeGrad)"/>
  <text x="30" y="217" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f5c53">1</text>
  <text x="55" y="217" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#312e81">상품 탐색</text>

  <rect x="60" y="230" width="310" height="70" rx="16" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="80" y="262" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">여러 사이트를 오가며</text>
  <text x="80" y="284" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">직접 검색·비교</text>

  <rect x="430" y="230" width="310" height="70" rx="16" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="450" y="262" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">조건만 알려주면</text>
  <text x="450" y="284" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">에이전트가 대신 탐색</text>

  <!-- row 2 -->
  <circle cx="30" cy="332" r="15" fill="url(#badgeGrad)"/>
  <text x="30" y="337" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f5c53">2</text>
  <text x="55" y="337" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#312e81">가격 비교</text>

  <rect x="60" y="350" width="310" height="70" rx="16" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="80" y="382" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">탭을 여러 개 열어두고</text>
  <text x="80" y="404" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">눈으로 하나하나 대조</text>

  <rect x="430" y="350" width="310" height="70" rx="16" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="450" y="382" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">여러 판매처를 동시에 조회해</text>
  <text x="450" y="404" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">최적 조건 자동 제안</text>

  <!-- row 3 -->
  <circle cx="30" cy="452" r="15" fill="url(#badgeGrad)"/>
  <text x="30" y="457" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f5c53">3</text>
  <text x="55" y="457" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#312e81">결제</text>

  <rect x="60" y="470" width="310" height="70" rx="16" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="80" y="502" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">매번 카드번호를 입력하며</text>
  <text x="80" y="524" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">직접 최종 결제</text>

  <rect x="430" y="470" width="310" height="70" rx="16" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="450" y="502" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">사전에 정한 한도 내에서</text>
  <text x="450" y="524" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#334155">에이전트가 대신 결제 진행</text>

  <text x="400" y="580" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#78716c">※ 위 항목은 흐름을 설명하기 위한 개념적 예시입니다</text>
</svg>
