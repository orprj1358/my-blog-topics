<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99f6e4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99f6e4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="630" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="630" fill="url(#bg)"/>
    <circle cx="1010" cy="150" r="270" fill="url(#glow1)"/>
    <circle cx="150" cy="520" r="260" fill="url(#glow2)"/>

    <!-- AI chip with network nodes, representing AI agent -->
    <g opacity="0.96">
      <rect x="930" y="250" width="160" height="160" rx="24" fill="url(#chipGrad)"/>
      <rect x="965" y="285" width="90" height="90" rx="14" fill="#0f766e" opacity="0.55"/>
      <circle cx="900" cy="260" r="7" fill="#99f6e4"/>
      <circle cx="900" cy="330" r="7" fill="#99f6e4"/>
      <circle cx="900" cy="400" r="7" fill="#99f6e4"/>
      <line x1="907" y1="260" x2="930" y2="270" stroke="#99f6e4" stroke-width="3"/>
      <line x1="907" y1="330" x2="930" y2="330" stroke="#99f6e4" stroke-width="3"/>
      <line x1="907" y1="400" x2="930" y2="390" stroke="#99f6e4" stroke-width="3"/>
      <circle cx="1020" cy="230" r="7" fill="#c7d2fe"/>
      <circle cx="1120" cy="260" r="7" fill="#c7d2fe"/>
      <line x1="1020" y1="237" x2="1010" y2="250" stroke="#c7d2fe" stroke-width="3"/>
      <line x1="1113" y1="264" x2="1090" y2="275" stroke="#c7d2fe" stroke-width="3"/>
    </g>

    <!-- shopping cart badge, representing commerce/payment -->
    <g opacity="0.98">
      <circle cx="1075" cy="470" r="48" fill="url(#cartGrad)"/>
      <path d="M1050 452 h10 l8 34 h32 l7 -22 h-38" fill="none" stroke="#312e81" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="1064" cy="494" r="4.5" fill="#312e81"/>
      <circle cx="1090" cy="494" r="4.5" fill="#312e81"/>
    </g>

    <!-- small deco squares -->
    <g opacity="0.32">
      <rect x="130" y="150" width="42" height="42" rx="11" fill="none" stroke="#5eead4" stroke-width="2.5"/>
      <circle cx="151" cy="171" r="8" fill="#5eead4"/>
    </g>

    <!-- text card -->
    <rect x="90" y="150" width="830" height="330" rx="28" fill="url(#cardGrad)"/>
    <text x="130" y="235" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="40" font-weight="700" fill="#f0fdfa">AI가 대신 결제까지</text>
    <text x="130" y="295" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="34" font-weight="700" fill="#99f6e4">'에이전틱 커머스' 확산</text>
    <text x="130" y="350" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="21" fill="#e0e7ff" opacity="0.9">탐색부터 구매까지, 쇼핑의 주체가 바뀐다</text>

    <rect x="130" y="95" width="106" height="42" rx="21" fill="url(#tagGrad)" opacity="0.95"/>
    <text x="183" y="122" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#0f2e2a">AI 소식</text>
  </g>
</svg>
