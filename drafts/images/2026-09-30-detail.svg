<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1e5f8c"/>
    </linearGradient>
    <linearGradient id="rowCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="lastGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#123a5e" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="44" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="25" font-weight="700" fill="#123a5e">1기 신도시 재건축, 어디까지 왔나</text>
  <text x="400" y="70" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#334155">선도지구 지정 이후 진행 단계 (개념 예시)</text>

  <!-- connecting line -->
  <line x1="70" y1="118" x2="70" y2="540" stroke="#93c5fd" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/>

  <!-- step 1 -->
  <circle cx="70" cy="110" r="24" fill="url(#stepGrad)" filter="url(#cardShadow)"/>
  <text x="70" y="117" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#ffffff">1</text>
  <rect x="112" y="86" width="610" height="60" rx="16" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="134" y="112" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#123a5e">노후계획도시 특별법 적용</text>
  <text x="134" y="134" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#334155">일정 요건을 충족하는 노후 택지지구가 특별법 대상으로 지정</text>

  <!-- step 2 -->
  <circle cx="70" cy="196" r="24" fill="url(#stepGrad)" filter="url(#cardShadow)"/>
  <text x="70" y="203" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#ffffff">2</text>
  <rect x="112" y="172" width="610" height="60" rx="16" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="134" y="198" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#123a5e">선도지구 선정</text>
  <text x="134" y="220" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#334155">단지별 여건을 평가해 우선 정비 대상 구역을 선정</text>

  <!-- step 3 -->
  <circle cx="70" cy="282" r="24" fill="url(#stepGrad)" filter="url(#cardShadow)"/>
  <text x="70" y="289" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#ffffff">3</text>
  <rect x="112" y="258" width="610" height="60" rx="16" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="134" y="284" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#123a5e">정비계획 수립·인가</text>
  <text x="134" y="306" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#334155">용적률, 세대수 등 구체적인 정비 방향을 확정</text>

  <!-- step 4 -->
  <circle cx="70" cy="368" r="24" fill="url(#badgeGrad)" filter="url(#cardShadow)"/>
  <text x="70" y="375" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#7a5a06">4</text>
  <rect x="112" y="344" width="610" height="60" rx="16" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="134" y="370" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#123a5e">이주 및 철거 (순환정비 검토)</text>
  <text x="134" y="392" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#334155">임시 거처·순환정비 방식 등 이주 수요 분산 방안 병행</text>

  <!-- step 5 -->
  <circle cx="70" cy="454" r="24" fill="url(#lastGrad)" filter="url(#cardShadow)"/>
  <text x="70" y="461" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#ffffff">5</text>
  <rect x="112" y="430" width="610" height="60" rx="16" fill="url(#rowCard)" filter="url(#cardShadow)"/>
  <text x="134" y="456" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#123a5e">착공</text>
  <text x="134" y="478" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#334155">인허가 절차와 조합 협의 진행 속도에 따라 시점 변동 가능</text>

  <text x="400" y="530" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#64748b">※ 위 단계는 흐름을 설명하기 위한 개념적 예시이며, 실제 일정은 단지·지역별로 다를 수 있습니다</text>
</svg>
