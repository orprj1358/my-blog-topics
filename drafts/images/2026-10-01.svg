<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b1506"/>
      <stop offset="50%" stop-color="#6b3410"/>
      <stop offset="100%" stop-color="#c2650e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="coinGradDim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="630" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="630" fill="url(#bg)"/>
    <circle cx="1010" cy="150" r="270" fill="url(#glow1)"/>
    <circle cx="150" cy="520" r="260" fill="url(#glow2)"/>

    <!-- coin stack, upper right -->
    <g opacity="0.95">
      <ellipse cx="1030" cy="420" rx="110" ry="34" fill="url(#coinGradDim)"/>
      <ellipse cx="1030" cy="390" rx="110" ry="34" fill="url(#coinGrad)"/>
      <ellipse cx="1030" cy="360" rx="110" ry="34" fill="url(#coinGradDim)"/>
      <ellipse cx="1030" cy="330" rx="110" ry="34" fill="url(#coinGrad)"/>
      <text x="1030" y="340" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#7a4a06">%</text>
    </g>

    <!-- badge circle with percent, smaller, upper far right -->
    <g opacity="0.9">
      <circle cx="1140" cy="200" r="54" fill="url(#coinGrad)"/>
      <text x="1140" y="212" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#7a4a06">%</text>
    </g>

    <!-- small deco squares -->
    <g opacity="0.32">
      <rect x="130" y="150" width="42" height="42" rx="11" fill="none" stroke="#fed7aa" stroke-width="2.5"/>
      <circle cx="151" cy="171" r="8" fill="#fed7aa"/>
    </g>

    <!-- text card -->
    <rect x="90" y="150" width="820" height="330" rx="28" fill="url(#cardGrad)"/>
    <text x="130" y="235" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="40" font-weight="700" fill="#fff7eb">스트레스 DSR 3단계</text>
    <text x="130" y="295" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="36" font-weight="700" fill="#fbbf24">내 대출한도 괜찮을까</text>
    <text x="130" y="350" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="21" fill="#ffe8cc" opacity="0.9">적용 확대 흐름과 미리 챙겨둘 점</text>

    <rect x="130" y="95" width="80" height="42" rx="21" fill="url(#tagGrad)" opacity="0.95"/>
    <text x="170" y="122" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#4a2a06">대출</text>
  </g>
</svg>
