<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="badge1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="badge2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="badge3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="badge4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1e293b" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="640" fill="url(#pageBg)"/>

  <text x="400" y="44" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="25" font-weight="700" fill="#1e293b">AI 확산이 전력망 부담으로 이어지는 흐름</text>
  <text x="400" y="70" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#475569">생성형 AI 이용이 늘수록 데이터센터 전력 소비도 함께 늘어납니다</text>

  <!-- step 1 -->
  <rect x="60" y="100" width="680" height="96" rx="20" fill="url(#cardGrad1)" filter="url(#cardShadow)"/>
  <circle cx="110" cy="148" r="26" fill="url(#badge1)" filter="url(#cardShadow)"/>
  <text x="110" y="156" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#ffffff">1</text>
  <text x="152" y="138" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#065f46">AI 이용·학습 수요 증가</text>
  <text x="152" y="162" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#047857">이용자가 늘고 모델이 커질수록 필요한 연산량도 커짐</text>

  <!-- arrow 1 -->
  <g stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="400" y1="196" x2="400" y2="222"/>
    <polyline points="386,208 400,222 414,208"/>
  </g>

  <!-- step 2 -->
  <rect x="60" y="230" width="680" height="96" rx="20" fill="url(#cardGrad2)" filter="url(#cardShadow)"/>
  <circle cx="110" cy="278" r="26" fill="url(#badge2)" filter="url(#cardShadow)"/>
  <text x="110" y="286" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#ffffff">2</text>
  <text x="152" y="268" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#155e75">데이터센터 서버·냉각 가동 확대</text>
  <text x="152" y="292" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#0e7490">서버를 24시간 돌리고 식히는 데 많은 전력이 들어감</text>

  <!-- arrow 2 -->
  <g stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="400" y1="326" x2="400" y2="352"/>
    <polyline points="386,338 400,352 414,338"/>
  </g>

  <!-- step 3 -->
  <rect x="60" y="360" width="680" height="96" rx="20" fill="url(#cardGrad3)" filter="url(#cardShadow)"/>
  <circle cx="110" cy="408" r="26" fill="url(#badge3)" filter="url(#cardShadow)"/>
  <text x="110" y="416" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#ffffff">3</text>
  <text x="152" y="398" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#3730a3">특정 지역 전력망에 부담 집중</text>
  <text x="152" y="422" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#4338ca">데이터센터가 밀집한 지역일수록 전력 수요가 급격히 쏠림</text>

  <!-- arrow 3 -->
  <g stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="400" y1="456" x2="400" y2="482"/>
    <polyline points="386,468 400,482 414,468"/>
  </g>

  <!-- step 4 -->
  <rect x="60" y="490" width="680" height="96" rx="20" fill="url(#cardGrad4)" filter="url(#cardShadow)"/>
  <circle cx="110" cy="538" r="26" fill="url(#badge4)" filter="url(#cardShadow)"/>
  <text x="110" y="546" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#ffffff">4</text>
  <text x="152" y="528" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#5b21b6">발전·요금제·재생에너지 대응 논의</text>
  <text x="152" y="552" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#6d28d9">공급 확충과 전용 요금제 등 다양한 방안이 논의되는 단계</text>

  <text x="400" y="620" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#475569">※ 위 흐름은 이해를 돕기 위한 단순화된 개념도이며, 실제 대응 방안은 지역·국가별로 다릅니다</text>
</svg>
