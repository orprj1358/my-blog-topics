<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1326"/>
      <stop offset="50%" stop-color="#132f4c"/>
      <stop offset="100%" stop-color="#0d4d4a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99f6e4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99f6e4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="630" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="630" fill="url(#bg)"/>
    <circle cx="1020" cy="140" r="270" fill="url(#glow1)"/>
    <circle cx="140" cy="530" r="260" fill="url(#glow2)"/>

    <!-- chip icon, upper right -->
    <g opacity="0.95">
      <rect x="965" y="300" width="130" height="130" rx="18" fill="url(#chipGrad)"/>
      <rect x="995" y="330" width="70" height="70" rx="10" fill="#0d4d4a" opacity="0.85"/>
      <g stroke="#99f6e4" stroke-width="4" stroke-linecap="round">
        <line x1="965" y1="325" x2="945" y2="325"/>
        <line x1="965" y1="355" x2="945" y2="355"/>
        <line x1="965" y1="385" x2="945" y2="385"/>
        <line x1="965" y1="405" x2="945" y2="405"/>
        <line x1="1095" y1="325" x2="1115" y2="325"/>
        <line x1="1095" y1="355" x2="1115" y2="355"/>
        <line x1="1095" y1="385" x2="1115" y2="385"/>
        <line x1="1095" y1="405" x2="1115" y2="405"/>
      </g>
    </g>

    <!-- lightning bolt badge, upper far right -->
    <g opacity="0.92">
      <circle cx="1130" cy="200" r="54" fill="url(#boltGrad)"/>
      <path d="M1136 165 L1110 205 L1128 205 L1122 238 L1152 196 L1133 196 Z" fill="#1e1b4b"/>
    </g>

    <!-- small deco network dots -->
    <g opacity="0.35" stroke="#5eead4" stroke-width="2">
      <circle cx="150" cy="170" r="6" fill="#5eead4"/>
      <circle cx="195" cy="150" r="6" fill="#5eead4"/>
      <circle cx="190" cy="200" r="6" fill="#5eead4"/>
      <line x1="150" y1="170" x2="195" y2="150"/>
      <line x1="150" y1="170" x2="190" y2="200"/>
      <line x1="195" y1="150" x2="190" y2="200"/>
    </g>

    <!-- text card -->
    <rect x="90" y="150" width="820" height="330" rx="28" fill="url(#cardGrad)"/>
    <text x="130" y="235" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="40" font-weight="700" fill="#ecfeff">AI가 먹어치우는 전기</text>
    <text x="130" y="295" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="36" font-weight="700" fill="#5eead4">데이터센터 전력망 괜찮을까</text>
    <text x="130" y="350" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="21" fill="#e0f2fe" opacity="0.9">전력 수요 급증과 대응 논의 흐름</text>

    <rect x="130" y="95" width="60" height="42" rx="21" fill="url(#tagGrad)" opacity="0.95"/>
    <text x="160" y="122" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#0d4d4a">AI</text>
  </g>
</svg>
