<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="cardUp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="cardDown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="badgeUp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="badgeDown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="barUp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="barDown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1e3a5f" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="55" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f2a44" text-anchor="middle">현실화율을 조정하면 생기는 변화</text>
  <text x="400" y="82" font-family="Arial, sans-serif" font-size="15" fill="#3b5674" text-anchor="middle" opacity="0.85">(예시 비교 · 실제 수치는 공식 발표 확인 필요)</text>

  <!-- Left card: 올리면 -->
  <g filter="url(#softShadow)">
    <rect x="60" y="120" width="310" height="420" rx="20" fill="url(#cardUp)"/>
  </g>
  <circle cx="110" cy="170" r="28" fill="url(#badgeUp)"/>
  <text x="110" y="179" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">↑</text>
  <text x="152" y="178" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f2a44">현실화율을 올리면</text>

  <rect x="90" y="215" width="250" height="14" rx="7" fill="#e0ecfb"/>
  <rect x="90" y="215" width="200" height="14" rx="7" fill="url(#barUp)"/>
  <text x="90" y="245" font-family="Arial, sans-serif" font-size="14" fill="#3b5674">시세 반영도 ↑</text>

  <circle cx="100" cy="290" r="9" fill="#2563eb"/>
  <text x="120" y="295" font-family="Arial, sans-serif" font-size="15" fill="#1e3a5f">과세 형평성 개선</text>

  <circle cx="100" cy="330" r="9" fill="#2563eb"/>
  <text x="120" y="335" font-family="Arial, sans-serif" font-size="15" fill="#1e3a5f">보유세 부담 증가</text>

  <circle cx="100" cy="370" r="9" fill="#2563eb"/>
  <text x="120" y="375" font-family="Arial, sans-serif" font-size="15" fill="#1e3a5f">건강보험료 등 연동 영향</text>

  <circle cx="100" cy="410" r="9" fill="#2563eb"/>
  <text x="120" y="415" font-family="Arial, sans-serif" font-size="15" fill="#1e3a5f">1주택 실수요자 반발 우려</text>

  <rect x="90" y="455" width="250" height="60" rx="14" fill="#eff6ff"/>
  <text x="215" y="490" font-family="Arial, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">시세와 격차 축소</text>

  <!-- Right card: 낮추거나 동결하면 -->
  <g filter="url(#softShadow)">
    <rect x="430" y="120" width="310" height="420" rx="20" fill="url(#cardDown)"/>
  </g>
  <circle cx="480" cy="170" r="28" fill="url(#badgeDown)"/>
  <text x="480" y="179" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">↓</text>
  <text x="522" y="178" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f2a44">낮추거나 동결하면</text>

  <rect x="460" y="215" width="250" height="14" rx="7" fill="#e0ecfb"/>
  <rect x="460" y="215" width="120" height="14" rx="7" fill="url(#barDown)"/>
  <text x="460" y="245" font-family="Arial, sans-serif" font-size="14" fill="#3b5674">시세 반영도 ↓</text>

  <circle cx="470" cy="290" r="9" fill="#0ea5e9"/>
  <text x="490" y="295" font-family="Arial, sans-serif" font-size="15" fill="#1e3a5f">보유세 부담 완화</text>

  <circle cx="470" cy="330" r="9" fill="#0ea5e9"/>
  <text x="490" y="335" font-family="Arial, sans-serif" font-size="15" fill="#1e3a5f">시세 반영 지연 비판</text>

  <circle cx="470" cy="370" r="9" fill="#0ea5e9"/>
  <text x="490" y="375" font-family="Arial, sans-serif" font-size="15" fill="#1e3a5f">지역별 형평성 이슈 지속</text>

  <circle cx="470" cy="410" r="9" fill="#0ea5e9"/>
  <text x="490" y="415" font-family="Arial, sans-serif" font-size="15" fill="#1e3a5f">다주택자 체감 효과 적음</text>

  <rect x="460" y="455" width="250" height="60" rx="14" fill="#eff6ff"/>
  <text x="585" y="490" font-family="Arial, sans-serif" font-size="14" fill="#0ea5e9" text-anchor="middle" font-weight="600">시세와 격차 유지</text>
</svg>
