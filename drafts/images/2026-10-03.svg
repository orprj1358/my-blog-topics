<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a2f"/>
      <stop offset="50%" stop-color="#15304f"/>
      <stop offset="100%" stop-color="#1e4971"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfe3ff"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99f6e4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="630" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="630" fill="url(#bg)"/>
    <circle cx="1030" cy="150" r="280" fill="url(#glow1)"/>
    <circle cx="150" cy="520" r="250" fill="url(#glow2)"/>

    <!-- house icon cluster, right side -->
    <g opacity="0.95">
      <rect x="960" y="340" width="150" height="110" rx="10" fill="url(#houseGrad)"/>
      <polygon points="935,345 1035,270 1135,345" fill="url(#roofGrad)"/>
      <rect x="1010" y="380" width="50" height="70" rx="6" fill="#0a1a2f" opacity="0.8"/>
      <rect x="975" y="365" width="26" height="26" rx="4" fill="#0a1a2f" opacity="0.55"/>
      <rect x="1060" y="365" width="26" height="26" rx="4" fill="#0a1a2f" opacity="0.55"/>
    </g>

    <!-- document / price tag badge -->
    <g opacity="0.95">
      <circle cx="1120" cy="200" r="56" fill="url(#tagGrad)"/>
      <rect x="1096" y="178" width="48" height="44" rx="6" fill="#0a1a2f" opacity="0.85"/>
      <line x1="1104" y1="190" x2="1136" y2="190" stroke="#99f6e4" stroke-width="3" stroke-linecap="round"/>
      <line x1="1104" y1="200" x2="1130" y2="200" stroke="#99f6e4" stroke-width="3" stroke-linecap="round"/>
      <line x1="1104" y1="210" x2="1124" y2="210" stroke="#99f6e4" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- small coin/percent accent -->
    <g opacity="0.9">
      <circle cx="845" cy="470" r="34" fill="url(#tagGrad)"/>
      <text x="845" y="479" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0a1a2f" text-anchor="middle">%</text>
    </g>

    <!-- subtle rounded frame line -->
    <rect x="40" y="40" width="1120" height="550" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

    <!-- title text -->
    <text x="80" y="300" font-family="Arial, sans-serif" font-size="56" font-weight="700" fill="#f0f9ff">공시가격 로드맵,</text>
    <text x="80" y="370" font-family="Arial, sans-serif" font-size="56" font-weight="700" fill="#f0f9ff">다시 손보나</text>
    <text x="80" y="420" font-family="Arial, sans-serif" font-size="26" fill="#bae6fd" opacity="0.9">내 보유세는 어떻게 달라질까</text>
  </g>
</svg>
