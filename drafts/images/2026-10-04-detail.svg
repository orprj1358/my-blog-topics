<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fef0dc"/>
    </linearGradient>
    <linearGradient id="cardNow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="cardNext" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="badgeNow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="badgeNext" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="barNow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="barNext" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7c2d12" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="55" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#5c3414" text-anchor="middle">한도 규제, 지금과 보완책 검토 방향</text>
  <text x="400" y="82" font-family="Arial, sans-serif" font-size="15" fill="#92632a" text-anchor="middle" opacity="0.85">(예시 구성 · 실제 시행 여부·시기는 공식 발표 확인 필요)</text>

  <!-- Left card: 현재 -->
  <g filter="url(#softShadow)">
    <rect x="60" y="120" width="310" height="420" rx="20" fill="url(#cardNow)"/>
  </g>
  <circle cx="110" cy="170" r="28" fill="url(#badgeNow)"/>
  <text x="110" y="179" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">현재</text>
  <text x="152" y="178" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#5c3414">일괄 한도 적용</text>

  <rect x="90" y="215" width="250" height="14" rx="7" fill="#fde9c7"/>
  <rect x="90" y="215" width="220" height="14" rx="7" fill="url(#barNow)"/>
  <text x="90" y="245" font-family="Arial, sans-serif" font-size="14" fill="#92632a">용도 구분 폭 ↓</text>

  <circle cx="100" cy="290" r="9" fill="#d97706"/>
  <text x="120" y="295" font-family="Arial, sans-serif" font-size="15" fill="#5c3414">용도 구분 없이 한도 적용</text>

  <circle cx="100" cy="330" r="9" fill="#d97706"/>
  <text x="120" y="335" font-family="Arial, sans-serif" font-size="15" fill="#5c3414">병원비·학자금도 한도 포함</text>

  <circle cx="100" cy="370" r="9" fill="#d97706"/>
  <text x="120" y="375" font-family="Arial, sans-serif" font-size="15" fill="#5c3414">은행 창구 안내도 제한적</text>

  <circle cx="100" cy="410" r="9" fill="#d97706"/>
  <text x="120" y="415" font-family="Arial, sans-serif" font-size="15" fill="#5c3414">추가 자금 필요시 대안 부족</text>

  <rect x="90" y="455" width="250" height="60" rx="14" fill="#fff7ed"/>
  <text x="215" y="490" font-family="Arial, sans-serif" font-size="14" fill="#d97706" text-anchor="middle" font-weight="600">우회 대출 차단 목적</text>

  <!-- Right card: 보완책 검토 -->
  <g filter="url(#softShadow)">
    <rect x="430" y="120" width="310" height="420" rx="20" fill="url(#cardNext)"/>
  </g>
  <circle cx="480" cy="170" r="28" fill="url(#badgeNext)"/>
  <text x="480" y="179" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">검토</text>
  <text x="522" y="178" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#5c3414">예외 인정 확대</text>

  <rect x="460" y="215" width="250" height="14" rx="7" fill="#fde9c7"/>
  <rect x="460" y="215" width="130" height="14" rx="7" fill="url(#barNext)"/>
  <text x="460" y="245" font-family="Arial, sans-serif" font-size="14" fill="#92632a">용도 구분 폭 ↑</text>

  <circle cx="470" cy="290" r="9" fill="#ea580c"/>
  <text x="490" y="295" font-family="Arial, sans-serif" font-size="15" fill="#5c3414">의료비·법적분쟁 등 사유 검토</text>

  <circle cx="470" cy="330" r="9" fill="#ea580c"/>
  <text x="490" y="335" font-family="Arial, sans-serif" font-size="15" fill="#5c3414">객관적 증빙 시 한도 완화</text>

  <circle cx="470" cy="370" r="9" fill="#ea580c"/>
  <text x="490" y="375" font-family="Arial, sans-serif" font-size="15" fill="#5c3414">심사 기준 설계가 핵심 과제</text>

  <circle cx="470" cy="410" r="9" fill="#ea580c"/>
  <text x="490" y="415" font-family="Arial, sans-serif" font-size="15" fill="#5c3414">구체 시행 시점은 미정</text>

  <rect x="460" y="455" width="250" height="60" rx="14" fill="#fff7ed"/>
  <text x="585" y="490" font-family="Arial, sans-serif" font-size="14" fill="#ea580c" text-anchor="middle" font-weight="600">실수요자 불편 완화 목적</text>
</svg>
