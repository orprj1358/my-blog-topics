<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e0f7f5"/>
    </linearGradient>
    <linearGradient id="cardNow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="cardNext" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="badgeNow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="badgeNext" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="barNow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="barNext" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99f6e4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1e2259" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="55" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1e2259" text-anchor="middle">챗봇형 AI와 에이전틱 AI, 무엇이 다를까</text>
  <text x="400" y="82" font-family="Arial, sans-serif" font-size="15" fill="#4338ca" text-anchor="middle" opacity="0.8">(예시 구성 · 서비스별 기능 범위는 실제 제공사 공지 확인 필요)</text>

  <!-- Left card: 챗봇형 AI -->
  <g filter="url(#softShadow)">
    <rect x="60" y="120" width="310" height="420" rx="20" fill="url(#cardNow)"/>
  </g>
  <circle cx="110" cy="170" r="28" fill="url(#badgeNow)"/>
  <text x="110" y="179" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="152" y="178" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#312e81">챗봇형 AI</text>

  <rect x="90" y="215" width="250" height="14" rx="7" fill="#e0e7ff"/>
  <rect x="90" y="215" width="150" height="14" rx="7" fill="url(#barNow)"/>
  <text x="90" y="245" font-family="Arial, sans-serif" font-size="14" fill="#4338ca">행동 범위 ↓</text>

  <circle cx="100" cy="290" r="9" fill="#6366f1"/>
  <text x="120" y="295" font-family="Arial, sans-serif" font-size="15" fill="#312e81">질문에 답변·정보 제공</text>

  <circle cx="100" cy="330" r="9" fill="#6366f1"/>
  <text x="120" y="335" font-family="Arial, sans-serif" font-size="15" fill="#312e81">비교·구매는 사용자가 직접</text>

  <circle cx="100" cy="370" r="9" fill="#6366f1"/>
  <text x="120" y="375" font-family="Arial, sans-serif" font-size="15" fill="#312e81">결제 권한 없음</text>

  <circle cx="100" cy="410" r="9" fill="#6366f1"/>
  <text x="120" y="415" font-family="Arial, sans-serif" font-size="15" fill="#312e81">오작동 시 피해 범위 제한적</text>

  <rect x="90" y="455" width="250" height="60" rx="14" fill="#eef2ff"/>
  <text x="215" y="490" font-family="Arial, sans-serif" font-size="14" fill="#4338ca" text-anchor="middle" font-weight="600">정보 탐색 보조 중심</text>

  <!-- Right card: 에이전틱 AI -->
  <g filter="url(#softShadow)">
    <rect x="430" y="120" width="310" height="420" rx="20" fill="url(#cardNext)"/>
  </g>
  <circle cx="480" cy="170" r="28" fill="url(#badgeNext)"/>
  <text x="480" y="179" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="522" y="178" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#134e4a">에이전틱 AI</text>

  <rect x="460" y="215" width="250" height="14" rx="7" fill="#ccfbf1"/>
  <rect x="460" y="215" width="220" height="14" rx="7" fill="url(#barNext)"/>
  <text x="460" y="245" font-family="Arial, sans-serif" font-size="14" fill="#0f766e">행동 범위 ↑</text>

  <circle cx="470" cy="290" r="9" fill="#0d9488"/>
  <text x="490" y="295" font-family="Arial, sans-serif" font-size="15" fill="#134e4a">여러 사이트 비교까지 자동 수행</text>

  <circle cx="470" cy="330" r="9" fill="#0d9488"/>
  <text x="490" y="335" font-family="Arial, sans-serif" font-size="15" fill="#134e4a">조건 충족 시 구매·결제 실행</text>

  <circle cx="470" cy="370" r="9" fill="#0d9488"/>
  <text x="490" y="375" font-family="Arial, sans-serif" font-size="15" fill="#134e4a">결제 권한 위임 필요</text>

  <circle cx="470" cy="410" r="9" fill="#0d9488"/>
  <text x="490" y="415" font-family="Arial, sans-serif" font-size="15" fill="#134e4a">한도·확인 단계 등 안전장치 필요</text>

  <rect x="460" y="455" width="250" height="60" rx="14" fill="#f0fdfa"/>
  <text x="585" y="490" font-family="Arial, sans-serif" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="600">행동 대행까지 수행</text>
</svg>
