<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf1fb"/>
      <stop offset="100%" stop-color="#fdf1e3"/>
    </linearGradient>
    <linearGradient id="cardSupply" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="cardLoan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fde8cf"/>
    </linearGradient>
    <linearGradient id="badgeSupply" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="badgeLoan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="barSupply" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="barLoan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1e2259" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="55" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1e2259" text-anchor="middle">공급 확대와 대출 규제, 체감 시점이 다르다</text>
  <text x="400" y="82" font-family="Arial, sans-serif" font-size="14" fill="#44546b" text-anchor="middle" opacity="0.8">(예시 구성 · 실제 적용 시점·조건은 발표 공지 확인 필요)</text>

  <!-- Left card: 공급 확대 -->
  <g filter="url(#softShadow)">
    <rect x="60" y="120" width="310" height="420" rx="20" fill="url(#cardSupply)"/>
  </g>
  <circle cx="110" cy="170" r="28" fill="url(#badgeSupply)"/>
  <text x="110" y="179" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="152" y="178" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">공급 확대 정책</text>

  <rect x="90" y="215" width="250" height="14" rx="7" fill="#dbeafe"/>
  <rect x="90" y="215" width="190" height="14" rx="7" fill="url(#barSupply)"/>
  <text x="90" y="245" font-family="Arial, sans-serif" font-size="14" fill="#1e40af">체감 시점 — 장기</text>

  <circle cx="100" cy="290" r="9" fill="#2563eb"/>
  <text x="120" y="295" font-family="Arial, sans-serif" font-size="15" fill="#1e3a8a">공급 대책 재점검·발표</text>

  <circle cx="100" cy="330" r="9" fill="#2563eb"/>
  <text x="120" y="335" font-family="Arial, sans-serif" font-size="15" fill="#1e3a8a">착공·분양까지 상당 기간</text>

  <circle cx="100" cy="370" r="9" fill="#2563eb"/>
  <text x="120" y="375" font-family="Arial, sans-serif" font-size="15" fill="#1e3a8a">입주는 통상 수년 후</text>

  <circle cx="100" cy="410" r="9" fill="#2563eb"/>
  <text x="120" y="415" font-family="Arial, sans-serif" font-size="15" fill="#1e3a8a">시장 안정이 중장기 목표</text>

  <rect x="90" y="455" width="250" height="60" rx="14" fill="#eff6ff"/>
  <text x="215" y="490" font-family="Arial, sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="600">효과는 서서히 나타남</text>

  <!-- Right card: 대출 규제 -->
  <g filter="url(#softShadow)">
    <rect x="430" y="120" width="310" height="420" rx="20" fill="url(#cardLoan)"/>
  </g>
  <circle cx="480" cy="170" r="28" fill="url(#badgeLoan)"/>
  <text x="480" y="179" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="522" y="178" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#7c2d12">대출 관리 강화</text>

  <rect x="460" y="215" width="250" height="14" rx="7" fill="#fde8cf"/>
  <rect x="460" y="215" width="225" height="14" rx="7" fill="url(#barLoan)"/>
  <text x="460" y="245" font-family="Arial, sans-serif" font-size="14" fill="#9a3412">체감 시점 — 즉시</text>

  <circle cx="470" cy="290" r="9" fill="#ea580c"/>
  <text x="490" y="295" font-family="Arial, sans-serif" font-size="15" fill="#7c2d12">상환능력 심사 즉시 적용</text>

  <circle cx="470" cy="330" r="9" fill="#ea580c"/>
  <text x="490" y="335" font-family="Arial, sans-serif" font-size="15" fill="#7c2d12">대출 한도 바로 축소 체감</text>

  <circle cx="470" cy="370" r="9" fill="#ea580c"/>
  <text x="490" y="375" font-family="Arial, sans-serif" font-size="15" fill="#7c2d12">자금 조달 계획 재점검 필요</text>

  <circle cx="470" cy="410" r="9" fill="#ea580c"/>
  <text x="490" y="415" font-family="Arial, sans-serif" font-size="15" fill="#7c2d12">가계부채 총량 관리가 목표</text>

  <rect x="460" y="455" width="250" height="60" rx="14" fill="#fff7ed"/>
  <text x="585" y="490" font-family="Arial, sans-serif" font-size="14" fill="#9a3412" text-anchor="middle" font-weight="600">효과는 지금 바로 체감</text>
</svg>
