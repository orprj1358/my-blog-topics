<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b2e"/>
      <stop offset="50%" stop-color="#143352"/>
      <stop offset="100%" stop-color="#3a2410"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="630" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="630" fill="url(#bg)"/>
    <circle cx="1000" cy="160" r="280" fill="url(#glow1)"/>
    <circle cx="1080" cy="480" r="240" fill="url(#glow2)"/>

    <!-- house silhouette, upper right -->
    <g opacity="0.95">
      <path d="M940 260 L1015 195 L1090 260 L1090 350 L940 350 Z" fill="url(#houseGrad)"/>
      <rect x="975" y="285" width="34" height="65" rx="4" fill="#0b1b2e" opacity="0.5"/>
      <rect x="1030" y="300" width="36" height="36" rx="6" fill="#0b1b2e" opacity="0.4"/>
      <line x1="905" y1="330" x2="940" y2="330" stroke="#93c5fd" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
      <line x1="1090" y1="330" x2="1125" y2="330" stroke="#93c5fd" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- coin / percent badge, lower right -->
    <g opacity="0.95">
      <circle cx="1040" cy="470" r="78" fill="url(#coinGrad)"/>
      <circle cx="1040" cy="470" r="78" fill="none" stroke="#fff7ed" stroke-opacity="0.35" stroke-width="3"/>
      <text x="1040" y="486" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#5c3414" text-anchor="middle">%</text>
    </g>

    <!-- small badge accent -->
    <g opacity="0.9">
      <circle cx="905" cy="470" r="30" fill="url(#tagGrad)"/>
      <text x="905" y="479" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0b1b2e" text-anchor="middle">↔</text>
    </g>

    <!-- subtle rounded frame line -->
    <rect x="40" y="40" width="1120" height="550" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

    <!-- title text -->
    <text x="80" y="270" font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#eef2ff">공급은 늘리고</text>
    <text x="80" y="340" font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#eef2ff">대출은 조인다</text>
    <text x="80" y="392" font-family="Arial, sans-serif" font-size="26" fill="#fcd34d" opacity="0.95">엇박자 속 내 집 마련 전략은</text>
  </g>
</svg>
