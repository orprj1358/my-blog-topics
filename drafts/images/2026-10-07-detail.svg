<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf1fb"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="cardBefore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="cardAfter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </linearGradient>
    <linearGradient id="badgeBefore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="badgeAfter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="barStructBefore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="barEnvBefore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="barStructAfter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="barEnvAfter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1e2259" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="55" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0c3a66" text-anchor="middle">안전진단 기준, 무엇이 달라지나</text>
  <text x="400" y="82" font-family="Arial, sans-serif" font-size="14" fill="#44546b" text-anchor="middle" opacity="0.8">(예시 구성 · 실제 배점·항목은 개편 공지 확인 필요)</text>

  <!-- Left card: 기존 기준 -->
  <g filter="url(#softShadow)">
    <rect x="60" y="120" width="310" height="420" rx="20" fill="url(#cardBefore)"/>
  </g>
  <circle cx="110" cy="170" r="28" fill="url(#badgeBefore)"/>
  <text x="110" y="179" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="152" y="178" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">기존 기준</text>

  <text x="90" y="222" font-family="Arial, sans-serif" font-size="14" fill="#1e40af">구조안전성 비중</text>
  <rect x="90" y="230" width="250" height="14" rx="7" fill="#dbeafe"/>
  <rect x="90" y="230" width="210" height="14" rx="7" fill="url(#barStructBefore)"/>

  <text x="90" y="268" font-family="Arial, sans-serif" font-size="14" fill="#1e40af">주거환경·설비노후도</text>
  <rect x="90" y="276" width="250" height="14" rx="7" fill="#e0f2fe"/>
  <rect x="90" y="276" width="90" height="14" rx="7" fill="url(#barEnvBefore)"/>

  <circle cx="100" cy="330" r="9" fill="#2563eb"/>
  <text x="120" y="335" font-family="Arial, sans-serif" font-size="15" fill="#1e3a8a">구조 안전성 위주 평가</text>

  <circle cx="100" cy="370" r="9" fill="#2563eb"/>
  <text x="120" y="375" font-family="Arial, sans-serif" font-size="15" fill="#1e3a8a">통과 문턱이 높은 편</text>

  <circle cx="100" cy="410" r="9" fill="#2563eb"/>
  <text x="120" y="415" font-family="Arial, sans-serif" font-size="15" fill="#1e3a8a">노후 단지 재건축 지연</text>

  <rect x="90" y="455" width="250" height="60" rx="14" fill="#eff6ff"/>
  <text x="215" y="490" font-family="Arial, sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="600">문턱을 넘기 어려움</text>

  <!-- Right card: 개편 후 기준 -->
  <g filter="url(#softShadow)">
    <rect x="430" y="120" width="310" height="420" rx="20" fill="url(#cardAfter)"/>
  </g>
  <circle cx="480" cy="170" r="28" fill="url(#badgeAfter)"/>
  <text x="480" y="179" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="522" y="178" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0c4a6e">개편 후 기준(논의)</text>

  <text x="460" y="222" font-family="Arial, sans-serif" font-size="14" fill="#0e7490">구조안전성 비중</text>
  <rect x="460" y="230" width="250" height="14" rx="7" fill="#dbeafe"/>
  <rect x="460" y="230" width="130" height="14" rx="7" fill="url(#barStructAfter)"/>

  <text x="460" y="268" font-family="Arial, sans-serif" font-size="14" fill="#0e7490">주거환경·설비노후도</text>
  <rect x="460" y="276" width="250" height="14" rx="7" fill="#cffafe"/>
  <rect x="460" y="276" width="190" height="14" rx="7" fill="url(#barEnvAfter)"/>

  <circle cx="470" cy="330" r="9" fill="#0891b2"/>
  <text x="490" y="335" font-family="Arial, sans-serif" font-size="15" fill="#0c4a6e">생활 여건 비중 확대</text>

  <circle cx="470" cy="370" r="9" fill="#0891b2"/>
  <text x="490" y="375" font-family="Arial, sans-serif" font-size="15" fill="#0c4a6e">통과 가능성 완화 기대</text>

  <circle cx="470" cy="410" r="9" fill="#0891b2"/>
  <text x="490" y="415" font-family="Arial, sans-serif" font-size="15" fill="#0c4a6e">단지별 적용 시점은 상이</text>

  <rect x="460" y="455" width="250" height="60" rx="14" fill="#ecfeff"/>
  <text x="585" y="490" font-family="Arial, sans-serif" font-size="14" fill="#0c4a6e" text-anchor="middle" font-weight="600">문턱이 다소 낮아짐</text>
</svg>
