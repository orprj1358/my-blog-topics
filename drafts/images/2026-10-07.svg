<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b2e"/>
      <stop offset="55%" stop-color="#123150"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="630" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="630" fill="url(#bg)"/>
    <circle cx="1000" cy="170" r="280" fill="url(#glow1)"/>
    <circle cx="1070" cy="470" r="230" fill="url(#glow2)"/>

    <!-- house silhouette, upper right -->
    <g opacity="0.95">
      <path d="M945 255 L1020 190 L1095 255 L1095 348 L945 348 Z" fill="url(#houseGrad)"/>
      <rect x="980" y="282" width="34" height="66" rx="4" fill="#0b1b2e" opacity="0.5"/>
      <rect x="1035" y="298" width="36" height="36" rx="6" fill="#0b1b2e" opacity="0.4"/>
      <line x1="910" y1="330" x2="945" y2="330" stroke="#93c5fd" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
      <line x1="1095" y1="330" x2="1130" y2="330" stroke="#93c5fd" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- checklist / inspection badge, lower right -->
    <g opacity="0.95">
      <circle cx="1040" cy="470" r="78" fill="url(#badgeGrad)"/>
      <circle cx="1040" cy="470" r="78" fill="none" stroke="#f0f9ff" stroke-opacity="0.35" stroke-width="3"/>
      <path d="M1008 470 L1030 492 L1074 442" fill="none" stroke="#0c4a6e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- small badge accent -->
    <g opacity="0.9">
      <circle cx="905" cy="470" r="30" fill="url(#tagGrad)"/>
      <text x="905" y="479" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0b1b2e" text-anchor="middle">↑</text>
    </g>

    <!-- subtle rounded frame line -->
    <rect x="40" y="40" width="1120" height="550" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

    <!-- title text -->
    <text x="80" y="255" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#eef2ff">재건축 안전진단</text>
    <text x="80" y="325" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#eef2ff">완화, 속도 낼까</text>
    <text x="80" y="378" font-family="Arial, sans-serif" font-size="26" fill="#7dd3fc" opacity="0.95">우리 아파트는 해당될까</text>
  </g>
</svg>
