<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="cardL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
    <linearGradient id="cardR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFBF1"/>
      <stop offset="100%" stop-color="#99F6E4"/>
    </linearGradient>
    <linearGradient id="badgeL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="badgeR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1E1B4B" flood-opacity="0.18"/>
    </filter>
    <filter id="shadowSm" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E1B4B" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="620" fill="url(#pageBg)"/>

  <text x="400" y="54" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="27" font-weight="800" fill="#312E81">생성형 AI 저작권, 어디까지 인정될까</text>

  <!-- left card -->
  <g filter="url(#shadow)">
    <rect x="50" y="95" width="320" height="250" rx="22" fill="url(#cardL)"/>
  </g>
  <circle cx="90" cy="135" r="24" fill="url(#badgeL)" filter="url(#shadowSm)"/>
  <text x="90" y="143" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">1</text>
  <text x="128" y="143" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="21" font-weight="700" fill="#312E81">AI 단독 생성</text>

  <!-- robot icon -->
  <g transform="translate(170,175)">
    <rect x="0" y="10" width="60" height="46" rx="10" fill="#FFFFFF" fill-opacity="0.75"/>
    <circle cx="18" cy="33" r="6" fill="#4F46E5"/>
    <circle cx="42" cy="33" r="6" fill="#4F46E5"/>
    <rect x="22" y="0" width="16" height="12" rx="3" fill="#FFFFFF" fill-opacity="0.75"/>
    <line x1="30" y1="0" x2="30" y2="-10" stroke="#4F46E5" stroke-width="3"/>
    <circle cx="30" cy="-14" r="4" fill="#4F46E5"/>
  </g>

  <text x="90" y="268" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" fill="#3730A3">사람 개입 없이</text>
  <text x="90" y="292" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" fill="#3730A3">AI가 전부 생성한 결과물</text>
  <rect x="80" y="305" width="260" height="30" rx="15" fill="#4F46E5" fill-opacity="0.85"/>
  <text x="210" y="325" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">저작권 인정 어려움</text>

  <!-- right card -->
  <g filter="url(#shadow)">
    <rect x="430" y="95" width="320" height="250" rx="22" fill="url(#cardR)"/>
  </g>
  <circle cx="470" cy="135" r="24" fill="url(#badgeR)" filter="url(#shadowSm)"/>
  <text x="470" y="143" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">2</text>
  <text x="508" y="143" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="21" font-weight="700" fill="#134E4A">사람 창작적 개입</text>

  <!-- person + pencil icon -->
  <g transform="translate(550,175)">
    <circle cx="18" cy="12" r="11" fill="#FFFFFF" fill-opacity="0.8"/>
    <path d="M0,50 C0,30 36,30 36,50 Z" fill="#FFFFFF" fill-opacity="0.8"/>
    <line x1="42" y1="48" x2="68" y2="10" stroke="#0D9488" stroke-width="5" stroke-linecap="round"/>
    <path d="M64,16 L72,4 L76,8 L68,20 Z" fill="#0D9488"/>
  </g>

  <text x="470" y="268" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" fill="#115E59">프롬프트 설계 +</text>
  <text x="470" y="292" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" fill="#115E59">수정 작업을 더한 결과물</text>
  <rect x="460" y="305" width="260" height="30" rx="15" fill="#0D9488" fill-opacity="0.85"/>
  <text x="590" y="325" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">인정 가능성 검토</text>

  <!-- vs divider -->
  <circle cx="400" cy="220" r="18" fill="#FFFFFF" fill-opacity="0.85" filter="url(#shadowSm)"/>
  <text x="400" y="226" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#6D28D9">VS</text>

  <!-- bottom flow bar -->
  <g filter="url(#shadow)">
    <rect x="50" y="400" width="700" height="150" rx="22" fill="#FFFFFF" fill-opacity="0.75"/>
  </g>
  <circle cx="95" cy="445" r="22" fill="url(#barFill)" filter="url(#shadowSm)"/>
  <text x="95" y="452" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">3</text>
  <text x="130" y="438" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" font-weight="700" fill="#1E1B4B">학습 데이터 투명성 요구</text>
  <text x="130" y="462" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#4338CA">원작자 동의·보상 체계 마련 논의</text>

  <line x1="400" y1="445" x2="440" y2="445" stroke="#0D9488" stroke-width="3"/>
  <path d="M432,438 L444,445 L432,452 Z" fill="#0D9488"/>

  <circle cx="490" cy="445" r="22" fill="url(#barFill)" filter="url(#shadowSm)"/>
  <text x="490" y="452" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">→</text>
  <text x="525" y="438" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" font-weight="700" fill="#134E4A">해외 가이드라인 참고</text>
  <text x="525" y="462" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#0F766E">미국·EU 동향 기반 국내 제도 정비</text>

  <rect x="80" y="500" width="640" height="32" rx="16" fill="url(#barFill)" fill-opacity="0.85"/>
  <text x="400" y="522" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">창작자 보호와 AI 활용, 균형점을 찾는 과정</text>
</svg>
