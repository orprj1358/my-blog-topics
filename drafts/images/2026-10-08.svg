<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730A3"/>
      <stop offset="55%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A5F3FC" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#A5F3FC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C7D2FE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C7D2FE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1020" cy="120" r="260" fill="url(#glow1)"/>
  <circle cx="140" cy="520" r="280" fill="url(#glow2)"/>

  <!-- decorative network motif, right side -->
  <g opacity="0.55">
    <line x1="840" y1="460" x2="950" y2="380" stroke="#E0E7FF" stroke-width="2"/>
    <line x1="950" y1="380" x2="1060" y2="430" stroke="#E0E7FF" stroke-width="2"/>
    <line x1="950" y1="380" x2="980" y2="260" stroke="#E0E7FF" stroke-width="2"/>
    <line x1="1060" y1="430" x2="1110" y2="330" stroke="#E0E7FF" stroke-width="2"/>
    <line x1="980" y1="260" x2="1110" y2="330" stroke="#E0E7FF" stroke-width="2"/>
    <circle cx="840" cy="460" r="10" fill="#A7F3D0"/>
    <circle cx="950" cy="380" r="14" fill="#5EEAD4"/>
    <circle cx="1060" cy="430" r="10" fill="#A7F3D0"/>
    <circle cx="980" cy="260" r="10" fill="#A7F3D0"/>
    <circle cx="1110" cy="330" r="14" fill="#5EEAD4"/>
  </g>

  <!-- simple chip icon -->
  <g transform="translate(905,470)" opacity="0.9">
    <rect x="0" y="0" width="90" height="90" rx="16" fill="#FFFFFF" fill-opacity="0.14"/>
    <rect x="18" y="18" width="54" height="54" rx="8" fill="none" stroke="#ECFEFF" stroke-width="3"/>
    <circle cx="45" cy="45" r="10" fill="#ECFEFF"/>
    <line x1="45" y1="4" x2="45" y2="18" stroke="#ECFEFF" stroke-width="3"/>
    <line x1="45" y1="72" x2="45" y2="86" stroke="#ECFEFF" stroke-width="3"/>
    <line x1="4" y1="45" x2="18" y2="45" stroke="#ECFEFF" stroke-width="3"/>
    <line x1="72" y1="45" x2="86" y2="45" stroke="#ECFEFF" stroke-width="3"/>
  </g>

  <!-- left label badge -->
  <g transform="translate(80,80)">
    <rect width="190" height="46" rx="23" fill="url(#card)" stroke="#E0E7FF" stroke-opacity="0.35"/>
    <text x="95" y="30" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#ECFEFF">AI 소식</text>
  </g>

  <!-- title -->
  <text x="80" y="300" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="56" font-weight="800" fill="#FFFFFF">생성형 AI 저작권,</text>
  <text x="80" y="372" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="56" font-weight="800" fill="#FFFFFF">기준이 필요하다</text>
  <text x="82" y="430" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="24" font-weight="500" fill="#D1FAE5" opacity="0.9">창작자와 이용자 모두를 위한 가이드라인 논의</text>
</svg>
