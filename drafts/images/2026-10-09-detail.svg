<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fdebd3"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fde8cf"/>
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="card4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7c2d12" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="45" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7c2d12" text-anchor="middle">가계대출 총량관리, 연말에 다가가는 과정</text>
  <text x="400" y="68" font-family="Arial, sans-serif" font-size="13" fill="#9a3412" text-anchor="middle" opacity="0.85">(예시 구성 · 실제 시기·조치는 은행·시기별로 다를 수 있음)</text>

  <!-- Step 1 -->
  <g filter="url(#softShadow)">
    <rect x="70" y="92" width="660" height="92" rx="18" fill="url(#card1)"/>
  </g>
  <circle cx="122" cy="138" r="27" fill="url(#badgeGrad)"/>
  <text x="122" y="147" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="165" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#7c2d12">금융당국, 연간 대출 증가 목표 설정</text>
  <text x="165" y="156" font-family="Arial, sans-serif" font-size="14" fill="#9a3412">은행권 전체의 가계대출 증가 속도 관리 기준 마련</text>

  <path d="M 400 184 L 400 214" stroke="url(#arrowGrad)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 388 206 L 400 222 L 412 206" fill="none" stroke="url(#arrowGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 2 -->
  <g filter="url(#softShadow)">
    <rect x="70" y="222" width="660" height="92" rx="18" fill="url(#card2)"/>
  </g>
  <circle cx="122" cy="268" r="27" fill="url(#badgeGrad)"/>
  <text x="122" y="277" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="165" y="260" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#7c2d12">은행별 한도 배분 및 자체 관리 시작</text>
  <text x="165" y="286" font-family="Arial, sans-serif" font-size="14" fill="#9a3412">각 은행이 목표치 안에서 대출 증가 속도 조절</text>

  <path d="M 400 314 L 400 344" stroke="url(#arrowGrad)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 388 336 L 400 352 L 412 336" fill="none" stroke="url(#arrowGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 3 -->
  <g filter="url(#softShadow)">
    <rect x="70" y="352" width="660" height="92" rx="18" fill="url(#card3)"/>
  </g>
  <circle cx="122" cy="398" r="27" fill="url(#badgeGrad)"/>
  <text x="122" y="407" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="165" y="390" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#7c2d12">연말 목표치 근접</text>
  <text x="165" y="416" font-family="Arial, sans-serif" font-size="14" fill="#9a3412">일부 은행, 설정해둔 연간 한도 소진에 가까워짐</text>

  <path d="M 400 444 L 400 474" stroke="url(#arrowGrad)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 388 466 L 400 482 L 412 466" fill="none" stroke="url(#arrowGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 4 -->
  <g filter="url(#softShadow)">
    <rect x="70" y="482" width="660" height="92" rx="18" fill="url(#card4)"/>
  </g>
  <circle cx="122" cy="528" r="27" fill="url(#badgeGrad)"/>
  <text x="122" y="537" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="165" y="520" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#7c2d12">창구 문턱 상향</text>
  <text x="165" y="546" font-family="Arial, sans-serif" font-size="14" fill="#9a3412">한도 축소·우대금리 축소·일부 상품 판매 중단 등</text>
</svg>
