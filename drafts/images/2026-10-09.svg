<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b1708"/>
      <stop offset="50%" stop-color="#5c2e0e"/>
      <stop offset="100%" stop-color="#7c3a0f"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="630" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="630" fill="url(#bg)"/>
    <circle cx="990" cy="170" r="300" fill="url(#glow1)"/>
    <circle cx="1060" cy="470" r="230" fill="url(#glow2)"/>

    <!-- gauge / meter representing 총량 한도 -->
    <g opacity="0.95">
      <circle cx="1010" cy="300" r="110" fill="none" stroke="#fff7ed" stroke-opacity="0.18" stroke-width="22"/>
      <path d="M 1010 190 A 110 110 0 1 1 915 360" fill="none" stroke="url(#barGrad)" stroke-width="22" stroke-linecap="round"/>
      <text x="1010" y="292" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff7ed" text-anchor="middle">한도</text>
      <text x="1010" y="326" font-family="Arial, sans-serif" font-size="20" fill="#fed7aa" text-anchor="middle">임박</text>
    </g>

    <!-- coin / percent badge -->
    <g opacity="0.95">
      <circle cx="1040" cy="500" r="66" fill="url(#coinGrad)"/>
      <circle cx="1040" cy="500" r="66" fill="none" stroke="#fff7ed" stroke-opacity="0.35" stroke-width="3"/>
      <text x="1040" y="514" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#5c3414" text-anchor="middle">%</text>
    </g>

    <!-- small badge accent -->
    <g opacity="0.9">
      <circle cx="900" cy="480" r="28" fill="url(#tagGrad)"/>
      <text x="900" y="488" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#7c2d12" text-anchor="middle">↓</text>
    </g>

    <!-- subtle rounded frame line -->
    <rect x="40" y="40" width="1120" height="550" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

    <!-- title text -->
    <text x="80" y="250" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#fff7ed">연말 가계대출</text>
    <text x="80" y="318" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#fff7ed">총량관리 재가동</text>
    <text x="80" y="370" font-family="Arial, sans-serif" font-size="26" fill="#fdba74" opacity="0.95">은행 창구 문턱, 다시 높아지나</text>
  </g>
</svg>
