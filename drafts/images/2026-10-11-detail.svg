<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="headerGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="headerGradR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="cardL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="cardR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#99f6e4"/>
    </linearGradient>
    <linearGradient id="badgeGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="badgeGradR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#312e81" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="42" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#312e81" text-anchor="middle">챗봇형 AI와 AI 에이전트, 무엇이 다른가</text>
  <text x="400" y="64" font-family="Arial, sans-serif" font-size="13" fill="#4338ca" text-anchor="middle" opacity="0.85">(개념 비교를 위한 예시 구성)</text>

  <!-- column headers -->
  <g filter="url(#softShadow)">
    <rect x="60" y="86" width="310" height="48" rx="14" fill="url(#headerGradL)"/>
    <rect x="430" y="86" width="310" height="48" rx="14" fill="url(#headerGradR)"/>
  </g>
  <text x="215" y="116" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">챗봇형 AI</text>
  <text x="585" y="116" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">AI 에이전트</text>

  <!-- Row 1: 응답 방식 -->
  <g filter="url(#softShadow)">
    <rect x="60" y="150" width="310" height="86" rx="16" fill="url(#cardL)"/>
    <rect x="430" y="150" width="310" height="86" rx="16" fill="url(#cardR)"/>
  </g>
  <circle cx="100" cy="193" r="22" fill="url(#badgeGradL)"/>
  <text x="100" y="200" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="134" y="186" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#334155">응답 방식</text>
  <text x="134" y="208" font-family="Arial, sans-serif" font-size="13" fill="#475569">한 번 질문, 한 번 답변</text>

  <circle cx="470" cy="193" r="22" fill="url(#badgeGradR)"/>
  <text x="470" y="200" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="504" y="186" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#312e81">응답 방식</text>
  <text x="504" y="208" font-family="Arial, sans-serif" font-size="13" fill="#4338ca">목표를 받아 단계별로 진행</text>

  <!-- Row 2: 작업 수행 범위 -->
  <g filter="url(#softShadow)">
    <rect x="60" y="250" width="310" height="86" rx="16" fill="url(#cardL)"/>
    <rect x="430" y="250" width="310" height="86" rx="16" fill="url(#cardR)"/>
  </g>
  <circle cx="100" cy="293" r="22" fill="url(#badgeGradL)"/>
  <text x="100" y="300" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="134" y="286" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#334155">작업 수행 범위</text>
  <text x="134" y="308" font-family="Arial, sans-serif" font-size="13" fill="#475569">정보 제공·대화 중심</text>

  <circle cx="470" cy="293" r="22" fill="url(#badgeGradR)"/>
  <text x="470" y="300" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="504" y="286" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#312e81">작업 수행 범위</text>
  <text x="504" y="308" font-family="Arial, sans-serif" font-size="13" fill="#4338ca">검색·실행까지 이어서 처리</text>

  <!-- Row 3: 필요한 개입 -->
  <g filter="url(#softShadow)">
    <rect x="60" y="350" width="310" height="86" rx="16" fill="url(#cardL)"/>
    <rect x="430" y="350" width="310" height="86" rx="16" fill="url(#cardR)"/>
  </g>
  <circle cx="100" cy="393" r="22" fill="url(#badgeGradL)"/>
  <text x="100" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="134" y="386" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#334155">필요한 개입</text>
  <text x="134" y="408" font-family="Arial, sans-serif" font-size="13" fill="#475569">매 단계 사람이 직접 지시</text>

  <circle cx="470" cy="393" r="22" fill="url(#badgeGradR)"/>
  <text x="470" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="504" y="386" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#312e81">필요한 개입</text>
  <text x="504" y="408" font-family="Arial, sans-serif" font-size="13" fill="#4338ca">중요 결정 시점에만 확인</text>

  <!-- Row 4: 대표 활용 사례 -->
  <g filter="url(#softShadow)">
    <rect x="60" y="450" width="310" height="86" rx="16" fill="url(#cardL)"/>
    <rect x="430" y="450" width="310" height="86" rx="16" fill="url(#cardR)"/>
  </g>
  <circle cx="100" cy="493" r="22" fill="url(#badgeGradL)"/>
  <text x="100" y="500" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="134" y="486" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#334155">대표 활용 사례</text>
  <text x="134" y="508" font-family="Arial, sans-serif" font-size="13" fill="#475569">질의응답, 요약, 번역</text>

  <circle cx="470" cy="493" r="22" fill="url(#badgeGradR)"/>
  <text x="470" y="500" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="504" y="486" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#312e81">대표 활용 사례</text>
  <text x="504" y="508" font-family="Arial, sans-serif" font-size="13" fill="#4338ca">문서 작성, 예약, 일정 관리</text>

  <!-- arrow between columns -->
  <path d="M 378 193 L 420 193" stroke="#4f46e5" stroke-width="5" stroke-linecap="round"/>
  <path d="M 410 183 L 422 193 L 410 203" fill="none" stroke="#4f46e5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
