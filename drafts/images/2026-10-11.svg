<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99f6e4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="630" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="630" fill="url(#bg)"/>
    <circle cx="980" cy="160" r="300" fill="url(#glow1)"/>
    <circle cx="1030" cy="470" r="230" fill="url(#glow2)"/>

    <!-- network nodes connected to a central chip, representing an AI agent orchestrating tasks -->
    <g opacity="0.95">
      <line x1="1000" y1="330" x2="900" y2="250" stroke="#99f6e4" stroke-width="3" opacity="0.6"/>
      <line x1="1000" y1="330" x2="1110" y2="260" stroke="#99f6e4" stroke-width="3" opacity="0.6"/>
      <line x1="1000" y1="330" x2="910" y2="420" stroke="#99f6e4" stroke-width="3" opacity="0.6"/>
      <line x1="1000" y1="330" x2="1100" y2="430" stroke="#99f6e4" stroke-width="3" opacity="0.6"/>

      <rect x="945" y="280" width="110" height="100" rx="20" fill="url(#chipGrad)"/>
      <rect x="970" y="305" width="60" height="50" rx="8" fill="#1e1b4b" opacity="0.5"/>

      <circle cx="900" cy="250" r="22" fill="url(#nodeGrad)"/>
      <circle cx="1110" cy="260" r="22" fill="url(#nodeGrad)"/>
      <circle cx="910" cy="420" r="22" fill="url(#nodeGrad)"/>
      <circle cx="1100" cy="430" r="22" fill="url(#nodeGrad)"/>
    </g>

    <!-- small accent badge -->
    <g opacity="0.9">
      <circle cx="860" cy="470" r="24" fill="url(#badgeGrad)"/>
      <text x="860" y="478" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#312e81" text-anchor="middle">AI</text>
    </g>

    <!-- subtle rounded frame line -->
    <rect x="40" y="40" width="1120" height="550" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

    <!-- title text -->
    <text x="80" y="250" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#eef2ff">AI 에이전트 확산</text>
    <text x="80" y="318" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#eef2ff">일상과 업무는?</text>
    <text x="80" y="370" font-family="Arial, sans-serif" font-size="26" fill="#99f6e4" opacity="0.95">스스로 일을 처리하는 AI, 어디까지 왔나</text>
  </g>
</svg>
