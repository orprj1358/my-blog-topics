<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="headerGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6d3d1"/>
      <stop offset="100%" stop-color="#a8a29e"/>
    </linearGradient>
    <linearGradient id="headerGradR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="cardL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e7e5e4"/>
    </linearGradient>
    <linearGradient id="cardR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="badgeGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e7e5e4"/>
      <stop offset="100%" stop-color="#a8a29e"/>
    </linearGradient>
    <linearGradient id="badgeGradR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7c2d12" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="42" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#7c2d12" text-anchor="middle">정책서민금융, 무엇이 달라질 수 있나</text>
  <text x="400" y="64" font-family="Arial, sans-serif" font-size="13" fill="#9a3412" text-anchor="middle" opacity="0.85">(예시 구성 · 실제 세부 기준은 발표 전까지 확정되지 않음)</text>

  <!-- column headers -->
  <g filter="url(#softShadow)">
    <rect x="60" y="86" width="310" height="48" rx="14" fill="url(#headerGradL)"/>
    <rect x="430" y="86" width="310" height="48" rx="14" fill="url(#headerGradR)"/>
  </g>
  <text x="215" y="116" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">현재</text>
  <text x="585" y="116" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">확대 검토안</text>

  <!-- Row 1: 공급 한도 -->
  <g filter="url(#softShadow)">
    <rect x="60" y="150" width="310" height="86" rx="16" fill="url(#cardL)"/>
    <rect x="430" y="150" width="310" height="86" rx="16" fill="url(#cardR)"/>
  </g>
  <circle cx="100" cy="193" r="22" fill="url(#badgeGradL)"/>
  <text x="100" y="200" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="134" y="186" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#44403c">공급 한도</text>
  <text x="134" y="208" font-family="Arial, sans-serif" font-size="13" fill="#57534e">예산 안에서 제한적 운영</text>

  <circle cx="470" cy="193" r="22" fill="url(#badgeGradR)"/>
  <text x="470" y="200" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="504" y="186" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#7c2d12">공급 한도</text>
  <text x="504" y="208" font-family="Arial, sans-serif" font-size="13" fill="#c2410c">지원 규모 확대 검토</text>

  <!-- Row 2: 신청 시기 -->
  <g filter="url(#softShadow)">
    <rect x="60" y="250" width="310" height="86" rx="16" fill="url(#cardL)"/>
    <rect x="430" y="250" width="310" height="86" rx="16" fill="url(#cardR)"/>
  </g>
  <circle cx="100" cy="293" r="22" fill="url(#badgeGradL)"/>
  <text x="100" y="300" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="134" y="286" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#44403c">신청 시기</text>
  <text x="134" y="308" font-family="Arial, sans-serif" font-size="13" fill="#57534e">상반기 중 한도 조기 소진</text>

  <circle cx="470" cy="293" r="22" fill="url(#badgeGradR)"/>
  <text x="470" y="300" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="504" y="286" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#7c2d12">신청 시기</text>
  <text x="504" y="308" font-family="Arial, sans-serif" font-size="13" fill="#c2410c">연중 신청 여력 확보 기대</text>

  <!-- Row 3: 대상 기준 -->
  <g filter="url(#softShadow)">
    <rect x="60" y="350" width="310" height="86" rx="16" fill="url(#cardL)"/>
    <rect x="430" y="350" width="310" height="86" rx="16" fill="url(#cardR)"/>
  </g>
  <circle cx="100" cy="393" r="22" fill="url(#badgeGradL)"/>
  <text x="100" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="134" y="386" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#44403c">대상 기준</text>
  <text x="134" y="408" font-family="Arial, sans-serif" font-size="13" fill="#57534e">일부 저신용·저소득 가구 제외</text>

  <circle cx="470" cy="393" r="22" fill="url(#badgeGradR)"/>
  <text x="470" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="504" y="386" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#7c2d12">대상 기준</text>
  <text x="504" y="408" font-family="Arial, sans-serif" font-size="13" fill="#c2410c">소득·신용 기준 완화 검토</text>

  <!-- Row 4: 재원 마련 -->
  <g filter="url(#softShadow)">
    <rect x="60" y="450" width="310" height="86" rx="16" fill="url(#cardL)"/>
    <rect x="430" y="450" width="310" height="86" rx="16" fill="url(#cardR)"/>
  </g>
  <circle cx="100" cy="493" r="22" fill="url(#badgeGradL)"/>
  <text x="100" y="500" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="134" y="486" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#44403c">재원 마련</text>
  <text x="134" y="508" font-family="Arial, sans-serif" font-size="13" fill="#57534e">정부·금융권 분담 비율 고정적</text>

  <circle cx="470" cy="493" r="22" fill="url(#badgeGradR)"/>
  <text x="470" y="500" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="504" y="486" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#7c2d12">재원 마련</text>
  <text x="504" y="508" font-family="Arial, sans-serif" font-size="13" fill="#c2410c">분담 비율 등 예산 협의 필요</text>

  <!-- arrow between columns -->
  <path d="M 378 193 L 420 193" stroke="#fb923c" stroke-width="5" stroke-linecap="round"/>
  <path d="M 410 183 L 422 193 L 410 203" fill="none" stroke="#fb923c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
