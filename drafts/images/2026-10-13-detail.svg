<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="headerGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6d3d1"/>
      <stop offset="100%" stop-color="#a8a29e"/>
    </linearGradient>
    <linearGradient id="headerGradR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cardL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e7e5e4"/>
    </linearGradient>
    <linearGradient id="cardR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="badgeGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e7e5e4"/>
      <stop offset="100%" stop-color="#a8a29e"/>
    </linearGradient>
    <linearGradient id="badgeGradR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1e3a5f" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="42" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1e3a5f" text-anchor="middle">3기 신도시 추가 지정, 무엇이 달라질 수 있나</text>
  <text x="400" y="64" font-family="Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" opacity="0.85">(예시 구성 · 실제 후보지·일정은 발표 전까지 확정되지 않음)</text>

  <!-- column headers -->
  <g filter="url(#softShadow)">
    <rect x="60" y="86" width="310" height="48" rx="14" fill="url(#headerGradL)"/>
    <rect x="430" y="86" width="310" height="48" rx="14" fill="url(#headerGradR)"/>
  </g>
  <text x="215" y="116" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">현재</text>
  <text x="585" y="116" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">추가 지정 검토안</text>

  <!-- Row 1: 공급 물량 -->
  <g filter="url(#softShadow)">
    <rect x="60" y="150" width="310" height="86" rx="16" fill="url(#cardL)"/>
    <rect x="430" y="150" width="310" height="86" rx="16" fill="url(#cardR)"/>
  </g>
  <circle cx="100" cy="193" r="22" fill="url(#badgeGradL)"/>
  <text x="100" y="200" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="134" y="186" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#44403c">공급 물량</text>
  <text x="134" y="208" font-family="Arial, sans-serif" font-size="13" fill="#57534e">기존 3기 신도시 물량에 한정</text>

  <circle cx="470" cy="193" r="22" fill="url(#badgeGradR)"/>
  <text x="470" y="200" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="504" y="186" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e3a5f">공급 물량</text>
  <text x="504" y="208" font-family="Arial, sans-serif" font-size="13" fill="#1d4ed8">신규 택지 추가로 물량 확대 검토</text>

  <!-- Row 2: 사업 속도 -->
  <g filter="url(#softShadow)">
    <rect x="60" y="250" width="310" height="86" rx="16" fill="url(#cardL)"/>
    <rect x="430" y="250" width="310" height="86" rx="16" fill="url(#cardR)"/>
  </g>
  <circle cx="100" cy="293" r="22" fill="url(#badgeGradL)"/>
  <text x="100" y="300" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="134" y="286" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#44403c">사업 속도</text>
  <text x="134" y="308" font-family="Arial, sans-serif" font-size="13" fill="#57534e">보상·착공 지연 누적</text>

  <circle cx="470" cy="293" r="22" fill="url(#badgeGradR)"/>
  <text x="470" y="300" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="504" y="286" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e3a5f">사업 속도</text>
  <text x="504" y="308" font-family="Arial, sans-serif" font-size="13" fill="#1d4ed8">행정절차 간소화 병행 논의</text>

  <!-- Row 3: 후보지 범위 -->
  <g filter="url(#softShadow)">
    <rect x="60" y="350" width="310" height="86" rx="16" fill="url(#cardL)"/>
    <rect x="430" y="350" width="310" height="86" rx="16" fill="url(#cardR)"/>
  </g>
  <circle cx="100" cy="393" r="22" fill="url(#badgeGradL)"/>
  <text x="100" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="134" y="386" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#44403c">후보지 범위</text>
  <text x="134" y="408" font-family="Arial, sans-serif" font-size="13" fill="#57534e">기존 지정 지역에 한정</text>

  <circle cx="470" cy="393" r="22" fill="url(#badgeGradR)"/>
  <text x="470" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="504" y="386" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e3a5f">후보지 범위</text>
  <text x="504" y="408" font-family="Arial, sans-serif" font-size="13" fill="#1d4ed8">교통망 연계 신규 입지 검토</text>

  <!-- Row 4: 교통 인프라 -->
  <g filter="url(#softShadow)">
    <rect x="60" y="450" width="310" height="86" rx="16" fill="url(#cardL)"/>
    <rect x="430" y="450" width="310" height="86" rx="16" fill="url(#cardR)"/>
  </g>
  <circle cx="100" cy="493" r="22" fill="url(#badgeGradL)"/>
  <text x="100" y="500" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="134" y="486" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#44403c">교통 인프라</text>
  <text x="134" y="508" font-family="Arial, sans-serif" font-size="13" fill="#57534e">일부 노선 개통 지연</text>

  <circle cx="470" cy="493" r="22" fill="url(#badgeGradR)"/>
  <text x="470" y="500" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="504" y="486" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e3a5f">교통 인프라</text>
  <text x="504" y="508" font-family="Arial, sans-serif" font-size="13" fill="#1d4ed8">광역교통 대책 동시 수립 논의</text>

  <!-- arrow between columns -->
  <path d="M 378 193 L 420 193" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>
  <path d="M 410 183 L 422 193 L 410 203" fill="none" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
