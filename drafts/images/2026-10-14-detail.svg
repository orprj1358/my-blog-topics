<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="headerGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="headerGradR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="cardL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="cardR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="badgeGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="badgeGradR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99f6e4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#312e81" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="42" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#312e81" text-anchor="middle">클라우드 AI와 온디바이스 AI, 무엇이 다를까</text>
  <text x="400" y="64" font-family="Arial, sans-serif" font-size="13" fill="#0d9488" text-anchor="middle" opacity="0.9">(예시 구성 · 실제 기능 범위는 기기·제조사별로 다름)</text>

  <!-- column headers -->
  <g filter="url(#softShadow)">
    <rect x="60" y="86" width="310" height="48" rx="14" fill="url(#headerGradL)"/>
    <rect x="430" y="86" width="310" height="48" rx="14" fill="url(#headerGradR)"/>
  </g>
  <text x="215" y="116" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">클라우드 AI</text>
  <text x="585" y="116" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">온디바이스 AI</text>

  <!-- Row 1: 데이터 처리 위치 -->
  <g filter="url(#softShadow)">
    <rect x="60" y="150" width="310" height="86" rx="16" fill="url(#cardL)"/>
    <rect x="430" y="150" width="310" height="86" rx="16" fill="url(#cardR)"/>
  </g>
  <circle cx="100" cy="193" r="22" fill="url(#badgeGradL)"/>
  <text x="100" y="200" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="134" y="186" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#312e81">데이터 처리 위치</text>
  <text x="134" y="208" font-family="Arial, sans-serif" font-size="13" fill="#4338ca">외부 서버로 전송 후 처리</text>

  <circle cx="470" cy="193" r="22" fill="url(#badgeGradR)"/>
  <text x="470" y="200" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="504" y="186" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#134e4a">데이터 처리 위치</text>
  <text x="504" y="208" font-family="Arial, sans-serif" font-size="13" fill="#0f766e">기기 내부 칩에서 직접 처리</text>

  <!-- Row 2: 연산 능력 -->
  <g filter="url(#softShadow)">
    <rect x="60" y="250" width="310" height="86" rx="16" fill="url(#cardL)"/>
    <rect x="430" y="250" width="310" height="86" rx="16" fill="url(#cardR)"/>
  </g>
  <circle cx="100" cy="293" r="22" fill="url(#badgeGradL)"/>
  <text x="100" y="300" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="134" y="286" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#312e81">연산 능력</text>
  <text x="134" y="308" font-family="Arial, sans-serif" font-size="13" fill="#4338ca">대규모 연산, 복잡한 작업에 강점</text>

  <circle cx="470" cy="293" r="22" fill="url(#badgeGradR)"/>
  <text x="470" y="300" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="504" y="286" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#134e4a">연산 능력</text>
  <text x="504" y="308" font-family="Arial, sans-serif" font-size="13" fill="#0f766e">기기 성능 범위 내에서 처리</text>

  <!-- Row 3: 개인정보 노출 -->
  <g filter="url(#softShadow)">
    <rect x="60" y="350" width="310" height="86" rx="16" fill="url(#cardL)"/>
    <rect x="430" y="350" width="310" height="86" rx="16" fill="url(#cardR)"/>
  </g>
  <circle cx="100" cy="393" r="22" fill="url(#badgeGradL)"/>
  <text x="100" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="134" y="386" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#312e81">개인정보 노출</text>
  <text x="134" y="408" font-family="Arial, sans-serif" font-size="13" fill="#4338ca">민감 정보가 서버를 거칠 수 있음</text>

  <circle cx="470" cy="393" r="22" fill="url(#badgeGradR)"/>
  <text x="470" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="504" y="386" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#134e4a">개인정보 노출</text>
  <text x="504" y="408" font-family="Arial, sans-serif" font-size="13" fill="#0f766e">외부 전송 최소화, 일부 기능은 예외</text>

  <!-- Row 4: 사용 조건 -->
  <g filter="url(#softShadow)">
    <rect x="60" y="450" width="310" height="86" rx="16" fill="url(#cardL)"/>
    <rect x="430" y="450" width="310" height="86" rx="16" fill="url(#cardR)"/>
  </g>
  <circle cx="100" cy="493" r="22" fill="url(#badgeGradL)"/>
  <text x="100" y="500" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="134" y="486" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#312e81">사용 조건</text>
  <text x="134" y="508" font-family="Arial, sans-serif" font-size="13" fill="#4338ca">네트워크 연결 필요</text>

  <circle cx="470" cy="493" r="22" fill="url(#badgeGradR)"/>
  <text x="470" y="500" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="504" y="486" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#134e4a">사용 조건</text>
  <text x="504" y="508" font-family="Arial, sans-serif" font-size="13" fill="#0f766e">오프라인에서도 일부 기능 사용 가능</text>

  <!-- arrow between columns -->
  <path d="M 378 193 L 420 193" stroke="#14b8a6" stroke-width="5" stroke-linecap="round"/>
  <path d="M 410 183 L 422 193 L 410 203" fill="none" stroke="#14b8a6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
