<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fcd34d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fcd34d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="630" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="630" fill="url(#bg)"/>
    <circle cx="990" cy="160" r="300" fill="url(#glow1)"/>
    <circle cx="1030" cy="480" r="240" fill="url(#glow2)"/>

    <!-- rising trend line motif -->
    <g opacity="0.55" stroke="#fde68a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 850 440 L 910 390 L 960 410 L 1010 340 L 1070 300"/>
    </g>
    <g fill="#fef3c7">
      <circle cx="850" cy="440" r="6"/>
      <circle cx="910" cy="390" r="6"/>
      <circle cx="960" cy="410" r="6"/>
      <circle cx="1010" cy="340" r="6"/>
      <circle cx="1070" cy="300" r="7"/>
    </g>
    <path d="M 1055 290 L 1070 300 L 1078 283" fill="none" stroke="#fde68a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- bank card -->
    <rect x="860" y="430" width="230" height="140" rx="20" fill="url(#cardGrad)" opacity="0.95"/>
    <rect x="884" y="458" width="46" height="32" rx="6" fill="#ea580c" opacity="0.85"/>
    <rect x="884" y="505" width="140" height="10" rx="5" fill="#b45309" opacity="0.6"/>
    <rect x="884" y="525" width="90" height="10" rx="5" fill="#b45309" opacity="0.4"/>

    <!-- coin badge -->
    <g>
      <circle cx="1040" cy="470" r="46" fill="url(#coinGrad)"/>
      <text x="1040" y="483" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#7c2d12" text-anchor="middle">%</text>
    </g>

    <!-- percent badge top -->
    <g>
      <circle cx="900" cy="250" r="34" fill="url(#badgeGrad)"/>
      <text x="900" y="261" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#fff7ed" text-anchor="middle">%</text>
    </g>

    <!-- subtle rounded frame line -->
    <rect x="40" y="40" width="1120" height="550" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>

    <!-- title text -->
    <text x="80" y="250" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#fff7ed">마이너스통장 금리 오름세</text>
    <text x="80" y="318" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#fff7ed">생활자금 전략 다시 짜기</text>
    <text x="80" y="370" font-family="Arial, sans-serif" font-size="25" fill="#fde68a" opacity="0.95">한도대출, 지금 점검해봐야 할 것들</text>
  </g>
</svg>
