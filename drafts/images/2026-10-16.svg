<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fcd34d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fcd34d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="coinGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="coinGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="630" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="630" fill="url(#bg)"/>
    <circle cx="990" cy="160" r="300" fill="url(#glow1)"/>
    <circle cx="1030" cy="480" r="240" fill="url(#glow2)"/>

    <!-- switching / refresh motif between two coin badges -->
    <circle cx="870" cy="440" r="54" fill="url(#coinGradA)"/>
    <text x="870" y="454" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#7c2d12" text-anchor="middle">%</text>

    <circle cx="1060" cy="440" r="54" fill="url(#coinGradB)"/>
    <text x="1060" y="454" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle">%</text>

    <g stroke="#fef3c7" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M 935 410 A 70 70 0 0 1 995 400"/>
      <path d="M 995 470 A 70 70 0 0 1 935 480"/>
    </g>
    <path d="M 982 388 L 998 400 L 984 412" fill="none" stroke="#fef3c7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 948 492 L 932 480 L 946 468" fill="none" stroke="#fef3c7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- small bank card -->
    <rect x="850" y="520" width="230" height="70" rx="16" fill="url(#cardGrad)" opacity="0.95"/>
    <rect x="872" y="538" width="38" height="26" rx="5" fill="#ea580c" opacity="0.85"/>
    <rect x="872" y="572" width="120" height="8" rx="4" fill="#b45309" opacity="0.6"/>

    <!-- title text -->
    <text x="80" y="260" font-family="Arial, sans-serif" font-size="54" font-weight="800" fill="#ffffff">대출 갈아타기,</text>
    <text x="80" y="330" font-family="Arial, sans-serif" font-size="54" font-weight="800" fill="#fef3c7">더 쉬워진다</text>
    <text x="80" y="380" font-family="Arial, sans-serif" font-size="22" fill="#fed7aa" opacity="0.9">대출 비교·갈아타기 서비스 확대</text>
  </g>
</svg>
