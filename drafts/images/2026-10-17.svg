<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="houseGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="630" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="630" fill="url(#bg)"/>
    <circle cx="990" cy="150" r="300" fill="url(#glow1)"/>
    <circle cx="1020" cy="470" r="240" fill="url(#glow2)"/>

    <!-- simple flat house silhouettes -->
    <g>
      <polygon points="930,330 1000,270 1070,330" fill="url(#houseGrad2)" opacity="0.95"/>
      <rect x="945" y="330" width="110" height="90" rx="6" fill="url(#houseGrad2)" opacity="0.95"/>
      <rect x="985" y="368" width="30" height="52" rx="4" fill="#1e3a8a" opacity="0.5"/>
    </g>
    <g>
      <polygon points="1040,300 1095,255 1150,300" fill="url(#houseGrad)" opacity="0.9"/>
      <rect x="1052" y="300" width="86" height="72" rx="6" fill="url(#houseGrad)" opacity="0.9"/>
      <rect x="1082" y="330" width="24" height="42" rx="4" fill="#1e40af" opacity="0.45"/>
    </g>

    <!-- small info card -->
    <rect x="850" y="470" width="230" height="78" rx="16" fill="url(#cardGrad)" opacity="0.95"/>
    <circle cx="884" cy="500" r="16" fill="#3b82f6"/>
    <text x="884" y="505" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">%</text>
    <rect x="912" y="493" width="140" height="8" rx="4" fill="#1d4ed8" opacity="0.55"/>
    <rect x="912" y="513" width="100" height="8" rx="4" fill="#1d4ed8" opacity="0.3"/>

    <!-- title text -->
    <text x="80" y="250" font-family="Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff">종부세 개편 논의,</text>
    <text x="80" y="318" font-family="Arial, sans-serif" font-size="52" font-weight="800" fill="#bfdbfe">다시 뜨거워지다</text>
    <text x="80" y="368" font-family="Arial, sans-serif" font-size="22" fill="#dbeafe" opacity="0.9">다주택자 종합부동산세 개편 논의 재부상</text>
  </g>
</svg>
