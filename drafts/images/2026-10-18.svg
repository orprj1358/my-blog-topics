<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>

  <circle cx="930" cy="150" r="220" fill="url(#glow2)"/>
  <circle cx="200" cy="480" r="260" fill="url(#glow1)"/>

  <!-- decorative network motif, right side -->
  <g opacity="0.9">
    <circle cx="940" cy="330" r="10" fill="#5eead4"/>
    <circle cx="1040" cy="260" r="7" fill="#a5b4fc"/>
    <circle cx="1030" cy="410" r="7" fill="#a5b4fc"/>
    <circle cx="880" cy="420" r="6" fill="#5eead4"/>
    <circle cx="1090" cy="340" r="6" fill="#5eead4"/>
    <line x1="940" y1="330" x2="1040" y2="260" stroke="#a5f3fc" stroke-width="2" opacity="0.6"/>
    <line x1="940" y1="330" x2="1030" y2="410" stroke="#a5f3fc" stroke-width="2" opacity="0.6"/>
    <line x1="940" y1="330" x2="880" y2="420" stroke="#a5f3fc" stroke-width="2" opacity="0.6"/>
    <line x1="1030" y1="410" x2="1090" y2="340" stroke="#a5f3fc" stroke-width="2" opacity="0.6"/>
    <line x1="1040" y1="260" x2="1090" y2="340" stroke="#a5f3fc" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- chip icon, simple flat rounded square with pins -->
  <g transform="translate(120,140)">
    <rect x="0" y="0" width="150" height="150" rx="22" fill="url(#chip)" opacity="0.92"/>
    <rect x="34" y="34" width="82" height="82" rx="12" fill="#1e1b4b" opacity="0.85"/>
    <rect x="54" y="54" width="42" height="42" rx="6" fill="#5eead4" opacity="0.9"/>
    <g stroke="#1e1b4b" stroke-width="4" opacity="0.85">
      <line x1="0" y1="40" x2="-16" y2="40"/>
      <line x1="0" y1="75" x2="-16" y2="75"/>
      <line x1="0" y1="110" x2="-16" y2="110"/>
      <line x1="150" y1="40" x2="166" y2="40"/>
      <line x1="150" y1="75" x2="166" y2="75"/>
      <line x1="150" y1="110" x2="166" y2="110"/>
      <line x1="40" y1="0" x2="40" y2="-16"/>
      <line x1="75" y1="0" x2="75" y2="-16"/>
      <line x1="110" y1="0" x2="110" y2="-16"/>
      <line x1="40" y1="150" x2="40" y2="166"/>
      <line x1="75" y1="150" x2="75" y2="166"/>
      <line x1="110" y1="150" x2="110" y2="166"/>
    </g>
  </g>

  <!-- rounded "browser" card silhouette -->
  <g transform="translate(140,340)" opacity="0.95">
    <rect x="0" y="0" width="190" height="130" rx="18" fill="#0f172a" opacity="0.55"/>
    <rect x="0" y="0" width="190" height="34" rx="18" fill="#5eead4" opacity="0.35"/>
    <circle cx="20" cy="17" r="5" fill="#f87171" opacity="0.8"/>
    <circle cx="38" cy="17" r="5" fill="#fbbf24" opacity="0.8"/>
    <circle cx="56" cy="17" r="5" fill="#34d399" opacity="0.8"/>
    <rect x="18" y="56" width="154" height="12" rx="6" fill="#a5f3fc" opacity="0.6"/>
    <rect x="18" y="80" width="110" height="12" rx="6" fill="#a5f3fc" opacity="0.4"/>
    <rect x="18" y="104" width="130" height="12" rx="6" fill="#a5f3fc" opacity="0.4"/>
  </g>

  <!-- title text -->
  <text x="100" y="540" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="54" font-weight="700" fill="#f8fafc">AI 브라우저 확산</text>
  <text x="100" y="590" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="27" font-weight="500" fill="#c7d2fe">검색에서 대화로, 인터넷 이용 방식의 변화</text>
</svg>
