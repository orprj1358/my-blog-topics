<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE3B3"/>
      <stop offset="45%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#B9490A"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD28A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFD28A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE9C2"/>
      <stop offset="100%" stop-color="#E8903A"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3DE"/>
      <stop offset="100%" stop-color="#F7B955"/>
    </linearGradient>
    <clipPath id="roundedCanvas">
      <rect x="0" y="0" width="1200" height="630" rx="36" ry="36"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedCanvas)">
    <rect x="0" y="0" width="1200" height="630" fill="url(#bgGrad)"/>
    <circle cx="140" cy="110" r="260" fill="url(#glowTL)"/>
    <circle cx="1060" cy="540" r="300" fill="url(#glowBR)"/>

    <!-- bank building silhouette, right side -->
    <g opacity="0.16" fill="#FFFFFF">
      <rect x="860" y="360" width="260" height="190" rx="10"/>
      <polygon points="850,360 990,280 1130,360"/>
      <rect x="885" y="390" width="26" height="130" rx="4"/>
      <rect x="935" y="390" width="26" height="130" rx="4"/>
      <rect x="985" y="390" width="26" height="130" rx="4"/>
      <rect x="1035" y="390" width="26" height="130" rx="4"/>
      <rect x="1085" y="390" width="26" height="130" rx="4"/>
    </g>

    <!-- coin stack, bottom-left -->
    <g>
      <ellipse cx="150" cy="520" rx="78" ry="26" fill="url(#coinGrad)" opacity="0.9"/>
      <ellipse cx="150" cy="490" rx="78" ry="26" fill="url(#coinGrad)" opacity="0.95"/>
      <ellipse cx="150" cy="460" rx="78" ry="26" fill="url(#coinGrad)"/>
      <text x="150" y="468" font-family="sans-serif" font-size="26" font-weight="700" fill="#8A4B10" text-anchor="middle">₩</text>
    </g>

    <!-- percent badge -->
    <g>
      <circle cx="1000" cy="150" r="70" fill="url(#badgeGrad)"/>
      <text x="1000" y="163" font-family="sans-serif" font-size="46" font-weight="700" fill="#9A4B0F" text-anchor="middle">%</text>
    </g>

    <!-- arrow motif suggesting switching -->
    <g stroke="#FFF6E8" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.85">
      <path d="M 860 150 C 905 150 905 150 940 150" marker-end="none"/>
      <polygon points="930,135 960,150 930,165" fill="#FFF6E8"/>
    </g>

    <!-- title -->
    <text x="90" y="300" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="58" font-weight="800" fill="#FFF8EE">대출 갈아타기,</text>
    <text x="90" y="372" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="58" font-weight="800" fill="#FFF8EE">금리 비교가 쉬워진다</text>
    <text x="92" y="420" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="500" fill="#FFE8C8">대환대출 서비스, 무엇이 달라졌을까</text>
  </g>
</svg>
