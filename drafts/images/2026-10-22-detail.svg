<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDF4FB"/>
      <stop offset="100%" stop-color="#D9EFEA"/>
    </linearGradient>
    <linearGradient id="issueCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DCE3F0"/>
      <stop offset="100%" stop-color="#C3CDE3"/>
    </linearGradient>
    <linearGradient id="respCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BFF0E6"/>
      <stop offset="100%" stop-color="#6FD3C2"/>
    </linearGradient>
    <linearGradient id="issueHeadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B4A8C"/>
      <stop offset="100%" stop-color="#2A2D7C"/>
    </linearGradient>
    <linearGradient id="respHeadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#17A398"/>
      <stop offset="100%" stop-color="#0C8C86"/>
    </linearGradient>
    <linearGradient id="badgeIssueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AEB8DC"/>
      <stop offset="100%" stop-color="#7B88BC"/>
    </linearGradient>
    <linearGradient id="badgeRespGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FE6D6"/>
      <stop offset="100%" stop-color="#2FAE9C"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#17304A" flood-opacity="0.18"/>
    </filter>
    <filter id="headShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17304A" flood-opacity="0.2"/>
    </filter>
    <clipPath id="roundedDetail">
      <rect x="0" y="0" width="800" height="600" rx="24" ry="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedDetail)">
    <rect x="0" y="0" width="800" height="600" fill="url(#pageBg)"/>

    <text x="400" y="55" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="27" font-weight="800" fill="#1C3A5E" text-anchor="middle">AI 데이터센터 전력 이슈, 무엇이 쟁점일까</text>

    <!-- column headers -->
    <rect x="50" y="85" width="310" height="54" rx="14" fill="url(#issueHeadGrad)" filter="url(#headShadow)"/>
    <text x="205" y="120" font-family="sans-serif" font-size="21" font-weight="700" fill="#F3FBFA" text-anchor="middle">전력 수요가 커진 이유</text>

    <rect x="440" y="85" width="310" height="54" rx="14" fill="url(#respHeadGrad)" filter="url(#headShadow)"/>
    <text x="595" y="120" font-family="sans-serif" font-size="21" font-weight="700" fill="#F3FBFA" text-anchor="middle">전력망 대응 방향</text>

    <!-- row 1 -->
    <rect x="50" y="165" width="310" height="100" rx="16" fill="url(#issueCardGrad)" filter="url(#cardShadow)"/>
    <circle cx="90" cy="195" r="22" fill="url(#badgeIssueGrad)"/>
    <text x="90" y="202" font-family="sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="122" y="202" font-family="sans-serif" font-size="18" font-weight="700" fill="#2A2D5C">AI 연산량 급증</text>
    <text x="122" y="232" font-family="sans-serif" font-size="14" fill="#42487A">학습·서비스용 서버가 쉼 없이 가동</text>

    <rect x="440" y="165" width="310" height="100" rx="16" fill="url(#respCardGrad)" filter="url(#cardShadow)"/>
    <circle cx="480" cy="195" r="22" fill="url(#badgeRespGrad)"/>
    <text x="480" y="202" font-family="sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="512" y="202" font-family="sans-serif" font-size="18" font-weight="700" fill="#0E4D44">전력망 투자 확대</text>
    <text x="512" y="232" font-family="sans-serif" font-size="14" fill="#15655A">송·배전 설비 증설 추진</text>

    <!-- row 2 -->
    <rect x="50" y="285" width="310" height="100" rx="16" fill="url(#issueCardGrad)" filter="url(#cardShadow)"/>
    <circle cx="90" cy="315" r="22" fill="url(#badgeIssueGrad)"/>
    <text x="90" y="322" font-family="sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="122" y="322" font-family="sans-serif" font-size="18" font-weight="700" fill="#2A2D5C">신규 데이터센터 집중</text>
    <text x="122" y="352" font-family="sans-serif" font-size="14" fill="#42487A">특정 지역 전력망에 부담 집중</text>

    <rect x="440" y="285" width="310" height="100" rx="16" fill="url(#respCardGrad)" filter="url(#cardShadow)"/>
    <circle cx="480" cy="315" r="22" fill="url(#badgeRespGrad)"/>
    <text x="480" y="322" font-family="sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="512" y="322" font-family="sans-serif" font-size="18" font-weight="700" fill="#0E4D44">입지 분산 유도</text>
    <text x="512" y="352" font-family="sans-serif" font-size="14" fill="#15655A">전력 여유 지역으로 분산 검토</text>

    <!-- row 3 -->
    <rect x="50" y="405" width="310" height="100" rx="16" fill="url(#issueCardGrad)" filter="url(#cardShadow)"/>
    <circle cx="90" cy="435" r="22" fill="url(#badgeIssueGrad)"/>
    <text x="90" y="442" font-family="sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="122" y="442" font-family="sans-serif" font-size="18" font-weight="700" fill="#2A2D5C">상시 고가동 특성</text>
    <text x="122" y="472" font-family="sans-serif" font-size="14" fill="#42487A">24시간 가동으로 소비 전력 큼</text>

    <rect x="440" y="405" width="310" height="100" rx="16" fill="url(#respCardGrad)" filter="url(#cardShadow)"/>
    <circle cx="480" cy="435" r="22" fill="url(#badgeRespGrad)"/>
    <text x="480" y="442" font-family="sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="512" y="442" font-family="sans-serif" font-size="18" font-weight="700" fill="#0E4D44">효율화·재생에너지</text>
    <text x="512" y="472" font-family="sans-serif" font-size="14" fill="#15655A">고효율 서버·친환경 전력 도입</text>

    <!-- connecting arrows -->
    <g stroke="#17A398" stroke-width="4" fill="#17A398" opacity="0.75">
      <line x1="362" y1="215" x2="436" y2="215"/>
      <polygon points="430,206 442,215 430,224"/>
      <line x1="362" y1="335" x2="436" y2="335"/>
      <polygon points="430,326 442,335 430,344"/>
      <line x1="362" y1="455" x2="436" y2="455"/>
      <polygon points="430,446 442,455 430,464"/>
    </g>

    <text x="400" y="548" font-family="sans-serif" font-size="13" fill="#2F5A6E" text-anchor="middle">※ 구체적 수치·시기는 지역·기업별로 달라 예시로만 참고해 주세요</text>
  </g>
</svg>
