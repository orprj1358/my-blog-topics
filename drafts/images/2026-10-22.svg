<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2D7C"/>
      <stop offset="45%" stop-color="#17417A"/>
      <stop offset="100%" stop-color="#0C8C86"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5FE3D1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5FE3D1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="100%" stop-color="#F4C238"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8FFFB"/>
      <stop offset="100%" stop-color="#5FE3D1"/>
    </linearGradient>
    <clipPath id="roundedCanvas">
      <rect x="0" y="0" width="1200" height="630" rx="36" ry="36"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedCanvas)">
    <rect x="0" y="0" width="1200" height="630" fill="url(#bgGrad)"/>
    <circle cx="140" cy="110" r="260" fill="url(#glowTL)"/>
    <circle cx="1060" cy="540" r="300" fill="url(#glowBR)"/>

    <!-- data center / server rack silhouette, right side -->
    <g opacity="0.16" fill="#FFFFFF">
      <rect x="850" y="330" width="280" height="220" rx="10"/>
      <rect x="880" y="360" width="220" height="24" rx="4"/>
      <rect x="880" y="400" width="220" height="24" rx="4"/>
      <rect x="880" y="440" width="220" height="24" rx="4"/>
      <rect x="880" y="480" width="220" height="24" rx="4"/>
      <circle cx="900" cy="372" r="5"/>
      <circle cx="900" cy="412" r="5"/>
      <circle cx="900" cy="452" r="5"/>
      <circle cx="900" cy="492" r="5"/>
    </g>

    <!-- chip motif, top area -->
    <g opacity="0.85">
      <rect x="945" y="95" width="110" height="110" rx="14" fill="url(#badgeGrad)"/>
      <rect x="975" y="125" width="50" height="50" rx="6" fill="#0C3B5E"/>
      <g stroke="#E8FFFB" stroke-width="4" stroke-linecap="round">
        <line x1="945" y1="120" x2="925" y2="120"/>
        <line x1="945" y1="150" x2="925" y2="150"/>
        <line x1="945" y1="180" x2="925" y2="180"/>
        <line x1="1055" y1="120" x2="1075" y2="120"/>
        <line x1="1055" y1="150" x2="1075" y2="150"/>
        <line x1="1055" y1="180" x2="1075" y2="180"/>
      </g>
    </g>

    <!-- lightning bolt, bottom-left power motif -->
    <g>
      <polygon points="150,430 210,430 170,500 220,500 130,600 160,520 110,520" fill="url(#boltGrad)"/>
    </g>

    <!-- title -->
    <text x="90" y="300" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="56" font-weight="800" fill="#F3FBFA">AI 데이터센터,</text>
    <text x="90" y="372" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="56" font-weight="800" fill="#F3FBFA">전력은 버틸 수 있을까</text>
    <text x="92" y="420" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="500" fill="#CDEFEA">전력 수요 급증과 전력망 확충 논의</text>
  </g>
</svg>
