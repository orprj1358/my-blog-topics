<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C2D12"/>
      <stop offset="45%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE8B8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFE8B8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D6"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <clipPath id="roundedCanvas">
      <rect x="0" y="0" width="1200" height="630" rx="36" ry="36"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedCanvas)">
    <rect x="0" y="0" width="1200" height="630" fill="url(#bgGrad)"/>
    <circle cx="150" cy="100" r="260" fill="url(#glowTL)"/>
    <circle cx="1060" cy="540" r="300" fill="url(#glowBR)"/>

    <!-- rising bar chart silhouette, right side -->
    <g opacity="0.16" fill="#FFFFFF">
      <rect x="860" y="470" width="60" height="110" rx="8"/>
      <rect x="940" y="420" width="60" height="160" rx="8"/>
      <rect x="1020" y="350" width="60" height="230" rx="8"/>
    </g>

    <!-- coin stack motif -->
    <g>
      <ellipse cx="990" cy="140" rx="100" ry="34" fill="url(#coinGrad)"/>
      <ellipse cx="990" cy="115" rx="100" ry="34" fill="url(#coinGrad)"/>
      <ellipse cx="990" cy="90" rx="100" ry="34" fill="url(#coinGrad)"/>
      <text x="990" y="100" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="40" font-weight="800" fill="#7C2D12" text-anchor="middle">%</text>
    </g>

    <!-- percent badge, bottom-right accent -->
    <g opacity="0.9">
      <circle cx="880" cy="500" r="46" fill="url(#badgeGrad)"/>
      <text x="880" y="514" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="34" font-weight="800" fill="#B45309" text-anchor="middle">DSR</text>
    </g>

    <!-- title -->
    <text x="90" y="300" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="56" font-weight="800" fill="#FFF8EC">스트레스 DSR 3단계,</text>
    <text x="90" y="372" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="56" font-weight="800" fill="#FFF8EC">대출 한도 더 줄어들까</text>
    <text x="92" y="420" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="500" fill="#FDE8C8">가산금리 적용 확대와 상환능력 점검</text>
  </g>
</svg>
