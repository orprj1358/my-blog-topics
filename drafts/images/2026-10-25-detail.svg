<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FB"/>
      <stop offset="100%" stop-color="#E3F6F1"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF0FB"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E3F6F1"/>
    </linearGradient>
    <linearGradient id="badgeGradIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#312E82"/>
    </linearGradient>
    <linearGradient id="badgeGradTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1E1B4B" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="600" fill="url(#pageGrad)"/>

  <text x="400" y="56" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="800" fill="#312E82" text-anchor="middle">일반 AI와 고영향 AI, 의무가 다르다</text>
  <text x="400" y="86" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="500" fill="#52527A" text-anchor="middle">(위험 기반 분류 개념 · 예시 설명용 구성)</text>

  <!-- Left column: 일반 AI -->
  <g>
    <rect x="50" y="120" width="330" height="430" rx="22" fill="url(#cardGrad1)" filter="url(#cardShadow)"/>
    <circle cx="215" cy="165" r="24" fill="url(#badgeGradIndigo)"/>
    <text x="215" y="173" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">一般</text>
    <text x="215" y="212" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="19" font-weight="700" fill="#312E82" text-anchor="middle">일반 AI 서비스</text>

    <circle cx="90" cy="255" r="14" fill="#C7D2FE"/>
    <text x="90" y="260" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="800" fill="#312E82" text-anchor="middle">1</text>
    <text x="115" y="260" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" fill="#3F3F6B">상대적으로 낮은 위험도</text>

    <circle cx="90" cy="305" r="14" fill="#C7D2FE"/>
    <text x="90" y="310" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="800" fill="#312E82" text-anchor="middle">2</text>
    <text x="115" y="310" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" fill="#3F3F6B">별도 안전성 점검 의무 없음</text>

    <circle cx="90" cy="355" r="14" fill="#C7D2FE"/>
    <text x="90" y="360" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="800" fill="#312E82" text-anchor="middle">3</text>
    <text x="115" y="360" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" fill="#3F3F6B">자율 가이드라인 수준 대응</text>

    <rect x="80" y="400" width="270" height="110" rx="14" fill="#EEF0FB"/>
    <text x="95" y="428" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="700" fill="#312E82">이용자 체감</text>
    <text x="95" y="453" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#52527A">별다른 표시 없이</text>
    <text x="95" y="474" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#52527A">기존과 비슷하게</text>
    <text x="95" y="495" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#52527A">서비스 이용 지속</text>
  </g>

  <polygon points="390,330 430,330 430,315 455,335 430,355 430,340 390,340" fill="url(#arrowGrad)"/>

  <!-- Right column: 고영향 AI -->
  <g>
    <rect x="420" y="120" width="330" height="430" rx="22" fill="url(#cardGrad2)" filter="url(#cardShadow)"/>
    <circle cx="585" cy="165" r="24" fill="url(#badgeGradTeal)"/>
    <text x="585" y="173" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">高影</text>
    <text x="585" y="212" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="19" font-weight="700" fill="#0F766E" text-anchor="middle">고영향 AI 서비스</text>

    <circle cx="460" cy="255" r="14" fill="#99F6E4"/>
    <text x="460" y="260" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="800" fill="#0F766E" text-anchor="middle">1</text>
    <text x="485" y="260" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" fill="#2C5F58">안전·인권에 미치는 영향 큼</text>

    <circle cx="460" cy="305" r="14" fill="#99F6E4"/>
    <text x="460" y="310" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="800" fill="#0F766E" text-anchor="middle">2</text>
    <text x="485" y="310" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" fill="#2C5F58">안전성·신뢰성 점검 의무</text>

    <circle cx="460" cy="355" r="14" fill="#99F6E4"/>
    <text x="460" y="360" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="800" fill="#0F766E" text-anchor="middle">3</text>
    <text x="485" y="360" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" fill="#2C5F58">AI 생성물 표시 의무</text>

    <rect x="450" y="400" width="270" height="110" rx="14" fill="#E3F6F1"/>
    <text x="465" y="428" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="700" fill="#0F766E">이용자 체감</text>
    <text x="465" y="453" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#2C5F58">AI 사용 여부·주의사항</text>
    <text x="465" y="474" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#2C5F58">표시를 더 자주</text>
    <text x="465" y="495" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#2C5F58">확인 가능</text>
  </g>
</svg>
