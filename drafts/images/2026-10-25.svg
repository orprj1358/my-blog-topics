<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#322E82"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFEFF"/>
      <stop offset="100%" stop-color="#99F6E4"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDFA"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
    <clipPath id="roundedCanvas">
      <rect x="0" y="0" width="1200" height="630" rx="36" ry="36"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedCanvas)">
    <rect x="0" y="0" width="1200" height="630" fill="url(#bgGrad)"/>
    <circle cx="150" cy="100" r="260" fill="url(#glowTL)"/>
    <circle cx="1060" cy="540" r="300" fill="url(#glowBR)"/>

    <!-- network nodes motif, right side -->
    <g opacity="0.22" stroke="#99F6E4" stroke-width="2" fill="none">
      <line x1="880" y1="460" x2="980" y2="400"/>
      <line x1="980" y1="400" x2="1080" y2="440"/>
      <line x1="980" y1="400" x2="1000" y2="300"/>
      <line x1="1000" y1="300" x2="1100" y2="260"/>
      <line x1="880" y1="460" x2="940" y2="540"/>
    </g>
    <g fill="#99F6E4" opacity="0.5">
      <circle cx="880" cy="460" r="8"/>
      <circle cx="980" cy="400" r="10"/>
      <circle cx="1080" cy="440" r="7"/>
      <circle cx="1000" cy="300" r="7"/>
      <circle cx="1100" cy="260" r="9"/>
      <circle cx="940" cy="540" r="6"/>
    </g>

    <!-- chip motif -->
    <g>
      <rect x="930" y="120" width="130" height="130" rx="18" fill="url(#chipGrad)"/>
      <rect x="965" y="155" width="60" height="60" rx="8" fill="#1E1B4B"/>
      <line x1="930" y1="150" x2="900" y2="150" stroke="#99F6E4" stroke-width="6" stroke-linecap="round"/>
      <line x1="930" y1="185" x2="900" y2="185" stroke="#99F6E4" stroke-width="6" stroke-linecap="round"/>
      <line x1="930" y1="220" x2="900" y2="220" stroke="#99F6E4" stroke-width="6" stroke-linecap="round"/>
      <line x1="1060" y1="150" x2="1090" y2="150" stroke="#99F6E4" stroke-width="6" stroke-linecap="round"/>
      <line x1="1060" y1="185" x2="1090" y2="185" stroke="#99F6E4" stroke-width="6" stroke-linecap="round"/>
      <line x1="1060" y1="220" x2="1090" y2="220" stroke="#99F6E4" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- compliance badge -->
    <g opacity="0.92">
      <circle cx="845" cy="500" r="48" fill="url(#badgeGrad)"/>
      <text x="845" y="512" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="800" fill="#0F766E" text-anchor="middle">규율</text>
    </g>

    <!-- title -->
    <text x="90" y="290" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="54" font-weight="800" fill="#F5F7FF">AI 기본법,</text>
    <text x="90" y="362" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="54" font-weight="800" fill="#F5F7FF">시행 임박</text>
    <text x="92" y="412" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="25" font-weight="500" fill="#CDEEE8">고영향 AI 규율과 기업의 대응 방향</text>
  </g>
</svg>
