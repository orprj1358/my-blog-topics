<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDFA"/>
      <stop offset="100%" stop-color="#99F6E4"/>
    </linearGradient>
    <clipPath id="roundedCanvas">
      <rect x="0" y="0" width="1200" height="630" rx="36" ry="36"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedCanvas)">
    <rect x="0" y="0" width="1200" height="630" fill="url(#bgGrad)"/>
    <circle cx="130" cy="90" r="260" fill="url(#glowTL)"/>
    <circle cx="1080" cy="540" r="300" fill="url(#glowBR)"/>

    <!-- network/chip motif, right side -->
    <g opacity="0.95">
      <rect x="930" y="370" width="130" height="130" rx="22" fill="url(#chipGrad)"/>
      <rect x="965" y="405" width="60" height="60" rx="10" fill="#4338CA"/>
      <line x1="995" y1="370" x2="995" y2="345" stroke="#A5B4FC" stroke-width="5" stroke-linecap="round"/>
      <line x1="995" y1="500" x2="995" y2="525" stroke="#A5B4FC" stroke-width="5" stroke-linecap="round"/>
      <line x1="930" y1="435" x2="905" y2="435" stroke="#A5B4FC" stroke-width="5" stroke-linecap="round"/>
      <line x1="1060" y1="435" x2="1085" y2="435" stroke="#A5B4FC" stroke-width="5" stroke-linecap="round"/>
      <line x1="950" y1="390" x2="930" y2="370" stroke="#A5B4FC" stroke-width="5" stroke-linecap="round"/>
      <line x1="1040" y1="390" x2="1060" y2="370" stroke="#A5B4FC" stroke-width="5" stroke-linecap="round"/>
      <line x1="950" y1="480" x2="930" y2="500" stroke="#A5B4FC" stroke-width="5" stroke-linecap="round"/>
      <line x1="1040" y1="480" x2="1060" y2="500" stroke="#A5B4FC" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- connecting nodes suggesting agent workflow -->
    <g opacity="0.85">
      <circle cx="1070" cy="180" r="50" fill="url(#badgeGrad)"/>
      <text x="1070" y="190" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="800" fill="#0F766E" text-anchor="middle">AI</text>
      <circle cx="960" cy="235" r="8" fill="#5EEAD4"/>
      <circle cx="1000" cy="300" r="6" fill="#5EEAD4"/>
      <path d="M1040,215 L1000,295" stroke="#5EEAD4" stroke-width="3" fill="none" opacity="0.7"/>
    </g>

    <!-- title -->
    <text x="90" y="300" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="52" font-weight="800" fill="#F0FDFA">AI 에이전트 확산,</text>
    <text x="90" y="372" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="52" font-weight="800" fill="#F0FDFA">일하는 방식이 바뀐다</text>
    <text x="92" y="422" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="500" fill="#C7D2FE">챗봇을 넘어 '실행하는 AI'로</text>
  </g>
</svg>
