<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6EC"/>
      <stop offset="100%" stop-color="#FFE3C2"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF1DE"/>
    </linearGradient>
    <linearGradient id="barBefore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC56B"/>
      <stop offset="100%" stop-color="#F4A261"/>
    </linearGradient>
    <linearGradient id="barAfter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F08C5A"/>
      <stop offset="100%" stop-color="#E76F51"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9A66C"/>
      <stop offset="100%" stop-color="#E76F51"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#8B4513" flood-opacity="0.2"/>
    </filter>
    <filter id="barShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#8B4513" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="56" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="30" font-weight="800" fill="#6B3410">가산금리 강화 전후, 대출 한도 비교 (예시)</text>
  <text x="400" y="86" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="16" fill="#A0522D">동일한 소득·집값 조건이라고 가정한 개념 예시입니다</text>

  <!-- Card 1: before -->
  <rect x="70" y="130" width="300" height="420" rx="22" fill="url(#cardA)" filter="url(#cardShadow)"/>
  <circle cx="130" cy="180" r="24" fill="url(#badgeGrad)" filter="url(#barShadow)"/>
  <text x="130" y="188" text-anchor="middle" font-family="'Noto Sans KR',sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">1</text>
  <text x="170" y="188" font-family="'Noto Sans KR',sans-serif" font-size="20" font-weight="700" fill="#6B3410">완화된 가산금리 시기</text>

  <rect x="150" y="260" width="140" height="230" rx="16" fill="url(#barBefore)" filter="url(#barShadow)"/>
  <text x="220" y="300" text-anchor="middle" font-family="'Noto Sans KR',sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">대출 한도</text>
  <text x="220" y="330" text-anchor="middle" font-family="'Noto Sans KR',sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">상대적 ↑</text>
  <text x="220" y="520" text-anchor="middle" font-family="'Noto Sans KR',sans-serif" font-size="14" fill="#A0522D">가산금리 낮음 → 상환능력 여유있게 산정</text>

  <!-- Card 2: after -->
  <rect x="430" y="130" width="300" height="420" rx="22" fill="url(#cardA)" filter="url(#cardShadow)"/>
  <circle cx="490" cy="180" r="24" fill="url(#badgeGrad)" filter="url(#barShadow)"/>
  <text x="490" y="188" text-anchor="middle" font-family="'Noto Sans KR',sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">2</text>
  <text x="530" y="188" font-family="'Noto Sans KR',sans-serif" font-size="20" font-weight="700" fill="#6B3410">스트레스 DSR 3단계</text>

  <rect x="510" y="340" width="140" height="150" rx="16" fill="url(#barAfter)" filter="url(#barShadow)"/>
  <text x="580" y="400" text-anchor="middle" font-family="'Noto Sans KR',sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">대출 한도</text>
  <text x="580" y="430" text-anchor="middle" font-family="'Noto Sans KR',sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">상대적 ↓</text>
  <text x="580" y="520" text-anchor="middle" font-family="'Noto Sans KR',sans-serif" font-size="14" fill="#A0522D">가산금리 확대 → 상환능력 더 엄격히 산정</text>

  <!-- arrow between -->
  <path d="M378,340 L422,340" stroke="#E76F51" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M410,328 L424,340 L410,352" stroke="#E76F51" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
