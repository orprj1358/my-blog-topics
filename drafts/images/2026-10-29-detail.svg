<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF1FC"/>
      <stop offset="100%" stop-color="#D7E4F5"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF1FC"/>
    </linearGradient>
    <linearGradient id="barBefore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9FB0EC"/>
      <stop offset="100%" stop-color="#6D7FD9"/>
    </linearGradient>
    <linearGradient id="barAfter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#2EC4B6"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C8CE8"/>
      <stop offset="100%" stop-color="#2E3A8C"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1E2A6B" flood-opacity="0.2"/>
    </filter>
    <filter id="barShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1E2A6B" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="56" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="800" fill="#2E3A8C">일반 IT 서비스 vs AI 서비스, 전력 수요 비교 (예시)</text>
  <text x="400" y="86" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="16" fill="#4B5AA8">실제 수치가 아닌 개념을 보여주는 예시 비교입니다</text>

  <!-- Card 1: traditional -->
  <rect x="70" y="130" width="300" height="420" rx="22" fill="url(#cardA)" filter="url(#cardShadow)"/>
  <circle cx="130" cy="180" r="24" fill="url(#badgeGrad)" filter="url(#barShadow)"/>
  <text x="130" y="188" text-anchor="middle" font-family="'Noto Sans KR',sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">1</text>
  <text x="170" y="188" font-family="'Noto Sans KR',sans-serif" font-size="19" font-weight="700" fill="#2E3A8C">일반 IT 서비스</text>

  <rect x="150" y="320" width="140" height="170" rx="16" fill="url(#barBefore)" filter="url(#barShadow)"/>
  <text x="220" y="360" text-anchor="middle" font-family="'Noto Sans KR',sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">전력 사용량</text>
  <text x="220" y="390" text-anchor="middle" font-family="'Noto Sans KR',sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">상대적 낮음</text>
  <text x="220" y="520" text-anchor="middle" font-family="'Noto Sans KR',sans-serif" font-size="13" fill="#4B5AA8">단순 연산·저장 중심 워크로드</text>

  <!-- Card 2: AI -->
  <rect x="430" y="130" width="300" height="420" rx="22" fill="url(#cardA)" filter="url(#cardShadow)"/>
  <circle cx="490" cy="180" r="24" fill="url(#badgeGrad)" filter="url(#barShadow)"/>
  <text x="490" y="188" text-anchor="middle" font-family="'Noto Sans KR',sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">2</text>
  <text x="530" y="188" font-family="'Noto Sans KR',sans-serif" font-size="19" font-weight="700" fill="#2E3A8C">AI 학습·추론 서비스</text>

  <rect x="510" y="230" width="140" height="260" rx="16" fill="url(#barAfter)" filter="url(#barShadow)"/>
  <text x="580" y="270" text-anchor="middle" font-family="'Noto Sans KR',sans-serif" font-size="17" font-weight="700" fill="#0F3D3A">전력 사용량</text>
  <text x="580" y="300" text-anchor="middle" font-family="'Noto Sans KR',sans-serif" font-size="24" font-weight="800" fill="#0F3D3A">상대적 높음</text>
  <text x="580" y="520" text-anchor="middle" font-family="'Noto Sans KR',sans-serif" font-size="13" fill="#4B5AA8">대규모 연산·냉각까지 전력 소모 큼</text>

  <!-- arrow between -->
  <path d="M378,340 L422,340" stroke="#2EC4B6" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M410,328 L424,340 L410,352" stroke="#2EC4B6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
