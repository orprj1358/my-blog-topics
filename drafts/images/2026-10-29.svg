<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8EBFB"/>
      <stop offset="50%" stop-color="#B9C2F0"/>
      <stop offset="100%" stop-color="#6D7FD9"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2EC4B6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2EC4B6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B6EE8"/>
      <stop offset="100%" stop-color="#2E3A8C"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#2EC4B6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1E2A6B" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="980" cy="120" r="260" fill="url(#glow1)"/>
  <circle cx="180" cy="520" r="260" fill="url(#glow2)"/>

  <!-- network nodes motif -->
  <g stroke="#FFFFFF" stroke-width="2.5" opacity="0.55">
    <line x1="860" y1="150" x2="960" y2="220"/>
    <line x1="960" y1="220" x2="1040" y2="150"/>
    <line x1="960" y1="220" x2="960" y2="320"/>
    <line x1="960" y1="320" x2="1060" y2="380"/>
    <line x1="960" y1="320" x2="860" y2="380"/>
  </g>
  <g fill="#FFFFFF" opacity="0.85">
    <circle cx="860" cy="150" r="7"/>
    <circle cx="1040" cy="150" r="7"/>
    <circle cx="960" cy="220" r="9"/>
    <circle cx="960" cy="320" r="9"/>
    <circle cx="1060" cy="380" r="7"/>
    <circle cx="860" cy="380" r="7"/>
  </g>

  <!-- chip icon, flat geometric -->
  <g transform="translate(150,340)" filter="url(#softShadow)">
    <rect x="0" y="0" width="190" height="190" rx="24" fill="url(#chip)"/>
    <rect x="40" y="40" width="110" height="110" rx="12" fill="#1E2A6B" opacity="0.5"/>
    <g stroke="#CFE4FF" stroke-width="5" stroke-linecap="round">
      <line x1="25" y1="-10" x2="25" y2="0"/>
      <line x1="95" y1="-10" x2="95" y2="0"/>
      <line x1="165" y1="-10" x2="165" y2="0"/>
      <line x1="25" y1="190" x2="25" y2="200"/>
      <line x1="95" y1="190" x2="95" y2="200"/>
      <line x1="165" y1="190" x2="165" y2="200"/>
      <line x1="-10" y1="25" x2="0" y2="25"/>
      <line x1="-10" y1="95" x2="0" y2="95"/>
      <line x1="-10" y1="165" x2="0" y2="165"/>
      <line x1="190" y1="25" x2="200" y2="25"/>
      <line x1="190" y1="95" x2="200" y2="95"/>
      <line x1="190" y1="165" x2="200" y2="165"/>
    </g>
  </g>

  <!-- power bolt badge -->
  <g transform="translate(900,400)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="85" fill="url(#bolt)"/>
    <path d="M8,-45 L-32,8 L-4,8 L-10,45 L34,-10 L4,-10 Z" fill="#0F3D3A"/>
  </g>

  <!-- title card -->
  <rect x="90" y="90" width="760" height="160" rx="24" fill="url(#cardGrad)" filter="url(#softShadow)"/>
  <text x="130" y="155" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="44" font-weight="800" fill="#2E3A8C">AI는 전기도 많이 먹는다</text>
  <text x="130" y="212" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="32" font-weight="700" fill="#2EC4B6">데이터센터 전력난, 왜 지금일까</text>
</svg>
