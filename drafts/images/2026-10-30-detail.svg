<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9ECFB"/>
      <stop offset="100%" stop-color="#D2DAF6"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF1FC"/>
    </linearGradient>
    <linearGradient id="barBubble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8FA0F5"/>
      <stop offset="100%" stop-color="#4A5BD0"/>
    </linearGradient>
    <linearGradient id="barGrowth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#2EC4B6"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C8CE8"/>
      <stop offset="100%" stop-color="#2E3A8C"/>
    </linearGradient>
    <linearGradient id="badgeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#1F8F84"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1E2A6B" flood-opacity="0.2"/>
    </filter>
    <filter id="barShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1E2A6B" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="56" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="27" font-weight="800" fill="#2E3A8C">AI 투자 논쟁, 거품론 vs 성장론</text>
  <text x="400" y="86" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="16" fill="#4B5AA8">두 시각의 핵심 주장을 비교한 개념도 (예시)</text>

  <!-- Card 1: bubble theory -->
  <rect x="70" y="130" width="300" height="420" rx="22" fill="url(#cardA)" filter="url(#cardShadow)"/>
  <circle cx="130" cy="180" r="24" fill="url(#badgeGrad)" filter="url(#barShadow)"/>
  <text x="130" y="188" text-anchor="middle" font-family="'Noto Sans KR',sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">1</text>
  <text x="170" y="188" font-family="'Noto Sans KR',sans-serif" font-size="19" font-weight="700" fill="#2E3A8C">거품론</text>

  <rect x="150" y="230" width="140" height="260" rx="16" fill="url(#barBubble)" filter="url(#barShadow)"/>
  <text x="220" y="270" text-anchor="middle" font-family="'Noto Sans KR',sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">투자 대비</text>
  <text x="220" y="298" text-anchor="middle" font-family="'Noto Sans KR',sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">수익 불확실</text>

  <text x="220" y="520" text-anchor="middle" font-family="'Noto Sans KR',sans-serif" font-size="13" fill="#4B5AA8">막대한 투자액을 매출이</text>
  <text x="220" y="540" text-anchor="middle" font-family="'Noto Sans KR',sans-serif" font-size="13" fill="#4B5AA8">아직 따라가지 못한다는 지적</text>

  <!-- Card 2: growth theory -->
  <rect x="430" y="130" width="300" height="420" rx="22" fill="url(#cardA)" filter="url(#cardShadow)"/>
  <circle cx="490" cy="180" r="24" fill="url(#badgeGrad2)" filter="url(#barShadow)"/>
  <text x="490" y="188" text-anchor="middle" font-family="'Noto Sans KR',sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">2</text>
  <text x="530" y="188" font-family="'Noto Sans KR',sans-serif" font-size="19" font-weight="700" fill="#2E3A8C">성장론</text>

  <rect x="510" y="230" width="140" height="260" rx="16" fill="url(#barGrowth)" filter="url(#barShadow)"/>
  <text x="580" y="270" text-anchor="middle" font-family="'Noto Sans KR',sans-serif" font-size="17" font-weight="700" fill="#0F3D3A">초기 단계의</text>
  <text x="580" y="298" text-anchor="middle" font-family="'Noto Sans KR',sans-serif" font-size="22" font-weight="800" fill="#0F3D3A">선제적 투자</text>

  <text x="580" y="520" text-anchor="middle" font-family="'Noto Sans KR',sans-serif" font-size="13" fill="#4B5AA8">실제 수요는 이제 막</text>
  <text x="580" y="540" text-anchor="middle" font-family="'Noto Sans KR',sans-serif" font-size="13" fill="#4B5AA8">본격화되고 있다는 시각</text>

  <!-- vs badge between -->
  <circle cx="400" cy="340" r="34" fill="url(#badgeGrad)" filter="url(#cardShadow)"/>
  <text x="400" y="348" text-anchor="middle" font-family="'Noto Sans KR',sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">VS</text>
</svg>
