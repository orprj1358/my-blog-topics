<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7EAFC"/>
      <stop offset="50%" stop-color="#BFC9F2"/>
      <stop offset="100%" stop-color="#5E6FD8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2EC4B6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2EC4B6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scaleBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B6EE8"/>
      <stop offset="100%" stop-color="#2E3A8C"/>
    </linearGradient>
    <linearGradient id="panA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#2EC4B6"/>
    </linearGradient>
    <linearGradient id="panB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FA0F5"/>
      <stop offset="100%" stop-color="#4A5BD0"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1E2A6B" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="990" cy="130" r="260" fill="url(#glow1)"/>
  <circle cx="170" cy="520" r="260" fill="url(#glow2)"/>

  <!-- network nodes motif -->
  <g stroke="#FFFFFF" stroke-width="2.5" opacity="0.5">
    <line x1="840" y1="140" x2="930" y2="190"/>
    <line x1="930" y1="190" x2="1020" y2="140"/>
    <line x1="930" y1="190" x2="930" y2="270"/>
  </g>
  <g fill="#FFFFFF" opacity="0.8">
    <circle cx="840" cy="140" r="6"/>
    <circle cx="1020" cy="140" r="6"/>
    <circle cx="930" cy="190" r="8"/>
    <circle cx="930" cy="270" r="6"/>
  </g>

  <!-- balance scale icon: debate between bubble vs growth -->
  <g transform="translate(870,420)" filter="url(#softShadow)">
    <rect x="-6" y="-120" width="12" height="150" rx="6" fill="url(#scaleBody)"/>
    <circle cx="0" cy="-125" r="14" fill="url(#scaleBody)"/>
    <rect x="-95" y="-115" width="190" height="10" rx="5" fill="url(#scaleBody)"/>
    <line x1="-85" y1="-110" x2="-115" y2="-35" stroke="url(#scaleBody)" stroke-width="6"/>
    <line x1="85" y1="-110" x2="115" y2="-35" stroke="url(#scaleBody)" stroke-width="6"/>
    <path d="M-150,-35 Q-115,10 -80,-35 Z" fill="url(#panA)"/>
    <path d="M80,-35 Q115,25 150,-35 Z" fill="url(#panB)"/>
    <rect x="-40" y="25" width="80" height="18" rx="9" fill="url(#scaleBody)"/>
  </g>

  <!-- title card -->
  <rect x="90" y="90" width="760" height="190" rx="24" fill="url(#cardGrad)" filter="url(#softShadow)"/>
  <text x="130" y="155" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="42" font-weight="800" fill="#2E3A8C">AI 투자는 거품인가, 성장인가</text>
  <text x="130" y="212" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="700" fill="#2EC4B6">버블 논쟁이 던지는 질문</text>
  <text x="130" y="252" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="500" fill="#4A5BD0">거품론 vs 성장론, 무엇을 봐야 할까</text>
</svg>
