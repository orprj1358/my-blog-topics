<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4F7F3"/>
      <stop offset="50%" stop-color="#C3E8F2"/>
      <stop offset="100%" stop-color="#3C4FBF"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2EC4B6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2EC4B6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chipBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B6EE8"/>
      <stop offset="100%" stop-color="#2E3A8C"/>
    </linearGradient>
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#2EC4B6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1E2A6B" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="990" cy="130" r="260" fill="url(#glow1)"/>
  <circle cx="170" cy="520" r="260" fill="url(#glow2)"/>

  <!-- circuit trace motif -->
  <g stroke="#FFFFFF" stroke-width="2.5" opacity="0.5" fill="none">
    <path d="M820,130 h60 v40 h50"/>
    <path d="M1000,110 v50 h40"/>
    <path d="M900,250 h60 v-30"/>
  </g>
  <g fill="#FFFFFF" opacity="0.85">
    <circle cx="820" cy="130" r="6"/>
    <circle cx="930" cy="170" r="6"/>
    <circle cx="1040" cy="110" r="6"/>
    <circle cx="1040" cy="160" r="6"/>
    <circle cx="960" cy="250" r="6"/>
  </g>

  <!-- chip + code bracket icon: AI writing code -->
  <g transform="translate(905,430)" filter="url(#softShadow)">
    <rect x="-90" y="-80" width="180" height="160" rx="18" fill="url(#chipBody)"/>
    <rect x="-66" y="-56" width="132" height="112" rx="10" fill="#1F2A6B"/>
    <g stroke="url(#chipBody)" stroke-width="6">
      <line x1="-110" y1="-50" x2="-90" y2="-50"/>
      <line x1="-110" y1="0" x2="-90" y2="0"/>
      <line x1="-110" y1="50" x2="-90" y2="50"/>
      <line x1="110" y1="-50" x2="90" y2="-50"/>
      <line x1="110" y1="0" x2="90" y2="0"/>
      <line x1="110" y1="50" x2="90" y2="50"/>
    </g>
    <text x="0" y="12" text-anchor="middle" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="46" font-weight="800" fill="url(#bracketGrad)">&lt;/&gt;</text>
  </g>

  <!-- title card -->
  <rect x="90" y="90" width="760" height="190" rx="24" fill="url(#cardGrad)" filter="url(#softShadow)"/>
  <text x="130" y="155" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="42" font-weight="800" fill="#2E3A8C">AI 코딩 에이전트 확산</text>
  <text x="130" y="212" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="700" fill="#2EC4B6">개발자 역할은 어떻게 바뀌나</text>
  <text x="130" y="252" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="500" fill="#4A5BD0">사람과 AI가 함께 코드를 쓰는 시대</text>
</svg>
