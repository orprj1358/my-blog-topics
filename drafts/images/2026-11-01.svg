<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E1"/>
      <stop offset="50%" stop-color="#FFD9A6"/>
      <stop offset="100%" stop-color="#E0792A"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8A3D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF8A3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="balloonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB15E"/>
      <stop offset="100%" stop-color="#D9661F"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE3AE"/>
      <stop offset="100%" stop-color="#F2A33D"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.62"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7A3A0E" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1000" cy="140" r="260" fill="url(#glow1)"/>
  <circle cx="160" cy="520" r="260" fill="url(#glow2)"/>

  <!-- balloon squeezed by arrows: visual metaphor for 'floating' demand pressure -->
  <g transform="translate(910,430)" filter="url(#softShadow)">
    <path d="M0,-110 C62,-110 96,-58 96,-8 C96,46 58,90 0,100 C-58,90 -96,46 -96,-8 C-96,-58 -62,-110 0,-110 Z" fill="url(#balloonGrad)"/>
    <path d="M0,100 L-14,122 L14,122 Z" fill="#D9661F"/>
    <line x1="0" y1="122" x2="0" y2="150" stroke="#D9661F" stroke-width="4"/>
    <text x="0" y="8" text-anchor="middle" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="58" font-weight="800" fill="#FFF7EC">%</text>
    <!-- squeeze arrows from left -->
    <g stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.85">
      <line x1="-190" y1="-20" x2="-120" y2="-20"/>
      <line x1="-120" y1="-20" x2="-140" y2="-38"/>
      <line x1="-120" y1="-20" x2="-140" y2="-2"/>
    </g>
    <g stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.85">
      <line x1="190" y1="-20" x2="120" y2="-20"/>
      <line x1="120" y1="-20" x2="140" y2="-38"/>
      <line x1="120" y1="-20" x2="140" y2="-2"/>
    </g>
  </g>

  <!-- floating coins -->
  <g>
    <circle cx="830" cy="150" r="22" fill="url(#coinGrad)"/>
    <circle cx="1060" cy="230" r="16" fill="url(#coinGrad)"/>
    <circle cx="980" cy="330" r="14" fill="url(#coinGrad)"/>
  </g>

  <!-- title card -->
  <rect x="90" y="90" width="760" height="210" rx="24" fill="url(#cardGrad)" filter="url(#softShadow)"/>
  <text x="130" y="155" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="40" font-weight="800" fill="#B6551B">저축은행·카드사로 쏠리는 대출 수요</text>
  <text x="130" y="212" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="700" fill="#E0792A">2금융권 '풍선효과' 우려 확산</text>
  <text x="130" y="262" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="500" fill="#C06A25">대출 문턱 높아지자, 수요는 어디로 가나</text>
</svg>
