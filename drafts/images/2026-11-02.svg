<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E1"/>
      <stop offset="50%" stop-color="#FFD2A0"/>
      <stop offset="100%" stop-color="#D9661F"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8A3D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF8A3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB15E"/>
      <stop offset="100%" stop-color="#D9661F"/>
    </linearGradient>
    <linearGradient id="spiralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE3AE"/>
      <stop offset="100%" stop-color="#C0541A"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.62"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7A3A0E" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1000" cy="140" r="260" fill="url(#glow1)"/>
  <circle cx="160" cy="520" r="260" fill="url(#glow2)"/>

  <!-- credit card with a spiral trailing from it: metaphor for revolving debt growing -->
  <g transform="translate(930,420)" filter="url(#softShadow)">
    <rect x="-110" y="-70" width="220" height="140" rx="18" fill="url(#cardFront)"/>
    <rect x="-110" y="-30" width="220" height="24" fill="#8A3E12" opacity="0.55"/>
    <rect x="-90" y="20" width="60" height="16" rx="4" fill="#FFF3E1" opacity="0.85"/>
    <circle cx="70" cy="-40" r="16" fill="#FFF3E1" opacity="0.9"/>
    <circle cx="92" cy="-40" r="16" fill="#FFE3AE" opacity="0.75"/>
  </g>
  <path d="M930,490 C1000,520 1040,570 1010,610 C980,648 920,630 920,590" fill="none" stroke="url(#spiralGrad)" stroke-width="14" stroke-linecap="round"/>
  <circle cx="922" cy="590" r="12" fill="url(#spiralGrad)"/>

  <!-- small floating coins -->
  <g>
    <circle cx="820" cy="150" r="20" fill="url(#spiralGrad)"/>
    <circle cx="1050" cy="240" r="15" fill="url(#spiralGrad)"/>
    <circle cx="970" cy="320" r="13" fill="url(#spiralGrad)"/>
  </g>

  <!-- title card -->
  <rect x="90" y="90" width="760" height="230" rx="24" fill="url(#cardGrad)" filter="url(#softShadow)"/>
  <text x="130" y="155" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="38" font-weight="800" fill="#B6551B">카드론·리볼빙 이용 급증</text>
  <text x="130" y="212" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="29" font-weight="700" fill="#E0792A">2금융권 다음은 카드사인가</text>
  <text x="130" y="262" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="19" font-weight="500" fill="#C06A25">대출 문턱이 높아질수록 수요는 어디로 가나</text>
</svg>
