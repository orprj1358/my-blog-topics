<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9ECFF"/>
      <stop offset="50%" stop-color="#6C6FD6"/>
      <stop offset="100%" stop-color="#17807A"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2FE0C9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2FE0C9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B3F9E"/>
      <stop offset="100%" stop-color="#14655F"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BFE9E2"/>
      <stop offset="100%" stop-color="#4FD1C5"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.65"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1B1F5E" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1010" cy="130" r="260" fill="url(#glow1)"/>
  <circle cx="150" cy="530" r="260" fill="url(#glow2)"/>

  <!-- phone/screen with synthetic face and scan lines: metaphor for AI voice/video cloning -->
  <g transform="translate(940,420)" filter="url(#softShadow)">
    <rect x="-95" y="-150" width="190" height="300" rx="28" fill="url(#screenGrad)"/>
    <circle cx="0" cy="-50" r="58" fill="url(#faceGrad)"/>
    <circle cx="-20" cy="-60" r="7" fill="#14655F"/>
    <circle cx="20" cy="-60" r="7" fill="#14655F"/>
    <path d="M-20,-25 Q0,-10 20,-25" stroke="#14655F" stroke-width="5" fill="none" stroke-linecap="round"/>
    <line x1="-70" y1="30" x2="70" y2="30" stroke="#BFE9E2" stroke-width="4" opacity="0.6"/>
    <line x1="-70" y1="55" x2="70" y2="55" stroke="#BFE9E2" stroke-width="4" opacity="0.4"/>
    <line x1="-70" y1="80" x2="70" y2="80" stroke="#BFE9E2" stroke-width="4" opacity="0.25"/>
  </g>

  <!-- small circuit dots / network accents -->
  <g stroke="#CFE9FF" stroke-width="2" opacity="0.55">
    <line x1="810" y1="200" x2="860" y2="160"/>
    <line x1="1080" y1="300" x2="1130" y2="260"/>
    <line x1="1000" y1="250" x2="1040" y2="300"/>
  </g>
  <g fill="#D8FFF6">
    <circle cx="810" cy="200" r="7"/>
    <circle cx="860" cy="160" r="7"/>
    <circle cx="1080" cy="300" r="7"/>
    <circle cx="1130" cy="260" r="7"/>
  </g>

  <!-- warning badge -->
  <g transform="translate(1060,470)" filter="url(#softShadow)">
    <circle r="34" fill="#FFB84C"/>
    <text x="0" y="11" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="900" fill="#7A4A00" text-anchor="middle">!</text>
  </g>

  <!-- title card -->
  <rect x="90" y="95" width="760" height="230" rx="24" fill="url(#cardGrad)" filter="url(#softShadow)"/>
  <text x="130" y="160" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="36" font-weight="800" fill="#2E3178">AI 보이스피싱·딥페이크</text>
  <text x="130" y="213" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="32" font-weight="800" fill="#136B63">사기 확산</text>
  <text x="130" y="263" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="19" font-weight="500" fill="#3E5A67">진짜보다 더 진짜 같은 목소리, 금융권 보안 대응은</text>
</svg>
