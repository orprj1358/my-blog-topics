<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCE6FF"/>
      <stop offset="50%" stop-color="#4C6FD1"/>
      <stop offset="100%" stop-color="#162B5C"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8FD6FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8FD6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC56B"/>
      <stop offset="100%" stop-color="#E8964A"/>
    </linearGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5F8FF"/>
      <stop offset="100%" stop-color="#C9D8F5"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCE6FF"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0E1C3D" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="140" r="260" fill="url(#glow1)"/>
  <circle cx="140" cy="540" r="260" fill="url(#glow2)"/>

  <!-- house icon -->
  <g transform="translate(960,420)" filter="url(#softShadow)">
    <rect x="-95" y="-10" width="190" height="150" rx="14" fill="url(#houseGrad)"/>
    <polygon points="-115,-10 0,-120 115,-10" fill="url(#roofGrad)"/>
    <rect x="-28" y="55" width="56" height="85" rx="8" fill="#5B79C9"/>
    <rect x="-70" y="30" width="34" height="34" rx="6" fill="#AFC3EC"/>
    <rect x="36" y="30" width="34" height="34" rx="6" fill="#AFC3EC"/>
  </g>

  <!-- document / report icon next to house -->
  <g transform="translate(1110,330)" filter="url(#softShadow)">
    <rect x="-34" y="-44" width="68" height="88" rx="10" fill="url(#docGrad)"/>
    <line x1="-20" y1="-22" x2="20" y2="-22" stroke="#4C6FD1" stroke-width="5" stroke-linecap="round"/>
    <line x1="-20" y1="-4" x2="20" y2="-4" stroke="#4C6FD1" stroke-width="5" stroke-linecap="round"/>
    <line x1="-20" y1="14" x2="8" y2="14" stroke="#4C6FD1" stroke-width="5" stroke-linecap="round"/>
    <circle cx="16" cy="26" r="14" fill="#FFC56B"/>
    <text x="16" y="31" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="900" fill="#7A4A00" text-anchor="middle">!</text>
  </g>

  <!-- small accent dots -->
  <g fill="#DCE6FF" opacity="0.6">
    <circle cx="840" cy="210" r="7"/>
    <circle cx="890" cy="170" r="7"/>
    <circle cx="1060" cy="230" r="7"/>
  </g>

  <!-- title card -->
  <rect x="90" y="95" width="760" height="230" rx="24" fill="url(#cardGrad)" filter="url(#softShadow)"/>
  <text x="130" y="160" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="34" font-weight="800" fill="#16305C">전월세신고제</text>
  <text x="130" y="213" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="32" font-weight="800" fill="#2E4C9E">계도기간 종료 임박</text>
  <text x="130" y="263" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="19" font-weight="500" fill="#44557A">미신고 시 과태료, 지금 확인하세요</text>
</svg>
