<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9F7F3"/>
      <stop offset="100%" stop-color="#EAF2FB"/>
    </linearGradient>
    <linearGradient id="colA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E3F3EE"/>
    </linearGradient>
    <linearGradient id="colB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E7EEFB"/>
    </linearGradient>
    <linearGradient id="badgeA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6FD9C3"/>
      <stop offset="100%" stop-color="#1E6E62"/>
    </linearGradient>
    <linearGradient id="badgeB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7FA8E0"/>
      <stop offset="100%" stop-color="#2E4C8E"/>
    </linearGradient>
    <linearGradient id="headA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3E9E8C"/>
      <stop offset="100%" stop-color="#1E6E62"/>
    </linearGradient>
    <linearGradient id="headB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B82C9"/>
      <stop offset="100%" stop-color="#2E4C8E"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0B1030" flood-opacity="0.2"/>
    </filter>
    <filter id="badgeShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0B1030" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="48" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="800" fill="#14324A">AI 확산 전후, 전력 수요는 어떻게 달라졌나</text>

  <!-- Column A: AI 확산 이전 -->
  <rect x="50" y="85" width="330" height="470" rx="22" fill="url(#colA)" filter="url(#cardShadow)"/>
  <rect x="50" y="85" width="330" height="56" rx="22" fill="url(#headA)"/>
  <rect x="50" y="113" width="330" height="28" fill="url(#headA)"/>
  <text x="215" y="122" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">AI 확산 이전</text>

  <g transform="translate(90,180)">
    <circle r="22" fill="url(#badgeA)" filter="url(#badgeShadow)"/>
    <text y="7" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">1</text>
  </g>
  <text x="130" y="175" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="700" fill="#1E4A42">데이터센터 규모</text>
  <text x="130" y="198" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="700" fill="#1E4A42">상대적으로 완만</text>

  <g transform="translate(90,280)">
    <circle r="22" fill="url(#badgeA)" filter="url(#badgeShadow)"/>
    <text y="7" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">2</text>
  </g>
  <text x="130" y="275" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="700" fill="#1E4A42">전력망 여유 용량</text>
  <text x="130" y="298" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="700" fill="#1E4A42">으로 대부분 대응</text>

  <g transform="translate(90,380)">
    <circle r="22" fill="url(#badgeA)" filter="url(#badgeShadow)"/>
    <text y="7" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">3</text>
  </g>
  <text x="130" y="375" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="700" fill="#1E4A42">연산 수요가</text>
  <text x="130" y="398" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="700" fill="#1E4A42">비교적 예측 가능</text>

  <rect x="90" y="455" width="250" height="70" rx="16" fill="#E3F3EE"/>
  <text x="215" y="483" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#1E6E62">상태: 전력망에</text>
  <text x="215" y="505" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#1E6E62">주는 부담 적음</text>

  <!-- Column B: AI 데이터센터 확산 후 -->
  <rect x="420" y="85" width="330" height="470" rx="22" fill="url(#colB)" filter="url(#cardShadow)"/>
  <rect x="420" y="85" width="330" height="56" rx="22" fill="url(#headB)"/>
  <rect x="420" y="113" width="330" height="28" fill="url(#headB)"/>
  <text x="585" y="122" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">확산 후 (지금)</text>

  <g transform="translate(460,180)">
    <circle r="22" fill="url(#badgeB)" filter="url(#badgeShadow)"/>
    <text y="7" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">1</text>
  </g>
  <text x="500" y="175" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="700" fill="#2A3E66">대형 데이터센터</text>
  <text x="500" y="198" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="700" fill="#2A3E66">빠르게 늘어남</text>

  <g transform="translate(460,280)">
    <circle r="22" fill="url(#badgeB)" filter="url(#badgeShadow)"/>
    <text y="7" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">2</text>
  </g>
  <text x="500" y="275" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="700" fill="#2A3E66">특정 지역 전력망에</text>
  <text x="500" y="298" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="700" fill="#2A3E66">부담 집중 우려</text>

  <g transform="translate(460,380)">
    <circle r="22" fill="url(#badgeB)" filter="url(#badgeShadow)"/>
    <text y="7" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">3</text>
  </g>
  <text x="500" y="375" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="700" fill="#2A3E66">효율화·전용 전력</text>
  <text x="500" y="398" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="700" fill="#2A3E66">확보 경쟁 본격화</text>

  <rect x="460" y="455" width="250" height="70" rx="16" fill="#E7EEFB"/>
  <text x="585" y="483" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#2E4C8E">대응: 입지·전력</text>
  <text x="585" y="505" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#2E4C8E">계획 함께 검토</text>
</svg>
