<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF5FB"/>
      <stop offset="100%" stop-color="#DCEAF7"/>
    </linearGradient>
    <linearGradient id="leftCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF4EC"/>
      <stop offset="100%" stop-color="#FDE2CF"/>
    </linearGradient>
    <linearGradient id="rightCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAF8F2"/>
      <stop offset="100%" stop-color="#C9EBDA"/>
    </linearGradient>
    <linearGradient id="badgeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3A26B"/>
      <stop offset="100%" stop-color="#D96A3C"/>
    </linearGradient>
    <linearGradient id="badgeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6FD9B0"/>
      <stop offset="100%" stop-color="#2FAE7E"/>
    </linearGradient>
    <linearGradient id="barLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F3A26B"/>
      <stop offset="100%" stop-color="#D1522E"/>
    </linearGradient>
    <linearGradient id="barRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8FE3C0"/>
      <stop offset="100%" stop-color="#2FAE7E"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3D6FA8"/>
      <stop offset="100%" stop-color="#0E1D3F"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.2"/>
    </filter>
    <filter id="dropShadowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <!-- header -->
  <rect x="40" y="30" width="720" height="56" rx="18" fill="url(#headerGrad)" filter="url(#dropShadowSoft)"/>
  <text x="400" y="66" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">이주 방식에 따른 전세시장 영향 비교</text>

  <!-- left column: 이주 집중 -->
  <g transform="translate(60,110)">
    <rect x="0" y="0" width="330" height="440" rx="22" fill="url(#leftCard)" filter="url(#dropShadow)"/>
    <circle cx="48" cy="46" r="26" fill="url(#badgeLeft)" filter="url(#dropShadowSoft)"/>
    <text x="48" y="54" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">1</text>
    <text x="86" y="54" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#7A3A1C">이주 집중 시</text>

    <rect x="24" y="92" width="282" height="80" rx="16" fill="#FFFFFF" opacity="0.7" filter="url(#dropShadowSoft)"/>
    <text x="40" y="124" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" fill="#5A3018">여러 단지가 동시에</text>
    <text x="40" y="150" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" fill="#5A3018">이주를 시작</text>

    <text x="40" y="208" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#7A3A1C">인근 전세 수요 집중</text>
    <rect x="40" y="218" width="266" height="16" rx="8" fill="#FBD9BF"/>
    <rect x="40" y="218" width="230" height="16" rx="8" fill="url(#barLeft)"/>

    <text x="40" y="266" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#7A3A1C">전세 물건 여유분</text>
    <rect x="40" y="276" width="266" height="16" rx="8" fill="#FBD9BF"/>
    <rect x="40" y="276" width="70" height="16" rx="8" fill="url(#barLeft)"/>

    <rect x="24" y="320" width="282" height="96" rx="16" fill="#FFFFFF" opacity="0.7" filter="url(#dropShadowSoft)"/>
    <text x="40" y="348" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#A8401E">예상되는 모습(예시)</text>
    <text x="40" y="374" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#5A3018">국지적 전세난,</text>
    <text x="40" y="398" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#5A3018">단기 전세가 상승 우려</text>
  </g>

  <!-- right column: 분산 대책 -->
  <g transform="translate(410,110)">
    <rect x="0" y="0" width="330" height="440" rx="22" fill="url(#rightCard)" filter="url(#dropShadow)"/>
    <circle cx="48" cy="46" r="26" fill="url(#badgeRight)" filter="url(#dropShadowSoft)"/>
    <text x="48" y="54" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">2</text>
    <text x="86" y="54" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#15664A">분산 대책 적용 시</text>

    <rect x="24" y="92" width="282" height="80" rx="16" fill="#FFFFFF" opacity="0.7" filter="url(#dropShadowSoft)"/>
    <text x="40" y="124" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" fill="#1C5A42">단지별 이주 시기를</text>
    <text x="40" y="150" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" fill="#1C5A42">순차적으로 조정</text>

    <text x="40" y="208" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#15664A">인근 전세 수요 집중</text>
    <rect x="40" y="218" width="266" height="16" rx="8" fill="#CFF0E1"/>
    <rect x="40" y="218" width="120" height="16" rx="8" fill="url(#barRight)"/>

    <text x="40" y="266" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#15664A">전세 물건 여유분</text>
    <rect x="40" y="276" width="266" height="16" rx="8" fill="#CFF0E1"/>
    <rect x="40" y="276" width="190" height="16" rx="8" fill="url(#barRight)"/>

    <rect x="24" y="320" width="282" height="96" rx="16" fill="#FFFFFF" opacity="0.7" filter="url(#dropShadowSoft)"/>
    <text x="40" y="348" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#15804F">기대되는 모습(예시)</text>
    <text x="40" y="374" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#1C5A42">공공임대·신축 입주 연계로</text>
    <text x="40" y="398" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" fill="#1C5A42">수급 부담 완화 기대</text>
  </g>

  <text x="400" y="575" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#5E7A9C">* 수치는 이해를 돕기 위한 예시이며 실제 통계가 아닙니다.</text>
</svg>
