<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6F0FA"/>
      <stop offset="50%" stop-color="#3D6FA8"/>
      <stop offset="100%" stop-color="#0E1D3F"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9FD4F0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#9FD4F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDF6E3"/>
      <stop offset="100%" stop-color="#F0D9A0"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F08A5D"/>
      <stop offset="100%" stop-color="#C85A3C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.65"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B1030" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="140" r="260" fill="url(#glow1)"/>
  <circle cx="150" cy="540" r="260" fill="url(#glow2)"/>

  <!-- cluster of small houses (new town) -->
  <g transform="translate(870,440)" filter="url(#softShadow)">
    <g transform="translate(-130,10) scale(0.8)">
      <rect x="-70" y="-10" width="140" height="110" rx="10" fill="url(#houseGrad)"/>
      <polygon points="-82,-10 0,-70 82,-10" fill="url(#roofGrad)"/>
      <rect x="-20" y="30" width="40" height="70" rx="6" fill="#2E4C6E"/>
    </g>
    <g transform="translate(20,-10)">
      <rect x="-80" y="-30" width="160" height="150" rx="12" fill="url(#houseGrad)"/>
      <polygon points="-94,-30 0,-100 94,-30" fill="url(#roofGrad)"/>
      <rect x="-54" y="10" width="40" height="40" rx="6" fill="#2E4C6E"/>
      <rect x="14" y="10" width="40" height="40" rx="6" fill="#2E4C6E"/>
    </g>
    <g transform="translate(170,15) scale(0.75)">
      <rect x="-70" y="-10" width="140" height="110" rx="10" fill="url(#houseGrad)"/>
      <polygon points="-82,-10 0,-70 82,-10" fill="url(#roofGrad)"/>
      <rect x="-20" y="30" width="40" height="70" rx="6" fill="#2E4C6E"/>
    </g>
  </g>

  <!-- moving / migration arrow badge -->
  <g transform="translate(1080,250)" filter="url(#softShadow)">
    <circle r="42" fill="#5EC8E8"/>
    <path d="M -16,0 L 14,0 M 2,-14 L 16,0 L 2,14" stroke="#0E3A57" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- key/people dots suggesting tenants -->
  <g fill="#C8E6F7" opacity="0.8">
    <circle cx="150" cy="150" r="7"/>
    <circle cx="190" cy="130" r="7"/>
    <circle cx="170" cy="190" r="7"/>
  </g>

  <!-- title card -->
  <g transform="translate(70,70)">
    <rect x="-20" y="-20" width="640" height="150" rx="24" fill="url(#cardGrad)" filter="url(#softShadow)"/>
    <text x="10" y="35" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="34" font-weight="700" fill="#122C4A">1기 신도시 재건축 이주</text>
    <text x="10" y="85" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="34" font-weight="700" fill="#122C4A">본격화, 전세시장은</text>
    <text x="10" y="120" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" fill="#3D6FA8">부동산정책 · 오늘의 이슈</text>
  </g>
</svg>
