<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6EA"/>
      <stop offset="100%" stop-color="#FFE3C2"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF1DE"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC98B"/>
      <stop offset="100%" stop-color="#E8974A"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA96A"/>
      <stop offset="100%" stop-color="#D9702A"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8A4D"/>
      <stop offset="100%" stop-color="#C1551C"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9D5C"/>
      <stop offset="100%" stop-color="#B84C18"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#6B2A0D" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="55" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#7A2E12" text-anchor="middle">단계별 스트레스 DSR 가산금리와 대출 한도 변화 (예시)</text>
  <text x="400" y="85" font-family="Arial, sans-serif" font-size="15" fill="#9C5A28" text-anchor="middle">※ 수치는 이해를 돕기 위한 예시이며 실제 적용 수치는 금융당국·금융사 공고를 확인해야 합니다</text>

  <!-- three stage cards -->
  <g>
    <!-- Stage 1 -->
    <g transform="translate(70,130)">
      <rect x="0" y="0" width="190" height="400" rx="22" fill="url(#cardGrad1)" filter="url(#cardShadow)"/>
      <circle cx="95" cy="-10" r="34" fill="url(#badgeGrad)" filter="url(#cardShadow)"/>
      <text x="95" y="1" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#FFF8EC" text-anchor="middle">1</text>
      <text x="95" y="50" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#7A2E12" text-anchor="middle">1단계</text>
      <text x="95" y="75" font-family="Arial, sans-serif" font-size="13" fill="#9C5A28" text-anchor="middle">가산금리 적용 예시(소)</text>
      <rect x="40" y="280" width="110" height="90" rx="12" fill="url(#barGrad1)"/>
      <text x="95" y="260" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#7A2E12" text-anchor="middle">대출 한도</text>
      <text x="95" y="330" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#FFF8EC" text-anchor="middle">높음</text>
    </g>

    <!-- arrow 1 -->
    <polygon points="268,320 300,330 268,340" fill="#C1551C"/>

    <!-- Stage 2 -->
    <g transform="translate(305,130)">
      <rect x="0" y="0" width="190" height="400" rx="22" fill="url(#cardGrad1)" filter="url(#cardShadow)"/>
      <circle cx="95" cy="-10" r="34" fill="url(#badgeGrad)" filter="url(#cardShadow)"/>
      <text x="95" y="1" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#FFF8EC" text-anchor="middle">2</text>
      <text x="95" y="50" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#7A2E12" text-anchor="middle">2단계</text>
      <text x="95" y="75" font-family="Arial, sans-serif" font-size="13" fill="#9C5A28" text-anchor="middle">가산금리 적용 예시(중)</text>
      <rect x="40" y="310" width="110" height="60" rx="12" fill="url(#barGrad2)"/>
      <text x="95" y="290" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#7A2E12" text-anchor="middle">대출 한도</text>
      <text x="95" y="345" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#FFF8EC" text-anchor="middle">중간</text>
    </g>

    <!-- arrow 2 -->
    <polygon points="503,320 535,330 503,340" fill="#C1551C"/>

    <!-- Stage 3 -->
    <g transform="translate(540,130)">
      <rect x="0" y="0" width="190" height="400" rx="22" fill="url(#cardGrad1)" filter="url(#cardShadow)"/>
      <circle cx="95" cy="-10" r="34" fill="url(#badgeGrad)" filter="url(#cardShadow)"/>
      <text x="95" y="1" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#FFF8EC" text-anchor="middle">3</text>
      <text x="95" y="50" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#7A2E12" text-anchor="middle">3단계</text>
      <text x="95" y="75" font-family="Arial, sans-serif" font-size="13" fill="#9C5A28" text-anchor="middle">가산금리 적용 예시(대)</text>
      <rect x="40" y="335" width="110" height="35" rx="10" fill="url(#barGrad3)"/>
      <text x="95" y="315" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#7A2E12" text-anchor="middle">대출 한도</text>
      <text x="95" y="357" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#FFF8EC" text-anchor="middle">축소</text>
    </g>
  </g>

  <text x="400" y="565" font-family="Arial, sans-serif" font-size="15" fill="#7A2E12" text-anchor="middle">단계가 올라갈수록 가산금리 반영 폭이 커져 계산상 대출 한도는 줄어드는 구조</text>
</svg>
