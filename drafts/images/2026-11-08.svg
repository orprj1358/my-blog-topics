<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="50%" stop-color="#E08A3C"/>
      <stop offset="100%" stop-color="#7A2E12"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD39A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFD39A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE3A8"/>
      <stop offset="100%" stop-color="#E8A33E"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9D5C"/>
      <stop offset="100%" stop-color="#C1551C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.65"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4A1C06" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1030" cy="130" r="260" fill="url(#glow1)"/>
  <circle cx="140" cy="540" r="260" fill="url(#glow2)"/>

  <!-- coin stack with percent badge, right side -->
  <g transform="translate(900,430)" filter="url(#softShadow)">
    <ellipse cx="0" cy="70" rx="150" ry="26" fill="#5A1F08" opacity="0.18"/>
    <ellipse cx="0" cy="50" rx="130" ry="30" fill="url(#coinGrad)"/>
    <ellipse cx="0" cy="18" rx="130" ry="30" fill="url(#coinGrad)"/>
    <ellipse cx="0" cy="-14" rx="130" ry="30" fill="url(#coinGrad)"/>
    <circle cx="0" cy="-60" r="78" fill="url(#badgeGrad)"/>
    <text x="0" y="-45" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#FFF8EC" text-anchor="middle">%</text>
  </g>

  <!-- small secondary coin cluster -->
  <g transform="translate(220,470)" filter="url(#softShadow)" opacity="0.9">
    <ellipse cx="0" cy="30" rx="80" ry="18" fill="url(#coinGrad)"/>
    <ellipse cx="0" cy="8" rx="80" ry="18" fill="url(#coinGrad)"/>
    <circle cx="0" cy="-28" r="46" fill="url(#badgeGrad)"/>
    <text x="0" y="-18" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#FFF8EC" text-anchor="middle">%</text>
  </g>

  <!-- title card -->
  <g transform="translate(80,110)">
    <rect x="-20" y="-55" width="640" height="190" rx="28" fill="url(#cardGrad)" filter="url(#softShadow)"/>
    <text x="10" y="-5" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#7A2E12">스트레스 DSR 3단계</text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#7A2E12">내 대출 한도는?</text>
    <rect x="10" y="80" width="150" height="10" rx="5" fill="#E08A3C"/>
  </g>

  <text x="80" y="560" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#FFF3E0" opacity="0.9">대출 · 금융 상식</text>
</svg>
