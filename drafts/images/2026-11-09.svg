<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F0FF"/>
      <stop offset="50%" stop-color="#3B4FA0"/>
      <stop offset="100%" stop-color="#15245C"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7FE8D6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7FE8D6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9DB2FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9DB2FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8FF5E2"/>
      <stop offset="100%" stop-color="#28B8A6"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6E86E8"/>
      <stop offset="100%" stop-color="#2E3E8C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.68"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0E1A42" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1030" cy="130" r="260" fill="url(#glow1)"/>
  <circle cx="140" cy="540" r="260" fill="url(#glow2)"/>

  <!-- network / chip motif, right side -->
  <g transform="translate(900,420)" filter="url(#softShadow)">
    <rect x="-90" y="-90" width="180" height="180" rx="28" fill="url(#chipGrad)"/>
    <rect x="-55" y="-55" width="110" height="110" rx="14" fill="#15245C" opacity="0.85"/>
    <circle cx="0" cy="0" r="18" fill="#8FF5E2"/>
    <line x1="-90" y1="-50" x2="-130" y2="-50" stroke="#8FF5E2" stroke-width="6" stroke-linecap="round"/>
    <line x1="-90" y1="0" x2="-130" y2="0" stroke="#8FF5E2" stroke-width="6" stroke-linecap="round"/>
    <line x1="-90" y1="50" x2="-130" y2="50" stroke="#8FF5E2" stroke-width="6" stroke-linecap="round"/>
    <line x1="90" y1="-50" x2="130" y2="-50" stroke="#8FF5E2" stroke-width="6" stroke-linecap="round"/>
    <line x1="90" y1="0" x2="130" y2="0" stroke="#8FF5E2" stroke-width="6" stroke-linecap="round"/>
    <line x1="90" y1="50" x2="130" y2="50" stroke="#8FF5E2" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-130" cy="-50" r="8" fill="#8FF5E2"/>
    <circle cx="-130" cy="0" r="8" fill="#8FF5E2"/>
    <circle cx="-130" cy="50" r="8" fill="#8FF5E2"/>
    <circle cx="130" cy="-50" r="8" fill="#8FF5E2"/>
    <circle cx="130" cy="0" r="8" fill="#8FF5E2"/>
    <circle cx="130" cy="50" r="8" fill="#8FF5E2"/>
  </g>

  <!-- small secondary node cluster -->
  <g transform="translate(220,480)" filter="url(#softShadow)" opacity="0.9">
    <circle cx="0" cy="0" r="46" fill="url(#badgeGrad)"/>
    <text x="0" y="12" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#E8F0FF" text-anchor="middle">AI</text>
  </g>

  <!-- title card -->
  <g transform="translate(80,100)">
    <rect x="-20" y="-55" width="660" height="190" rx="28" fill="url(#cardGrad)" filter="url(#softShadow)"/>
    <text x="10" y="-5" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#1E2E6E">빅테크 AI 투자 '거품론'</text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#1E2E6E">실적 시즌이 분수령</text>
    <rect x="10" y="80" width="150" height="10" rx="5" fill="#28B8A6"/>
  </g>

  <text x="80" y="560" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#E8F0FF" opacity="0.9">AI 관련 소식</text>
</svg>
