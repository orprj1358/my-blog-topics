<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4E3"/>
      <stop offset="50%" stop-color="#E08A3C"/>
      <stop offset="100%" stop-color="#8A3F12"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD9A0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFD9A0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB37A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFB37A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE3A8"/>
      <stop offset="100%" stop-color="#E8A23B"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0914B"/>
      <stop offset="100%" stop-color="#A4511A"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.68"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#5C280A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1030" cy="130" r="260" fill="url(#glow1)"/>
  <circle cx="140" cy="540" r="260" fill="url(#glow2)"/>

  <!-- coin / percent badge motif, right side -->
  <g transform="translate(900,420)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="100" fill="url(#coinGrad)"/>
    <circle cx="0" cy="0" r="78" fill="none" stroke="#A4511A" stroke-width="5" opacity="0.6"/>
    <text x="0" y="22" font-family="Arial, sans-serif" font-size="64" font-weight="800" fill="#8A3F12" text-anchor="middle">%</text>
  </g>

  <!-- small secondary coin cluster, two overlapping circles (2nd-tier lending motif) -->
  <g transform="translate(230,500)" filter="url(#softShadow)" opacity="0.95">
    <circle cx="-22" cy="0" r="46" fill="url(#badgeGrad)"/>
    <circle cx="30" cy="8" r="46" fill="url(#coinGrad)"/>
  </g>

  <!-- title card -->
  <g transform="translate(80,100)">
    <rect x="-20" y="-55" width="680" height="190" rx="28" fill="url(#cardGrad)" filter="url(#softShadow)"/>
    <text x="10" y="-5" font-family="Arial, sans-serif" font-size="36" font-weight="800" fill="#7A3A10">은행권 대출 조이기 여파</text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="36" font-weight="800" fill="#7A3A10">제2금융권 '풍선효과' 우려</text>
    <rect x="10" y="80" width="150" height="10" rx="5" fill="#E8A23B"/>
  </g>

  <text x="80" y="560" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#FFF4E3" opacity="0.95">대출</text>
</svg>
