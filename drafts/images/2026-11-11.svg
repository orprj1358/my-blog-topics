<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="55%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="960" cy="140" r="260" fill="url(#glow1)"/>
  <circle cx="160" cy="520" r="260" fill="url(#glow2)"/>

  <!-- decorative network motif, top right -->
  <g opacity="0.9">
    <circle cx="980" cy="160" r="46" fill="none" stroke="url(#chipGrad)" stroke-width="3"/>
    <rect x="955" y="135" width="50" height="50" rx="10" fill="url(#chipGrad)" opacity="0.85"/>
    <circle cx="1070" cy="110" r="10" fill="#5eead4"/>
    <circle cx="1095" cy="190" r="8" fill="#a5f3fc"/>
    <circle cx="900" cy="95" r="7" fill="#818cf8"/>
    <line x1="980" y1="160" x2="1070" y2="110" stroke="#a5f3fc" stroke-width="2" opacity="0.6"/>
    <line x1="980" y1="160" x2="1095" y2="190" stroke="#a5f3fc" stroke-width="2" opacity="0.6"/>
    <line x1="980" y1="160" x2="900" y2="95" stroke="#a5f3fc" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- simple document/shield icon, bottom left -->
  <g opacity="0.85">
    <rect x="110" y="430" width="90" height="110" rx="14" fill="none" stroke="#5eead4" stroke-width="3"/>
    <line x1="128" y1="460" x2="182" y2="460" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>
    <line x1="128" y1="480" x2="182" y2="480" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>
    <line x1="128" y1="500" x2="160" y2="500" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>
    <circle cx="225" cy="500" r="30" fill="url(#chipGrad)" opacity="0.85"/>
    <path d="M 213 500 l 8 8 l 16 -16" stroke="#0f172a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- text block -->
  <text x="100" y="260" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="58" font-weight="700" fill="#f0fdfa">AI기본법 시행 임박</text>
  <text x="100" y="330" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="30" font-weight="500" fill="#c7d2fe">국내 AI 기업과 이용자가 알아둘 변화</text>

  <rect x="100" y="368" width="150" height="6" rx="3" fill="url(#chipGrad)"/>
</svg>
