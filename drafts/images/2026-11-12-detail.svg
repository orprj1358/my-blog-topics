<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1e1b4b" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="52" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="26" font-weight="700" fill="#312e81">AI 확산이 전력 수요로 이어지는 흐름</text>

  <!-- Step 1 -->
  <rect x="80" y="90" width="640" height="118" rx="20" fill="url(#card1)" filter="url(#cardShadow)"/>
  <circle cx="140" cy="149" r="30" fill="#ffffff" opacity="0.92"/>
  <text x="140" y="159" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="26" font-weight="700" fill="#4338ca">1</text>
  <text x="190" y="138" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#ffffff">AI 서비스 확산</text>
  <text x="190" y="170" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" fill="#e0e7ff">챗봇·이미지 생성 등 이용 급증으로 연산량 증가</text>

  <!-- arrow 1 -->
  <path d="M 400 208 L 400 240" stroke="#94a3b8" stroke-width="3" fill="none"/>
  <path d="M 390 230 L 400 246 L 410 230" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 2 -->
  <rect x="80" y="252" width="640" height="118" rx="20" fill="url(#card2)" filter="url(#cardShadow)"/>
  <circle cx="140" cy="311" r="30" fill="#ffffff" opacity="0.92"/>
  <text x="140" y="321" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="26" font-weight="700" fill="#0f766e"></text>
  <text x="140" y="321" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="26" font-weight="700" fill="#0f766e">2</text>
  <text x="190" y="300" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#ffffff">데이터센터 전력 수요 급증</text>
  <text x="190" y="332" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" fill="#ecfeff">24시간 안정적 전력이 필요해 전력망 부담 확대</text>

  <!-- arrow 2 -->
  <path d="M 400 370 L 400 402" stroke="#94a3b8" stroke-width="3" fill="none"/>
  <path d="M 390 392 L 400 408 L 410 392" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 3 -->
  <rect x="80" y="414" width="640" height="118" rx="20" fill="url(#card3)" filter="url(#cardShadow)"/>
  <circle cx="140" cy="473" r="30" fill="#ffffff" opacity="0.92"/>
  <text x="140" y="483" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="26" font-weight="700" fill="#b45309">3</text>
  <text x="190" y="462" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#ffffff">전력망 부담 &amp; 대응 모색</text>
  <text x="190" y="494" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" fill="#fff7ed">입지 분산, 효율화, 전력원 다변화 논의 확대</text>

  <text x="400" y="568" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#64748b">(수치·일정은 예시가 아닌 일반적 흐름 설명입니다)</text>
</svg>
