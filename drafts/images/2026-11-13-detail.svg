<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6EA"/>
      <stop offset="100%" stop-color="#FCE6CC"/>
    </linearGradient>
    <linearGradient id="cardGradA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFEBD3"/>
    </linearGradient>
    <linearGradient id="cardGradB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFD9AE"/>
    </linearGradient>
    <linearGradient id="badgeGradA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2A868"/>
      <stop offset="100%" stop-color="#C06A1F"/>
    </linearGradient>
    <linearGradient id="badgeGradB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E88A4A"/>
      <stop offset="100%" stop-color="#9A4A12"/>
    </linearGradient>
    <linearGradient id="barGradA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2A868"/>
      <stop offset="100%" stop-color="#C06A1F"/>
    </linearGradient>
    <linearGradient id="barGradB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E88A4A"/>
      <stop offset="100%" stop-color="#8A3F12"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#5C280A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#7A3A10" text-anchor="middle">스트레스 DSR 단계별 대출한도 변화 (개념도)</text>
  <text x="400" y="66" font-family="Arial, sans-serif" font-size="13" fill="#9C5E22" text-anchor="middle">※ 이해를 돕기 위한 예시 개념도이며 실제 수치가 아닙니다</text>

  <!-- Column headers -->
  <g transform="translate(220,120)">
    <rect x="-110" y="-28" width="220" height="56" rx="18" fill="url(#cardGradA)" filter="url(#cardShadow)"/>
    <circle cx="-80" cy="0" r="22" fill="url(#badgeGradA)"/>
    <text x="-80" y="7" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#FFF6EA" text-anchor="middle">2</text>
    <text x="-40" y="7" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#7A3A10">현재(2단계)</text>
  </g>
  <g transform="translate(580,120)">
    <rect x="-110" y="-28" width="220" height="56" rx="18" fill="url(#cardGradB)" filter="url(#cardShadow)"/>
    <circle cx="-80" cy="0" r="22" fill="url(#badgeGradB)"/>
    <text x="-80" y="7" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#FFF6EA" text-anchor="middle">3</text>
    <text x="-40" y="7" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#7A3A10">3단계 시행 후</text>
  </g>

  <!-- Baseline -->
  <line x1="110" y1="500" x2="690" y2="500" stroke="#C06A1F" stroke-width="2" opacity="0.4"/>

  <!-- Bar A (taller = current limit) -->
  <g filter="url(#cardShadow)">
    <rect x="160" y="230" width="120" height="270" rx="16" fill="url(#barGradA)"/>
  </g>
  <text x="220" y="215" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#7A3A10" text-anchor="middle">가능 대출한도</text>

  <!-- Bar B (shorter = reduced limit) -->
  <g filter="url(#cardShadow)">
    <rect x="520" y="300" width="120" height="200" rx="16" fill="url(#barGradB)"/>
  </g>
  <text x="580" y="285" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#7A3A10" text-anchor="middle">가능 대출한도</text>

  <!-- Down arrow between bars -->
  <g transform="translate(400,330)">
    <circle cx="0" cy="0" r="34" fill="url(#badgeGradB)" filter="url(#cardShadow)"/>
    <path d="M -10,-12 L -10,10 M -18,2 L 0,18 L 18,2" fill="none" stroke="#FFF6EA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="400" y="392" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#9A4A12" text-anchor="middle">가산금리 적용 확대</text>

  <!-- Bottom note cards -->
  <g transform="translate(220,540)">
    <rect x="-110" y="-20" width="220" height="40" rx="14" fill="url(#cardGradA)" filter="url(#cardShadow)"/>
    <text x="0" y="6" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#7A3A10" text-anchor="middle">변동·혼합형 금리 기준</text>
  </g>
  <g transform="translate(580,540)">
    <rect x="-110" y="-20" width="220" height="40" rx="14" fill="url(#cardGradB)" filter="url(#cardShadow)"/>
    <text x="0" y="6" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#7A3A10" text-anchor="middle">한도 축소 가능성 확대</text>
  </g>
</svg>
