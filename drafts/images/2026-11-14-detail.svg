<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF4FC"/>
      <stop offset="100%" stop-color="#D8E6F8"/>
    </linearGradient>
    <linearGradient id="cardGradA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCE9FB"/>
    </linearGradient>
    <linearGradient id="cardGradB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BFD4EF"/>
    </linearGradient>
    <linearGradient id="badgeGradA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6E9BD6"/>
      <stop offset="100%" stop-color="#2E5590"/>
    </linearGradient>
    <linearGradient id="badgeGradB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4E7FC2"/>
      <stop offset="100%" stop-color="#1C3C6E"/>
    </linearGradient>
    <linearGradient id="barGradA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6E9BD6"/>
      <stop offset="100%" stop-color="#2E5590"/>
    </linearGradient>
    <linearGradient id="barGradB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4E7FC2"/>
      <stop offset="100%" stop-color="#16325C"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0C1E3C" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="42" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#16325C" text-anchor="middle">양도세 중과 유예, 연장 여부에 따른 시장 분위기 (개념도)</text>
  <text x="400" y="66" font-family="Arial, sans-serif" font-size="13" fill="#3B5F93" text-anchor="middle">※ 이해를 돕기 위한 예시 개념도이며 실제 수치가 아닙니다</text>

  <!-- Column headers -->
  <g transform="translate(220,120)">
    <rect x="-120" y="-28" width="240" height="56" rx="18" fill="url(#cardGradA)" filter="url(#cardShadow)"/>
    <circle cx="-90" cy="0" r="22" fill="url(#badgeGradA)"/>
    <text x="-90" y="7" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#EEF4FC" text-anchor="middle">A</text>
    <text x="-30" y="7" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#16325C">유예 연장 시</text>
  </g>
  <g transform="translate(580,120)">
    <rect x="-120" y="-28" width="240" height="56" rx="18" fill="url(#cardGradB)" filter="url(#cardShadow)"/>
    <circle cx="-90" cy="0" r="22" fill="url(#badgeGradB)"/>
    <text x="-90" y="7" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#EEF4FC" text-anchor="middle">B</text>
    <text x="-30" y="7" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#16325C">유예 종료 시</text>
  </g>

  <!-- Baseline -->
  <line x1="110" y1="500" x2="690" y2="500" stroke="#2E5590" stroke-width="2" opacity="0.35"/>

  <!-- Bar A (steady, moderate height = calmer market) -->
  <g filter="url(#cardShadow)">
    <rect x="160" y="300" width="120" height="200" rx="16" fill="url(#barGradA)"/>
  </g>
  <text x="220" y="285" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#16325C" text-anchor="middle">매도 보류·임대 전환 증가</text>

  <!-- Bar B (taller = rush to sell before deadline) -->
  <g filter="url(#cardShadow)">
    <rect x="520" y="230" width="120" height="270" rx="16" fill="url(#barGradB)"/>
  </g>
  <text x="580" y="215" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#16325C" text-anchor="middle">연내 매도 서두름 증가</text>

  <!-- Divider arrow between columns -->
  <g transform="translate(400,330)">
    <circle cx="0" cy="0" r="34" fill="url(#badgeGradB)" filter="url(#cardShadow)"/>
    <path d="M -14,0 L 14,0 M 4,-10 L 14,0 L 4,10" fill="none" stroke="#EEF4FC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="400" y="392" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2E5590" text-anchor="middle">세제 결정에 따라 분위기 전환</text>

  <!-- Bottom note cards -->
  <g transform="translate(220,540)">
    <rect x="-120" y="-20" width="240" height="40" rx="14" fill="url(#cardGradA)" filter="url(#cardShadow)"/>
    <text x="0" y="6" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#16325C" text-anchor="middle">매물 증가 속도 둔화</text>
  </g>
  <g transform="translate(580,540)">
    <rect x="-120" y="-20" width="240" height="40" rx="14" fill="url(#cardGradB)" filter="url(#cardShadow)"/>
    <text x="0" y="6" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#16325C" text-anchor="middle">단기 매물 쌓일 가능성</text>
  </g>
</svg>
