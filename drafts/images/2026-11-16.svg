<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF1FB"/>
      <stop offset="50%" stop-color="#2E4E8E"/>
      <stop offset="100%" stop-color="#101C40"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8FB4F2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8FB4F2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5A7FC9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5A7FC9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CFE0FB"/>
      <stop offset="100%" stop-color="#6E93D6"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A6FBE"/>
      <stop offset="100%" stop-color="#1E3466"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5F9FF"/>
      <stop offset="100%" stop-color="#C9D9F5"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.68"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0A1430" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="260" fill="url(#glow1)"/>
  <circle cx="130" cy="540" r="260" fill="url(#glow2)"/>

  <!-- house silhouette, right side -->
  <g transform="translate(940,430)" filter="url(#softShadow)">
    <path d="M -90,10 L 0,-80 L 90,10 Z" fill="url(#roofGrad)"/>
    <rect x="-65" y="10" width="130" height="90" rx="10" fill="url(#houseGrad)"/>
    <rect x="-16" y="40" width="32" height="60" rx="6" fill="#1E3466"/>
    <rect x="-45" y="30" width="20" height="20" rx="4" fill="#1E3466" opacity="0.8"/>
    <rect x="25" y="30" width="20" height="20" rx="4" fill="#1E3466" opacity="0.8"/>
  </g>

  <!-- notice document badge cluster -->
  <g transform="translate(210,500)" filter="url(#softShadow)" opacity="0.97">
    <rect x="-55" y="-65" width="110" height="130" rx="14" fill="url(#docGrad)"/>
    <line x1="-35" y1="-35" x2="35" y2="-35" stroke="#5A7FC9" stroke-width="6" stroke-linecap="round"/>
    <line x1="-35" y1="-12" x2="35" y2="-12" stroke="#5A7FC9" stroke-width="6" stroke-linecap="round"/>
    <line x1="-35" y1="11" x2="15" y2="11" stroke="#5A7FC9" stroke-width="6" stroke-linecap="round"/>
    <circle cx="25" cy="38" r="22" fill="url(#roofGrad)"/>
    <text x="25" y="45" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#EAF1FB" text-anchor="middle">₩</text>
  </g>

  <!-- title card -->
  <g transform="translate(80,80)">
    <rect x="-20" y="-55" width="760" height="260" rx="28" fill="url(#cardGrad)" filter="url(#softShadow)"/>
    <text x="10" y="0" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#16264A">11월에 날아온 종부세 고지서</text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#16264A">개편 논의는 왜 다시 뜨거울까</text>
    <rect x="10" y="80" width="150" height="10" rx="5" fill="#3E63B0"/>
  </g>

  <text x="80" y="570" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#EAF1FB" opacity="0.95">부동산정책</text>
</svg>
