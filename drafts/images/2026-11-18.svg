<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4E0"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="coinGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.68"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4A1D0A" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="260" fill="url(#glow1)"/>
  <circle cx="140" cy="540" r="260" fill="url(#glow2)"/>

  <!-- switching arrow + coin, right side -->
  <g transform="translate(950,440)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="100" fill="url(#coinGrad)" opacity="0.95"/>
    <path d="M -45,-10 A 55,55 0 1 1 -45,10" fill="none" stroke="#7C2D12" stroke-width="10" stroke-linecap="round"/>
    <path d="M -58,-14 L -45,-32 L -30,-16" fill="none" stroke="#7C2D12" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 45,10 A 55,55 0 1 1 45,-10" fill="none" stroke="#7C2D12" stroke-width="10" stroke-linecap="round"/>
    <path d="M 58,14 L 45,32 L 30,16" fill="none" stroke="#7C2D12" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="9" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#7C2D12" text-anchor="middle">%</text>
  </g>

  <!-- document + coin badge cluster -->
  <g transform="translate(210,500)" filter="url(#softShadow)" opacity="0.97">
    <rect x="-55" y="-65" width="110" height="130" rx="14" fill="url(#coinGrad2)" opacity="0.25"/>
    <rect x="-55" y="-65" width="110" height="130" rx="14" fill="#FFF8EC"/>
    <line x1="-35" y1="-35" x2="35" y2="-35" stroke="#B45309" stroke-width="6" stroke-linecap="round"/>
    <line x1="-35" y1="-12" x2="35" y2="-12" stroke="#B45309" stroke-width="6" stroke-linecap="round"/>
    <line x1="-35" y1="11" x2="15" y2="11" stroke="#B45309" stroke-width="6" stroke-linecap="round"/>
    <circle cx="25" cy="38" r="22" fill="url(#coinGrad2)"/>
    <text x="25" y="45" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#FFF8EC" text-anchor="middle">₩</text>
  </g>

  <!-- title card -->
  <g transform="translate(80,70)">
    <rect x="-20" y="-55" width="800" height="280" rx="28" fill="url(#cardGrad)" filter="url(#softShadow)"/>
    <text x="10" y="0" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#6B2E0E">중도상환수수료 면제 확대 논의,</text>
    <text x="10" y="50" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#6B2E0E">대출 갈아타기 더 쉬워질까</text>
    <rect x="10" y="78" width="150" height="10" rx="5" fill="#D97706"/>
  </g>

  <text x="80" y="570" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#FFF4E0" opacity="0.95">대출</text>
</svg>
