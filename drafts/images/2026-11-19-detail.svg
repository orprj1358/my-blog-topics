<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF4FC"/>
      <stop offset="100%" stop-color="#D8E6F8"/>
    </linearGradient>
    <linearGradient id="cardGradA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCE9FB"/>
    </linearGradient>
    <linearGradient id="cardGradB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BFD4EF"/>
    </linearGradient>
    <linearGradient id="badgeGradA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6E9BD6"/>
      <stop offset="100%" stop-color="#2E5590"/>
    </linearGradient>
    <linearGradient id="badgeGradB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4E7FC2"/>
      <stop offset="100%" stop-color="#1C3C6E"/>
    </linearGradient>
    <linearGradient id="barGradA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9CC2F2"/>
      <stop offset="100%" stop-color="#4E7FC2"/>
    </linearGradient>
    <linearGradient id="barGradB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6E9BD6"/>
      <stop offset="100%" stop-color="#16325C"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0C1E3C" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="42" font-family="Arial, sans-serif" font-size="21" font-weight="800" fill="#16325C" text-anchor="middle">그린벨트 유지 vs 해제 후 택지 공급 (개념도)</text>
  <text x="400" y="66" font-family="Arial, sans-serif" font-size="13" fill="#3B5F93" text-anchor="middle">※ 이해를 돕기 위한 예시 개념도이며 실제 면적·물량이 아닙니다</text>

  <!-- Column headers -->
  <g transform="translate(220,110)">
    <rect x="-130" y="-28" width="260" height="56" rx="18" fill="url(#cardGradA)" filter="url(#cardShadow)"/>
    <circle cx="-100" cy="0" r="22" fill="url(#badgeGradA)"/>
    <text x="-100" y="7" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#EEF4FC" text-anchor="middle">1</text>
    <text x="-25" y="7" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#16325C">유지 시: 공급 제한적</text>
  </g>
  <g transform="translate(580,110)">
    <rect x="-130" y="-28" width="260" height="56" rx="18" fill="url(#cardGradB)" filter="url(#cardShadow)"/>
    <circle cx="-100" cy="0" r="22" fill="url(#badgeGradB)"/>
    <text x="-100" y="7" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#EEF4FC" text-anchor="middle">2</text>
    <text x="-25" y="7" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#16325C">해제 시: 공급 확대 가능</text>
  </g>

  <!-- Example bars -->
  <g transform="translate(220,195)">
    <rect x="-120" y="-24" width="240" height="48" rx="14" fill="url(#cardGradA)" filter="url(#cardShadow)"/>
    <text x="0" y="6" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#16325C" text-anchor="middle">기존 녹지·택지 비율 유지</text>
  </g>
  <g transform="translate(220,260)">
    <rect x="-120" y="-16" width="240" height="32" rx="12" fill="#D8E6F8"/>
    <rect x="-120" y="-16" width="140" height="32" rx="12" fill="url(#barGradA)"/>
    <text x="0" y="6" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#16325C" text-anchor="middle">공급 가능 물량 (예시)</text>
  </g>

  <g transform="translate(580,195)">
    <rect x="-120" y="-24" width="240" height="48" rx="14" fill="url(#cardGradB)" filter="url(#cardShadow)"/>
    <text x="0" y="6" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#16325C" text-anchor="middle">일부 구역 해제, 택지 추가 확보</text>
  </g>
  <g transform="translate(580,260)">
    <rect x="-120" y="-16" width="240" height="32" rx="12" fill="#D8E6F8"/>
    <rect x="-120" y="-16" width="225" height="32" rx="12" fill="url(#barGradB)"/>
    <text x="0" y="6" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#16325C" text-anchor="middle">공급 가능 물량 (예시, 확대)</text>
  </g>

  <!-- Center connector -->
  <g transform="translate(400,230)">
    <circle cx="0" cy="0" r="30" fill="url(#badgeGradA)" filter="url(#cardShadow)"/>
    <path d="M -12,0 L 12,0 M 4,-8 L 12,0 L 4,8" fill="none" stroke="#EEF4FC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bottom note cards -->
  <g transform="translate(220,420)">
    <rect x="-130" y="-30" width="260" height="60" rx="16" fill="url(#cardGradA)" filter="url(#cardShadow)"/>
    <text x="0" y="-2" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#16325C" text-anchor="middle">녹지·환경 보전에는</text>
    <text x="0" y="18" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#16325C" text-anchor="middle">유리하지만 공급은 제한적</text>
  </g>
  <g transform="translate(580,420)">
    <rect x="-130" y="-30" width="260" height="60" rx="16" fill="url(#cardGradB)" filter="url(#cardShadow)"/>
    <text x="0" y="-2" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#16325C" text-anchor="middle">교통·인프라 선계획 없으면</text>
    <text x="0" y="18" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#16325C" text-anchor="middle">난개발 우려 커질 수 있음</text>
  </g>

  <g transform="translate(400,500)">
    <circle cx="0" cy="0" r="20" fill="url(#badgeGradB)" filter="url(#cardShadow)"/>
    <text x="0" y="6" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#EEF4FC" text-anchor="middle">?</text>
  </g>
  <text x="400" y="535" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#3B5F93" text-anchor="middle">해제 범위와 인프라 계획을 함께 확인하기</text>
</svg>
