<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F0FB"/>
      <stop offset="50%" stop-color="#3B6BB0"/>
      <stop offset="100%" stop-color="#132C52"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9CC2F2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9CC2F2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6E9BD6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6E9BD6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DCE9FB"/>
      <stop offset="100%" stop-color="#9BBDE8"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4E7FC2"/>
      <stop offset="100%" stop-color="#1E3F70"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7FBE8E"/>
      <stop offset="100%" stop-color="#2E6E52"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.68"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0C1E3C" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1030" cy="130" r="260" fill="url(#glow1)"/>
  <circle cx="140" cy="540" r="260" fill="url(#glow2)"/>

  <!-- house icon motif, right side -->
  <g transform="translate(930,420)" filter="url(#softShadow)">
    <rect x="-90" y="-10" width="180" height="120" rx="14" fill="url(#houseGrad)"/>
    <path d="M -110,-10 L 0,-110 L 110,-10 Z" fill="url(#roofGrad)"/>
    <rect x="-24" y="38" width="48" height="72" rx="6" fill="#1C3C6E"/>
    <rect x="-66" y="12" width="30" height="30" rx="6" fill="#FFFFFF" opacity="0.85"/>
    <rect x="36" y="12" width="30" height="30" rx="6" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- greenbelt leaf badge cluster -->
  <g transform="translate(230,500)" filter="url(#softShadow)" opacity="0.97">
    <circle cx="-22" cy="0" r="46" fill="url(#leafGrad)"/>
    <path d="M -22,-26 C 2,-20 10,2 -22,24 C -54,2 -46,-20 -22,-26 Z" fill="#E8F0FB" opacity="0.92"/>
    <path d="M -22,-20 L -22,20" stroke="#2E6E52" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- title card -->
  <g transform="translate(80,80)">
    <rect x="-20" y="-55" width="780" height="260" rx="28" fill="url(#cardGrad)" filter="url(#softShadow)"/>
    <text x="10" y="-5" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#16325C">수도권 그린벨트 해제 추진,</text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#16325C">주택공급 확대 효과 있을까</text>
    <rect x="10" y="82" width="150" height="10" rx="5" fill="#4E7FC2"/>
  </g>

  <text x="80" y="570" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#E8F0FB" opacity="0.95">부동산정책</text>
</svg>
