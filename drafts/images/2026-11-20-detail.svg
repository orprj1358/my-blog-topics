<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAFAF5"/>
      <stop offset="100%" stop-color="#D6EBF6"/>
    </linearGradient>
    <linearGradient id="cardGradA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCFBF3"/>
    </linearGradient>
    <linearGradient id="cardGradB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C9E3F7"/>
    </linearGradient>
    <linearGradient id="badgeGradA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5AC7B8"/>
      <stop offset="100%" stop-color="#1E6E66"/>
    </linearGradient>
    <linearGradient id="badgeGradB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6E9BD6"/>
      <stop offset="100%" stop-color="#1E4F66"/>
    </linearGradient>
    <linearGradient id="barGradA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8FD9CC"/>
      <stop offset="100%" stop-color="#1E6E66"/>
    </linearGradient>
    <linearGradient id="barGradB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9CC2F2"/>
      <stop offset="100%" stop-color="#1E4F66"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0B1E3C" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="42" font-family="Arial, sans-serif" font-size="21" font-weight="800" fill="#153545" text-anchor="middle">일반 서버 vs AI 서버, 전력 소비 비교 (개념도)</text>
  <text x="400" y="66" font-family="Arial, sans-serif" font-size="13" fill="#2E6E7E" text-anchor="middle">※ 이해를 돕기 위한 예시 개념도이며 실제 수치가 아닙니다</text>

  <!-- Column headers -->
  <g transform="translate(220,110)">
    <rect x="-130" y="-28" width="260" height="56" rx="18" fill="url(#cardGradA)" filter="url(#cardShadow)"/>
    <circle cx="-100" cy="0" r="22" fill="url(#badgeGradA)"/>
    <text x="-100" y="7" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#EAFAF5" text-anchor="middle">1</text>
    <text x="-25" y="7" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#153545">일반 서버: 전력 소비 적음</text>
  </g>
  <g transform="translate(580,110)">
    <rect x="-130" y="-28" width="260" height="56" rx="18" fill="url(#cardGradB)" filter="url(#cardShadow)"/>
    <circle cx="-100" cy="0" r="22" fill="url(#badgeGradB)"/>
    <text x="-100" y="7" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#EAFAF5" text-anchor="middle">2</text>
    <text x="-25" y="7" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#153545">AI 서버: 전력 소비 급증</text>
  </g>

  <!-- Example bars -->
  <g transform="translate(220,195)">
    <rect x="-120" y="-24" width="240" height="48" rx="14" fill="url(#cardGradA)" filter="url(#cardShadow)"/>
    <text x="0" y="6" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#153545" text-anchor="middle">일상적 연산 위주 가동</text>
  </g>
  <g transform="translate(220,260)">
    <rect x="-120" y="-16" width="240" height="32" rx="12" fill="#D6EBF6"/>
    <rect x="-120" y="-16" width="100" height="32" rx="12" fill="url(#barGradA)"/>
    <text x="0" y="6" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#153545" text-anchor="middle">전력 사용량 (예시)</text>
  </g>

  <g transform="translate(580,195)">
    <rect x="-120" y="-24" width="240" height="48" rx="14" fill="url(#cardGradB)" filter="url(#cardShadow)"/>
    <text x="0" y="6" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#153545" text-anchor="middle">대규모 연산 24시간 가동</text>
  </g>
  <g transform="translate(580,260)">
    <rect x="-120" y="-16" width="240" height="32" rx="12" fill="#D6EBF6"/>
    <rect x="-120" y="-16" width="225" height="32" rx="12" fill="url(#barGradB)"/>
    <text x="0" y="6" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#153545" text-anchor="middle">전력 사용량 (예시, 급증)</text>
  </g>

  <!-- Center connector -->
  <g transform="translate(400,230)">
    <circle cx="0" cy="0" r="30" fill="url(#badgeGradA)" filter="url(#cardShadow)"/>
    <path d="M -12,0 L 12,0 M 4,-8 L 12,0 L 4,8" fill="none" stroke="#EAFAF5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bottom note cards -->
  <g transform="translate(220,420)">
    <rect x="-130" y="-30" width="260" height="60" rx="16" fill="url(#cardGradA)" filter="url(#cardShadow)"/>
    <text x="0" y="-2" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#153545" text-anchor="middle">기존 전력망 안에서</text>
    <text x="0" y="18" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#153545" text-anchor="middle">대체로 안정적으로 운영</text>
  </g>
  <g transform="translate(580,420)">
    <rect x="-130" y="-30" width="260" height="60" rx="16" fill="url(#cardGradB)" filter="url(#cardShadow)"/>
    <text x="0" y="-2" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#153545" text-anchor="middle">전력·냉각 수요 급증,</text>
    <text x="0" y="18" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#153545" text-anchor="middle">전력망 확충 필요성 커짐</text>
  </g>

  <g transform="translate(400,500)">
    <circle cx="0" cy="0" r="20" fill="url(#badgeGradB)" filter="url(#cardShadow)"/>
    <text x="0" y="6" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#EAFAF5" text-anchor="middle">?</text>
  </g>
  <text x="400" y="535" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2E6E7E" text-anchor="middle">전력망 확충 속도와 요금 영향 함께 지켜보기</text>
</svg>
