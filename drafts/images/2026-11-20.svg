<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4F5F2"/>
      <stop offset="50%" stop-color="#2E6E7E"/>
      <stop offset="100%" stop-color="#1B2A52"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7FD9C4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7FD9C4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6E7FD6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6E7FD6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DCFBF3"/>
      <stop offset="100%" stop-color="#8FD9CC"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5AC7B8"/>
      <stop offset="100%" stop-color="#1E4F66"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="100%" stop-color="#E0A93A"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.68"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B1E3C" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="260" fill="url(#glow1)"/>
  <circle cx="130" cy="540" r="260" fill="url(#glow2)"/>

  <!-- AI chip / network motif, right side -->
  <g transform="translate(940,400)" filter="url(#softShadow)">
    <rect x="-70" y="-70" width="140" height="140" rx="20" fill="url(#chipGrad)"/>
    <circle cx="0" cy="0" r="30" fill="url(#nodeGrad)"/>
    <circle cx="-95" cy="-95" r="10" fill="url(#nodeGrad)"/>
    <circle cx="95" cy="-95" r="10" fill="url(#nodeGrad)"/>
    <circle cx="-95" cy="95" r="10" fill="url(#nodeGrad)"/>
    <circle cx="95" cy="95" r="10" fill="url(#nodeGrad)"/>
    <line x1="-85" y1="-85" x2="-20" y2="-20" stroke="#1E4F66" stroke-width="4"/>
    <line x1="85" y1="-85" x2="20" y2="-20" stroke="#1E4F66" stroke-width="4"/>
    <line x1="-85" y1="85" x2="-20" y2="20" stroke="#1E4F66" stroke-width="4"/>
    <line x1="85" y1="85" x2="20" y2="20" stroke="#1E4F66" stroke-width="4"/>
  </g>

  <!-- power bolt badge cluster, bottom-left -->
  <g transform="translate(220,500)" filter="url(#softShadow)" opacity="0.97">
    <circle cx="-22" cy="0" r="46" fill="url(#nodeGrad)"/>
    <path d="M -10,-24 L -32,2 L -16,2 L -26,26 L 4,-4 L -12,-4 Z" fill="url(#boltGrad)" transform="translate(0,0)"/>
  </g>

  <!-- title card -->
  <g transform="translate(80,70)">
    <rect x="-20" y="-55" width="800" height="260" rx="28" fill="url(#cardGrad)" filter="url(#softShadow)"/>
    <text x="10" y="-5" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#153545">AI 데이터센터발 전력난,</text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#153545">우리 전력망도 영향권일까</text>
    <rect x="10" y="82" width="150" height="10" rx="5" fill="#2E8E7E"/>
  </g>

  <text x="80" y="570" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#E4F5F2" opacity="0.95">AI 관련 소식</text>
</svg>
