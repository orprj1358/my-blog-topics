<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF3FA"/>
      <stop offset="100%" stop-color="#DCE6F5"/>
    </linearGradient>
    <linearGradient id="upCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCE8FA"/>
    </linearGradient>
    <linearGradient id="downCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E3EAF6"/>
    </linearGradient>
    <linearGradient id="upBadge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7FA6E0"/>
      <stop offset="100%" stop-color="#3A5B8C"/>
    </linearGradient>
    <linearGradient id="downBadge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A9B9D6"/>
      <stop offset="100%" stop-color="#5C6E94"/>
    </linearGradient>
    <linearGradient id="centerBadge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD98A"/>
      <stop offset="100%" stop-color="#E0A93A"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#15213F" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="55" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#1C2F52" text-anchor="middle">현실화율을 조정하면, 무엇이 달라질까</text>
  <text x="400" y="86" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#5C6E94" text-anchor="middle">(수치는 예시이며 실제 비율·금액은 발표 내용을 확인해야 합니다)</text>

  <!-- left card: raise -->
  <g>
    <rect x="60" y="130" width="300" height="400" rx="22" fill="url(#upCard)" filter="url(#cardShadow)"/>
    <circle cx="210" cy="190" r="34" fill="url(#upBadge)"/>
    <text x="210" y="201" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#F3F7FC" text-anchor="middle">▲</text>
    <text x="210" y="248" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#1C2F52" text-anchor="middle">현실화율 인상</text>

    <circle cx="100" cy="295" r="14" fill="url(#upBadge)"/>
    <text x="100" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#F3F7FC" text-anchor="middle">1</text>
    <text x="126" y="300" font-family="Arial, sans-serif" font-size="15" fill="#2A3C5E">시세와 공시가격 격차 축소</text>

    <circle cx="100" cy="345" r="14" fill="url(#upBadge)"/>
    <text x="100" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#F3F7FC" text-anchor="middle">2</text>
    <text x="126" y="350" font-family="Arial, sans-serif" font-size="15" fill="#2A3C5E">보유세·건보료 부담 증가 우려</text>

    <circle cx="100" cy="395" r="14" fill="url(#upBadge)"/>
    <text x="100" y="400" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#F3F7FC" text-anchor="middle">3</text>
    <text x="126" y="400" font-family="Arial, sans-serif" font-size="15" fill="#2A3C5E">1주택 실거주자 완충장치 필요</text>

    <circle cx="100" cy="445" r="14" fill="url(#upBadge)"/>
    <text x="100" y="450" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#F3F7FC" text-anchor="middle">4</text>
    <text x="126" y="450" font-family="Arial, sans-serif" font-size="15" fill="#2A3C5E">과세 형평성은 개선되는 방향</text>
  </g>

  <!-- center vs badge -->
  <circle cx="400" cy="330" r="30" fill="url(#centerBadge)" filter="url(#cardShadow)"/>
  <text x="400" y="338" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#4A3105" text-anchor="middle">VS</text>

  <!-- right card: lower -->
  <g>
    <rect x="440" y="130" width="300" height="400" rx="22" fill="url(#downCard)" filter="url(#cardShadow)"/>
    <circle cx="590" cy="190" r="34" fill="url(#downBadge)"/>
    <text x="590" y="201" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#F3F7FC" text-anchor="middle">▼</text>
    <text x="590" y="248" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#1C2F52" text-anchor="middle">현실화율 인하·동결</text>

    <circle cx="480" cy="295" r="14" fill="url(#downBadge)"/>
    <text x="480" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#F3F7FC" text-anchor="middle">1</text>
    <text x="506" y="300" font-family="Arial, sans-serif" font-size="15" fill="#2A3C5E">단기 세부담 증가 완화</text>

    <circle cx="480" cy="345" r="14" fill="url(#downBadge)"/>
    <text x="480" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#F3F7FC" text-anchor="middle">2</text>
    <text x="506" y="350" font-family="Arial, sans-serif" font-size="15" fill="#2A3C5E">시세와 격차는 다시 벌어짐</text>

    <circle cx="480" cy="395" r="14" fill="url(#downBadge)"/>
    <text x="480" y="400" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#F3F7FC" text-anchor="middle">3</text>
    <text x="506" y="400" font-family="Arial, sans-serif" font-size="15" fill="#2A3C5E">지역·유형별 형평성 논란 소지</text>

    <circle cx="480" cy="445" r="14" fill="url(#downBadge)"/>
    <text x="480" y="450" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#F3F7FC" text-anchor="middle">4</text>
    <text x="506" y="450" font-family="Arial, sans-serif" font-size="15" fill="#2A3C5E">재정·복지기준 연계 효과 제한</text>
  </g>

  <text x="400" y="570" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#5C6E94" text-anchor="middle">※ 실제 조정 방향과 수치는 발표 전까지 확정되지 않았습니다</text>
</svg>
