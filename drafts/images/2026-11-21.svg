<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7EEF7"/>
      <stop offset="50%" stop-color="#3A5B8C"/>
      <stop offset="100%" stop-color="#15213F"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8FB4E8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8FB4E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5A7FC0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5A7FC0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD98A"/>
      <stop offset="100%" stop-color="#E0A93A"/>
    </linearGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3F7FC"/>
      <stop offset="100%" stop-color="#C4D5EC"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9FC2EE"/>
      <stop offset="100%" stop-color="#3A5B8C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.68"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B1630" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="260" fill="url(#glow1)"/>
  <circle cx="130" cy="540" r="260" fill="url(#glow2)"/>

  <!-- house icon, right side -->
  <g transform="translate(960,400)" filter="url(#softShadow)">
    <rect x="-90" y="-10" width="180" height="120" rx="14" fill="url(#houseGrad)"/>
    <path d="M -110,-10 L 0,-100 L 110,-10 Z" fill="url(#roofGrad)"/>
    <rect x="-20" y="40" width="40" height="70" rx="6" fill="#3A5B8C"/>
    <circle cx="55" cy="60" r="9" fill="#3A5B8C"/>
  </g>

  <!-- coin / percent badge cluster, bottom-left -->
  <g transform="translate(220,500)" filter="url(#softShadow)" opacity="0.97">
    <circle cx="-22" cy="0" r="46" fill="url(#coinGrad)"/>
    <text x="-22" y="12" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#F3F7FC" text-anchor="middle">%</text>
  </g>

  <!-- title card -->
  <g transform="translate(80,70)">
    <rect x="-20" y="-55" width="820" height="260" rx="28" fill="url(#cardGrad)" filter="url(#softShadow)"/>
    <text x="10" y="-5" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#1C2F52">공시가격 현실화율 재조정,</text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#1C2F52">보유세 부담 어떻게 달라질까</text>
    <rect x="10" y="82" width="150" height="10" rx="5" fill="#3A5B8C"/>
  </g>

  <text x="80" y="570" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#E7EEF7" opacity="0.95">부동산정책</text>
</svg>
