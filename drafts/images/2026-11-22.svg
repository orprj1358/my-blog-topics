<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4E0"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="coinGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.68"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4A1D0A" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="260" fill="url(#glow1)"/>
  <circle cx="140" cy="540" r="260" fill="url(#glow2)"/>

  <!-- calendar + coin gauge, right side -->
  <g transform="translate(950,420)" filter="url(#softShadow)">
    <rect x="-95" y="-100" width="190" height="170" rx="20" fill="#FFF8EC"/>
    <rect x="-95" y="-100" width="190" height="40" rx="20" fill="url(#coinGrad2)"/>
    <circle cx="-55" cy="-100" r="8" fill="#7C2D12"/>
    <circle cx="55" cy="-100" r="8" fill="#7C2D12"/>
    <line x1="-70" y1="-45" x2="70" y2="-45" stroke="#F3D9AE" stroke-width="2"/>
    <line x1="-70" y1="-10" x2="70" y2="-10" stroke="#F3D9AE" stroke-width="2"/>
    <line x1="-70" y1="25" x2="70" y2="25" stroke="#F3D9AE" stroke-width="2"/>
    <circle cx="60" cy="40" r="34" fill="url(#coinGrad)"/>
    <text x="60" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#7C2D12" text-anchor="middle">%</text>
  </g>

  <!-- shrinking bar gauge badge cluster -->
  <g transform="translate(210,500)" filter="url(#softShadow)" opacity="0.97">
    <circle cx="-22" cy="0" r="46" fill="url(#coinGrad2)"/>
    <path d="M -48,16 L -22,-18 L 4,16 Z" fill="#FFF8EC"/>
  </g>

  <!-- title card -->
  <g transform="translate(80,70)">
    <rect x="-20" y="-55" width="800" height="280" rx="28" fill="url(#cardGrad)" filter="url(#softShadow)"/>
    <text x="10" y="0" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#6B2E0E">연말 가계대출 총량관리,</text>
    <text x="10" y="50" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#6B2E0E">연초 대출 계획 전 체크할 점</text>
    <rect x="10" y="78" width="150" height="10" rx="5" fill="#D97706"/>
  </g>

  <text x="80" y="570" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#FFF4E0" opacity="0.95">대출</text>
</svg>
