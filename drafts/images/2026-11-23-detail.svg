<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF3FA"/>
      <stop offset="100%" stop-color="#DCE6F5"/>
    </linearGradient>
    <linearGradient id="beforeCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCE8FA"/>
    </linearGradient>
    <linearGradient id="afterCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C9D9F2"/>
    </linearGradient>
    <linearGradient id="beforeBadge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9FC2EE"/>
      <stop offset="100%" stop-color="#3A5B8C"/>
    </linearGradient>
    <linearGradient id="afterBadge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6E8FC9"/>
      <stop offset="100%" stop-color="#1C2F52"/>
    </linearGradient>
    <linearGradient id="centerBadge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD98A"/>
      <stop offset="100%" stop-color="#E0A93A"/>
    </linearGradient>
    <linearGradient id="barBefore" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C4D5EC"/>
      <stop offset="100%" stop-color="#5A7FC0"/>
    </linearGradient>
    <linearGradient id="barAfter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7FA6E0"/>
      <stop offset="100%" stop-color="#15213F"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#15213F" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)"/>

  <text x="400" y="48" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#1C2F52" text-anchor="middle">최초 분담금 추정 vs 공사비 인상 후 분담금</text>
  <text x="400" y="74" font-family="Arial, sans-serif" font-size="13" fill="#5C6E94" text-anchor="middle">※ 이해를 돕기 위한 예시 개념도이며 실제 금액이 아닙니다</text>

  <!-- left card: before -->
  <g>
    <rect x="60" y="110" width="300" height="420" rx="22" fill="url(#beforeCard)" filter="url(#cardShadow)"/>
    <circle cx="210" cy="168" r="30" fill="url(#beforeBadge)"/>
    <text x="210" y="178" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#F3F7FC" text-anchor="middle">1</text>
    <text x="210" y="222" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#1C2F52" text-anchor="middle">최초 분담금 추정(예시)</text>

    <rect x="95" y="250" width="230" height="30" rx="10" fill="#E2EAF8"/>
    <rect x="95" y="250" width="110" height="30" rx="10" fill="url(#barBefore)"/>

    <circle cx="100" cy="330" r="13" fill="url(#beforeBadge)"/>
    <text x="100" y="335" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#F3F7FC" text-anchor="middle">1</text>
    <text x="124" y="335" font-family="Arial, sans-serif" font-size="14" fill="#2A3C5E">착공 전 설계안 기준 산정</text>

    <circle cx="100" cy="375" r="13" fill="url(#beforeBadge)"/>
    <text x="100" y="380" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#F3F7FC" text-anchor="middle">2</text>
    <text x="124" y="380" font-family="Arial, sans-serif" font-size="14" fill="#2A3C5E">당시 원자재·인건비 반영</text>

    <circle cx="100" cy="420" r="13" fill="url(#beforeBadge)"/>
    <text x="100" y="425" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#F3F7FC" text-anchor="middle">3</text>
    <text x="124" y="425" font-family="Arial, sans-serif" font-size="14" fill="#2A3C5E">조합원 안내용 예상치</text>

    <circle cx="100" cy="465" r="13" fill="url(#beforeBadge)"/>
    <text x="100" y="470" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#F3F7FC" text-anchor="middle">4</text>
    <text x="124" y="470" font-family="Arial, sans-serif" font-size="14" fill="#2A3C5E">사업 초기 자금계획 기준</text>
  </g>

  <!-- center arrow badge -->
  <circle cx="400" cy="320" r="30" fill="url(#centerBadge)" filter="url(#cardShadow)"/>
  <path d="M -10,0 L 10,0 M 2,-8 L 10,0 L 2,8" transform="translate(400,320)" fill="none" stroke="#4A3105" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- right card: after -->
  <g>
    <rect x="440" y="110" width="300" height="420" rx="22" fill="url(#afterCard)" filter="url(#cardShadow)"/>
    <circle cx="590" cy="168" r="30" fill="url(#afterBadge)"/>
    <text x="590" y="178" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#F3F7FC" text-anchor="middle">2</text>
    <text x="590" y="222" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#1C2F52" text-anchor="middle">공사비 인상 후(예시)</text>

    <rect x="475" y="250" width="230" height="30" rx="10" fill="#E2EAF8"/>
    <rect x="475" y="250" width="200" height="30" rx="10" fill="url(#barAfter)"/>

    <circle cx="480" cy="330" r="13" fill="url(#afterBadge)"/>
    <text x="480" y="335" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#F3F7FC" text-anchor="middle">1</text>
    <text x="504" y="335" font-family="Arial, sans-serif" font-size="14" fill="#2A3C5E">원자재·인건비 인상 반영</text>

    <circle cx="480" cy="375" r="13" fill="url(#afterBadge)"/>
    <text x="480" y="380" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#F3F7FC" text-anchor="middle">2</text>
    <text x="504" y="380" font-family="Arial, sans-serif" font-size="14" fill="#2A3C5E">설계변경·공사기간 연장 비용</text>

    <circle cx="480" cy="420" r="13" fill="url(#afterBadge)"/>
    <text x="480" y="425" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#F3F7FC" text-anchor="middle">3</text>
    <text x="504" y="425" font-family="Arial, sans-serif" font-size="14" fill="#2A3C5E">사업 후반부에 몰려 통보</text>

    <circle cx="480" cy="465" r="13" fill="url(#afterBadge)"/>
    <text x="480" y="470" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#F3F7FC" text-anchor="middle">4</text>
    <text x="504" y="470" font-family="Arial, sans-serif" font-size="14" fill="#2A3C5E">조합원 자금계획 재검토 필요</text>
  </g>

  <text x="400" y="570" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#5C6E94" text-anchor="middle">조합 측에 공사비 변동 근거를 구체적으로 확인해보기</text>
</svg>
