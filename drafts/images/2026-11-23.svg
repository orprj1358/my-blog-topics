<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7EEF7"/>
      <stop offset="50%" stop-color="#3A5B8C"/>
      <stop offset="100%" stop-color="#15213F"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8FB4E8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8FB4E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5A7FC0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5A7FC0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="craneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD98A"/>
      <stop offset="100%" stop-color="#E0A93A"/>
    </linearGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3F7FC"/>
      <stop offset="100%" stop-color="#C4D5EC"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9FC2EE"/>
      <stop offset="100%" stop-color="#3A5B8C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.68"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B1630" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="260" fill="url(#glow1)"/>
  <circle cx="130" cy="540" r="260" fill="url(#glow2)"/>

  <!-- crane + building icon, right side -->
  <g transform="translate(960,390)" filter="url(#softShadow)">
    <rect x="-70" y="-10" width="140" height="130" rx="10" fill="url(#houseGrad)"/>
    <rect x="-55" y="5" width="30" height="30" rx="4" fill="#3A5B8C"/>
    <rect x="5" y="5" width="30" height="30" rx="4" fill="#3A5B8C"/>
    <rect x="-55" y="45" width="30" height="30" rx="4" fill="#3A5B8C"/>
    <rect x="5" y="45" width="30" height="30" rx="4" fill="#3A5B8C"/>
    <line x1="40" y1="-150" x2="40" y2="20" stroke="#E0A93A" stroke-width="8" stroke-linecap="round"/>
    <line x1="40" y1="-150" x2="140" y2="-130" stroke="#E0A93A" stroke-width="8" stroke-linecap="round"/>
    <line x1="40" y1="-150" x2="-30" y2="-130" stroke="#E0A93A" stroke-width="8" stroke-linecap="round"/>
    <line x1="140" y1="-130" x2="140" y2="-95" stroke="#E0A93A" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- coin / won badge cluster, bottom-left -->
  <g transform="translate(220,500)" filter="url(#softShadow)" opacity="0.97">
    <circle cx="-22" cy="0" r="46" fill="url(#coinGrad)"/>
    <text x="-22" y="14" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#F3F7FC" text-anchor="middle">₩</text>
  </g>

  <!-- title card -->
  <g transform="translate(80,70)">
    <rect x="-20" y="-55" width="820" height="280" rx="28" fill="url(#cardGrad)" filter="url(#softShadow)"/>
    <text x="10" y="0" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#1C2F52">재건축 공사비 갈등 확산,</text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#1C2F52">커지는 조합원 분담금</text>
    <rect x="10" y="83" width="150" height="10" rx="5" fill="#3A5B8C"/>
  </g>

  <text x="80" y="570" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#E7EEF7" opacity="0.95">부동산정책</text>
</svg>
