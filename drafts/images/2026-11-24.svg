<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6ECFB"/>
      <stop offset="50%" stop-color="#3A4E9E"/>
      <stop offset="100%" stop-color="#121A3E"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5FE0C8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5FE0C8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8A7CF0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8A7CF0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2FBF2"/>
      <stop offset="100%" stop-color="#8FDCCB"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5FD6C6"/>
      <stop offset="100%" stop-color="#2C3F7E"/>
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9C8CF5"/>
      <stop offset="100%" stop-color="#2C3F7E"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.68"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B0E2C" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="260" fill="url(#glow1)"/>
  <circle cx="130" cy="540" r="260" fill="url(#glow2)"/>

  <!-- open network / nodes motif, right side -->
  <g transform="translate(940,410)" filter="url(#softShadow)">
    <rect x="-70" y="-70" width="140" height="140" rx="20" fill="url(#chipGrad)"/>
    <circle cx="0" cy="0" r="28" fill="url(#nodeGrad)"/>
    <circle cx="-95" cy="-95" r="11" fill="url(#nodeGrad2)"/>
    <circle cx="95" cy="-95" r="11" fill="url(#nodeGrad)"/>
    <circle cx="-95" cy="95" r="11" fill="url(#nodeGrad)"/>
    <circle cx="95" cy="95" r="11" fill="url(#nodeGrad2)"/>
    <line x1="-85" y1="-85" x2="-18" y2="-18" stroke="#2C3F7E" stroke-width="4"/>
    <line x1="85" y1="-85" x2="18" y2="-18" stroke="#2C3F7E" stroke-width="4"/>
    <line x1="-85" y1="85" x2="-18" y2="18" stroke="#2C3F7E" stroke-width="4"/>
    <line x1="85" y1="85" x2="18" y2="18" stroke="#2C3F7E" stroke-width="4"/>
  </g>

  <!-- unlocked badge, bottom-left: openness motif -->
  <g transform="translate(220,500)" filter="url(#softShadow)" opacity="0.97">
    <circle cx="0" cy="0" r="46" fill="url(#nodeGrad2)"/>
    <rect x="-16" y="-4" width="32" height="26" rx="6" fill="#F3F0FF"/>
    <path d="M -12,-4 L -12,-16 A 12,12 0 0 1 10,-20" fill="none" stroke="#F3F0FF" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="9" r="4" fill="#2C3F7E"/>
  </g>

  <!-- title card -->
  <g transform="translate(80,70)">
    <rect x="-20" y="-55" width="820" height="260" rx="28" fill="url(#cardGrad)" filter="url(#softShadow)"/>
    <text x="10" y="-5" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#1B2550">오픈소스 AI 모델 경쟁 심화,</text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#1B2550">국내 기업들의 대응 전략은</text>
    <rect x="10" y="82" width="150" height="10" rx="5" fill="#4C5FD1"/>
  </g>

  <text x="80" y="570" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#E6ECFB" opacity="0.95">AI 관련 소식</text>
</svg>
