<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="50%" stop-color="#E08A33"/>
      <stop offset="100%" stop-color="#5A3410"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD37A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFD37A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8A5B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF8A5B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE9B8"/>
      <stop offset="100%" stop-color="#E7A23E"/>
    </linearGradient>
    <linearGradient id="coinGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB37A"/>
      <stop offset="100%" stop-color="#C9622C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3A1E05" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="260" fill="url(#glow1)"/>
  <circle cx="130" cy="540" r="260" fill="url(#glow2)"/>

  <!-- stacked coins / percent badge motif, right side -->
  <g transform="translate(950,420)" filter="url(#softShadow)">
    <ellipse cx="0" cy="55" rx="95" ry="26" fill="url(#coinGrad2)"/>
    <ellipse cx="0" cy="20" rx="95" ry="26" fill="url(#coinGrad)"/>
    <ellipse cx="0" cy="-15" rx="95" ry="26" fill="url(#coinGrad2)"/>
    <circle cx="10" cy="-95" r="48" fill="url(#coinGrad)"/>
    <text x="10" y="-85" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#7A3B10" text-anchor="middle">%</text>
  </g>

  <!-- small arrow / shift motif, bottom-left -->
  <g transform="translate(200,500)" filter="url(#softShadow)" opacity="0.97">
    <circle cx="0" cy="0" r="46" fill="url(#coinGrad2)"/>
    <path d="M -22,8 L 10,8 L 10,-10 L 26,10 L 10,30 L 10,16 L -22,16 Z" fill="#FFF6E8"/>
  </g>

  <!-- title card -->
  <g transform="translate(80,70)">
    <rect x="-20" y="-55" width="860" height="260" rx="28" fill="url(#cardGrad)" filter="url(#softShadow)"/>
    <text x="10" y="-5" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#5A3410">제2금융권 가계대출 조이기,</text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#5A3410">풍선효과 우려 확산</text>
    <rect x="10" y="82" width="150" height="10" rx="5" fill="#E08A33"/>
  </g>

  <text x="80" y="570" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#FFF3E0" opacity="0.95">대출</text>
</svg>
