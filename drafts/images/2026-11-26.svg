<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F7F5"/>
      <stop offset="50%" stop-color="#2F6FB0"/>
      <stop offset="100%" stop-color="#121A3A"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7FE8D6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7FE8D6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8A7CFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8A7CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B8E9FF"/>
      <stop offset="100%" stop-color="#4C8FD9"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9FF0E3"/>
      <stop offset="100%" stop-color="#2FAE9B"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0A1230" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="260" fill="url(#glow1)"/>
  <circle cx="130" cy="540" r="260" fill="url(#glow2)"/>

  <!-- chip / network motif, right side -->
  <g transform="translate(960,420)" filter="url(#softShadow)">
    <rect x="-60" y="-60" width="120" height="120" rx="20" fill="url(#chipGrad)"/>
    <circle cx="0" cy="0" r="26" fill="#12284A"/>
    <circle cx="0" cy="0" r="14" fill="#9FF0E3"/>
    <line x1="-60" y1="-30" x2="-85" y2="-30" stroke="#B8E9FF" stroke-width="6" stroke-linecap="round"/>
    <line x1="60" y1="-30" x2="85" y2="-30" stroke="#B8E9FF" stroke-width="6" stroke-linecap="round"/>
    <line x1="-60" y1="30" x2="-85" y2="30" stroke="#B8E9FF" stroke-width="6" stroke-linecap="round"/>
    <line x1="60" y1="30" x2="85" y2="30" stroke="#B8E9FF" stroke-width="6" stroke-linecap="round"/>
    <line x1="-30" y1="-60" x2="-30" y2="-85" stroke="#B8E9FF" stroke-width="6" stroke-linecap="round"/>
    <line x1="30" y1="-60" x2="30" y2="-85" stroke="#B8E9FF" stroke-width="6" stroke-linecap="round"/>
    <line x1="-30" y1="60" x2="-30" y2="85" stroke="#B8E9FF" stroke-width="6" stroke-linecap="round"/>
    <line x1="30" y1="60" x2="30" y2="85" stroke="#B8E9FF" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- node network motif, bottom-left -->
  <g transform="translate(200,500)" filter="url(#softShadow)" opacity="0.97">
    <circle cx="0" cy="0" r="46" fill="url(#nodeGrad)"/>
    <circle cx="-8" cy="-10" r="7" fill="#12284A"/>
    <circle cx="14" cy="4" r="7" fill="#12284A"/>
    <circle cx="-4" cy="18" r="7" fill="#12284A"/>
    <line x1="-8" y1="-10" x2="14" y2="4" stroke="#12284A" stroke-width="3"/>
    <line x1="14" y1="4" x2="-4" y2="18" stroke="#12284A" stroke-width="3"/>
    <line x1="-4" y1="18" x2="-8" y2="-10" stroke="#12284A" stroke-width="3"/>
  </g>

  <!-- title card -->
  <g transform="translate(80,70)">
    <rect x="-20" y="-55" width="860" height="260" rx="28" fill="url(#cardGrad)" filter="url(#softShadow)"/>
    <text x="10" y="-5" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#12284A">AI 에이전트 상용화 확산,</text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#12284A">기업 업무 자동화 지형이 바뀐다</text>
    <rect x="10" y="82" width="150" height="10" rx="5" fill="#2F6FB0"/>
  </g>

  <text x="80" y="570" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#E0F7F5" opacity="0.95">AI</text>
</svg>
