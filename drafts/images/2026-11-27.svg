<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="50%" stop-color="#E08A3C"/>
      <stop offset="100%" stop-color="#3A2110"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD9A0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFD9A0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8A5C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF8A5C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE3B0"/>
      <stop offset="100%" stop-color="#E0973F"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC08A"/>
      <stop offset="100%" stop-color="#D96A2B"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3A2110" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="260" fill="url(#glow1)"/>
  <circle cx="130" cy="540" r="260" fill="url(#glow2)"/>

  <!-- coin / percent motif, right side -->
  <g transform="translate(970,430)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="78" fill="url(#coinGrad)"/>
    <circle cx="0" cy="0" r="78" fill="none" stroke="#B9661F" stroke-width="5" stroke-dasharray="6 10"/>
    <text x="0" y="16" font-family="Arial, sans-serif" font-size="46" font-weight="800" fill="#7A3B10" text-anchor="middle">%</text>
  </g>

  <!-- coin stack motif, bottom-left -->
  <g transform="translate(190,500)" filter="url(#softShadow)" opacity="0.97">
    <ellipse cx="0" cy="34" rx="58" ry="20" fill="url(#badgeGrad)"/>
    <ellipse cx="0" cy="8" rx="58" ry="20" fill="url(#coinGrad)"/>
    <ellipse cx="0" cy="-18" rx="58" ry="20" fill="url(#badgeGrad)"/>
    <text x="0" y="-12" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#7A3B10" text-anchor="middle">₩</text>
  </g>

  <!-- title card -->
  <g transform="translate(80,70)">
    <rect x="-20" y="-55" width="860" height="260" rx="28" fill="url(#cardGrad)" filter="url(#softShadow)"/>
    <text x="10" y="-5" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#5A3010">중도상환수수료 완화 논의,</text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#5A3010">대출 갈아타기 부담 줄어드나</text>
    <rect x="10" y="82" width="150" height="10" rx="5" fill="#E08A3C"/>
  </g>

  <text x="80" y="570" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#FFF3E0" opacity="0.95">대출</text>
</svg>
